<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>天鷹保全 · 洽公證管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- QR 產生（固定版本；只在首頁顯示/列印 QR 時用到） -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#0A0C10; --surface:#0D0F14; --card:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.1); --gold:#D4A800; --gold2:#FFD700;
  --indigo:#818CF8; --success:#4ADE80; --danger:#F87171; --warn:#FB923C;
  --text:#F5F5F5; --muted:#8A95A8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh;}
.wrap{max-width:820px;margin:0 auto;padding:14px 13px 60px;}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.back{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 14px;border-radius:10px;text-decoration:none;display:flex;align-items:center;gap:5px;font-size:14px;min-height:44px;}
.hd-t{flex:1;text-align:center;}
.hd-t .t1{color:var(--gold);font-size:18px;font-weight:700;letter-spacing:1px;}
.hd-t .t2{color:var(--muted);font-size:10.5px;letter-spacing:2px;margin-top:2px;}
.ico-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:10px;min-width:46px;min-height:44px;font-size:19px;cursor:pointer;font-family:inherit;}

/* 大按鈕：申請換證 */
.big{width:100%;border:none;border-radius:18px;padding:26px 16px;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#D4A800 0%,#FFD700 100%);color:#0A0C10;
  font-size:28px;font-weight:900;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 8px 26px rgba(212,168,0,.28);margin-bottom:6px;min-height:84px;}
.big:active{transform:scale(.99);}
.big-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px;}

/* 統計卡 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px;}
.st{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 4px 8px;text-align:center;
  cursor:pointer;min-height:66px;font-family:inherit;color:inherit;}
.st.on{border-color:var(--gold);background:rgba(212,168,0,.1);}
.st .v{font-size:22px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;}
.st .k{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;}
.st.c-free .v{color:var(--success);} .st.c-out .v{color:var(--warn);} .st.c-pend .v{color:var(--indigo);}
.st.c-over .v{color:var(--danger);} .st.c-off .v{color:var(--muted);}
@media (max-width:420px){ .stats{gap:5px;} .st .v{font-size:19px;} .st .k{font-size:10px;} }

.bar{display:flex;gap:8px;margin-bottom:12px;}
input[type=text],input[type=tel],input[type=date],select{
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:11px 12px;border-radius:9px;font-size:16px;font-family:inherit;min-height:48px;width:100%;}
select option{background:#12151C;color:#F5F5F5;}
input[type=date]{color-scheme:dark;}
input:focus,select:focus{outline:none;border-color:var(--gold);}
.bar .q{flex:1;}
.act{border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:9px;padding:10px 13px;font-size:14px;font-family:inherit;cursor:pointer;min-height:44px;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.act-gold{border-color:rgba(212,168,0,.4);background:rgba(212,168,0,.15);color:var(--gold2);}
.act-red{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1);color:var(--danger);}
.act-grn{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.12);color:var(--success);}
.act-sm{padding:7px 11px;min-height:38px;font-size:13px;}

/* 洽公證列表：左編號、中資訊、最右狀態標籤 */
.list{display:flex;flex-direction:column;gap:8px;}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:10px 11px;}
.row.s-over{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.07);}
.row.s-out{border-color:rgba(251,146,60,.35);} .row.s-pend{border-color:rgba(129,140,248,.45);}
.row .no{font-size:24px;font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1.2;}
.row .info{min-width:0;font-size:13px;line-height:1.55;color:#CBD5E1;word-break:break-all;}
.row .info b{color:var(--text);font-size:14.5px;}
.row .info .idle{color:var(--muted);}
.row .ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;}
.tag{font-size:12.5px;font-weight:900;padding:4px 10px;border-radius:6px;white-space:nowrap;align-self:start;}
.tag.free{background:rgba(74,222,128,.14);color:var(--success);}
.tag.pend{background:rgba(129,140,248,.16);color:var(--indigo);}
.tag.out{background:rgba(251,146,60,.16);color:var(--warn);}
.tag.over{background:rgba(248,113,113,.18);color:var(--danger);animation:blink 1.2s steps(1,end) infinite;}
.tag.off{background:rgba(255,255,255,.08);color:var(--muted);}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.5}}
@media (prefers-reduced-motion: reduce){ .tag.over{animation:none;} }
.sec-h{font-size:13.5px;font-weight:700;color:var(--muted);margin:16px 0 8px;}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 12px;line-height:1.8;}
.lock{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 16px;text-align:center;
  color:var(--muted);font-size:14px;line-height:1.8;margin-top:6px;}
.lock i{font-size:30px;display:block;margin-bottom:6px;color:var(--gold);}

/* 視窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
.mask.center{align-items:center;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:16px 16px 26px;}
.modal h3{margin:0 0 14px;font-size:17px;color:var(--gold2);display:flex;align-items:center;gap:8px;}
.qrbox{background:#fff;border-radius:16px;padding:10px;max-width:340px;margin:6px auto 12px;}
.qrbox svg{display:block;width:100%;height:auto;}
.hint{font-size:13px;color:var(--muted);line-height:1.7;text-align:center;}

/* 廠商填表／完成畫面 */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px;}
.fld{margin-bottom:13px;}
.fld label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px;}
.fld label b{color:var(--danger);}
.fld .ro{background:rgba(255,255,255,.03);border:1px dashed var(--border);border-radius:9px;padding:13px 12px;font-size:16px;}
.btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:900;font-family:inherit;
  cursor:pointer;min-height:54px;background:linear-gradient(135deg,#D4A800,#FFD700);color:#0A0C10;}
.btn:disabled{opacity:.5;}
.bad{border-color:var(--danger) !important;}
.res{text-align:center;}
.res .lbl{font-size:14px;color:var(--muted);letter-spacing:2px;}
.res .num{font-size:92px;font-weight:900;line-height:1.05;color:var(--gold2);font-variant-numeric:tabular-nums;margin:4px 0 8px;}
.res .kv{text-align:left;margin:10px auto 0;max-width:340px;font-size:16px;line-height:2;}
.res .kv span{color:var(--muted);display:inline-block;width:64px;}
.banner{border-radius:12px;padding:12px;font-size:15px;font-weight:700;line-height:1.6;margin:12px 0;}
.banner.pend{background:rgba(129,140,248,.16);color:var(--indigo);}
.banner.out{background:rgba(251,146,60,.16);color:var(--warn);}
.banner.dead{background:rgba(255,255,255,.08);color:var(--muted);}
.res.dead .num,.res.dead .kv{opacity:.35;text-decoration:line-through;}
.clock{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text);margin-top:6px;}
.errbox{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--danger);
  border-radius:12px;padding:16px;text-align:center;font-size:14px;line-height:1.7;margin-bottom:12px;}
#twrap{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;}
.t-ok{background:#22C55E;color:#fff;} .t-err{background:#E53E3E;color:#fff;} .t-inf{background:#334155;color:#fff;}

/* 回到最上面浮動按鈕（右下角；捲動超過一屏才出現） */
.totop{position:fixed;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:50;width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(212,168,0,.5);background:linear-gradient(135deg,#D4A800,#FFD700);color:#0A0C10;font-size:24px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.55);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;font-family:inherit;}
.totop.show{opacity:1;transform:none;pointer-events:auto;}
.totop:active{transform:scale(.94);}
@media (prefers-reduced-motion: reduce){ .totop{transition:none;} }

/* 列印 A4 海報：只印 #poster */
#poster{display:none;}
@media print{
  body.printing > *{display:none !important;}
  body.printing #poster{display:block !important;position:static;background:#fff;color:#000;text-align:center;padding:10mm;}
  body.printing #poster h1{font-size:44px;margin:6mm 0 2mm;}
  body.printing #poster .sub{font-size:22px;margin-bottom:8mm;}
  body.printing #poster .pq{width:140mm;margin:0 auto 8mm;}
  body.printing #poster .pq svg{width:100%;height:auto;display:block;}
  body.printing #poster ol{display:inline-block;text-align:left;font-size:22px;line-height:1.9;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="totop" id="toTop" type="button" aria-label="回到最上面" onclick="scrollToTop()"><i class="ti ti-arrow-up"></i></button>
<div id="modal"></div>
<div id="twrap"></div>
<div id="poster"></div>

<script>
/* ════════════════════════════════════════════════════════════════════
   天鷹保全 · 洽公證管理（2026-11-02）
   流程：固定 QR（桌上海報／首頁大按鈕全螢幕顯示）→ 廠商掃碼填資料 → 送出當下配號（300~600）
        → 完成畫面（姓名+電話+編號，即時顯示狀態）→ 保全核對後「確認發證」→ 還證時「已繳回」。
   三種畫面（看網址參數）：
     ?form=1   廠商填表（免登入）      ?r=<token>  完成畫面（免登入，重整可還原）
     （無參數）首頁：大按鈕公開；下方保全管理區需登入（統計／300~600 清單／歷史查詢）
   權限：申請＝公開；確認發證、已繳回、取消、停用、查詢＝登入且有工具權限（id26）。
        前端只是方便；真正的把關在 洽公證管理_GAS.gs 每個 action 驗 token。
   ════════════════════════════════════════════════════════════════════ */

var VISITOR_GAS_URL = 'https://script.google.com/macros/s/AKfycbxX_wK0PBxZkIqW1jQ2oBwl6K-1pQ5HBpMGTyrC28l6AMYsORIrv69qBQ7vXhUzEYp9Mg/exec';
var PUBLIC_FORM_URL = 'https://sky03104.github.io/tianying-security/tool_visitor.html?form=1'; // 固定 QR 的內容
var VISITOR_TOOL_ID = 26;
var NO_MIN = 300, NO_MAX = 600;                 // 與 GAS 同值
var HOLD_MIN = 30;                              // 待領證幾分鐘內要領取（與 GAS 同值）
var FLOORS = ['B2F','B1F','1F','2F','3F','4F','5F','6F','7F','8F','9F','10F','其他']; // 與 GAS 同值
var ALL_ROLES = ['parttime','fulltime','leader','vicecaptain','captain','executive','admin'];

/* ════════════════ 核心邏輯（純函式，可用 node 直接測） ════════════════ */
function normKey(s){ return String(s==null?'':s).replace(/\s+/g,'').toUpperCase(); }
/* 電話規則必須跟 GAS 的 normPhone_ 一模一樣：手機 09xxxxxxxx 或市話 0[2-8]xxxxxxx(x)；不合法回 '' */
function normPhone(s){
  var d = String(s==null?'':s).replace(/[\s\-()（）]/g,'');
  if(/^09\d{8}$/.test(d) || /^0[2-8]\d{7,8}$/.test(d)) return d;
  return '';
}
/* 驗證規則同 GAS validateRequest_。回傳 { ok, msg, field } */
function validateForm(d){
  var floor = String(d.floor||'').trim();
  var shop = String(d.shop||'').replace(/\s+/g,' ').trim();
  var name = String(d.name||'').replace(/\s+/g,' ').trim();
  if(FLOORS.indexOf(floor) < 0) return { ok:false, field:'f-floor', msg:'請選擇樓層' };
  if(shop.length < 1 || shop.length > 40) return { ok:false, field:'f-shop', msg:'請填寫專櫃或廠商名稱（40 字以內）' };
  if(name.length < 1 || name.length > 20) return { ok:false, field:'f-name', msg:'請填寫姓名（20 字以內）' };
  if(!normPhone(d.phone)) return { ok:false, field:'f-phone', msg:'電話格式不對（手機 09 開頭共 10 碼，或市話含區碼）' };
  return { ok:true, v:{ floor:floor, shop:shop, name:name, phone:normPhone(d.phone) } };
}
/* 把 300~600 每張證對上「目前占用中的紀錄」。state：free 未借出／pend 待領證／out 已借出／over 逾期未還／off 停用 */
function buildCards(min, max, active, disabled){
  var byNo = {}, off = {};
  (active||[]).forEach(function(r){ byNo[r.no] = r; });
  (disabled||[]).forEach(function(x){ off[x.no] = x; });
  var out = [];
  for(var n = min; n <= max; n++){
    var r = byNo[n], state = 'free';
    if(off[n]) state = 'off';
    else if(r) state = r.status === '已申請' ? 'pend' : (r.overdue ? 'over' : 'out');
    out.push({ no:n, state:state, rec:off[n] ? null : (r||null), note: off[n] ? off[n].note : '' });
  }
  return out;
}
var STATE_LABEL = { free:'未借出', pend:'待領證', out:'已借出', over:'逾期未還', off:'停用' };
function calcStats(cards){
  var s = { free:0, pend:0, out:0, over:0, off:0 };
  cards.forEach(function(c){ s[c.state]++; });
  s.outAll = s.out + s.over;          // 「已借出」統計含逾期
  return s;
}
function recMatch(r, kw){
  if(!kw) return true;
  var k = normKey(kw);
  return String(r.no) === k || normKey(r.name).indexOf(k) >= 0 || normKey(r.shop).indexOf(k) >= 0 ||
         normKey(r.phone).indexOf(k) >= 0 || normKey(r.floor) === k;
}
/* filter：'' 全部｜free｜out（含逾期）｜pend｜over｜off */
function filterCards(cards, filter, q){
  var kw = String(q||'').trim();
  return cards.filter(function(c){
    if(filter === 'out'){ if(c.state !== 'out' && c.state !== 'over') return false; }
    else if(filter && c.state !== filter) return false;
    if(!kw) return true;
    if(String(c.no) === normKey(kw)) return true;
    return c.rec ? recMatch(c.rec, kw) : false;
  });
}
function hm(ts){ return /^\d{4}-\d{2}-\d{2} (\d{2}:\d{2})/.test(String(ts||'')) ? String(ts).slice(11,16) : ''; }
function tsMs(ts){
  if(!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/.test(String(ts||''))) return NaN;
  var t = String(ts).replace(' ','T'); if(t.length === 16) t += ':00';
  return new Date(t + '+08:00').getTime();
}
function deadlineHM(appliedAt){
  var t = tsMs(appliedAt); if(!isFinite(t)) return '';
  return new Intl.DateTimeFormat('zh-TW',{ timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date(t + HOLD_MIN*60000));
}
/* QR → SVG 字串（自己用 isDark 畫，不依賴函式庫的 createSvgTag；白底+黑格，列印也清楚） */
function qrSvg(text){
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), m = 4, d = '';
  for(var r = 0; r < n; r++) for(var c = 0; c < n; c++) if(q.isDark(r, c)) d += 'M' + (c+m) + ' ' + (r+m) + 'h1v1h-1z';
  var size = n + m*2;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' +
         '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

try{ if(typeof module !== 'undefined') module.exports = {
  normKey:normKey, normPhone:normPhone, validateForm:validateForm, buildCards:buildCards, calcStats:calcStats,
  filterCards:filterCards, recMatch:recMatch, hm:hm, deadlineHM:deadlineHM, FLOORS:FLOORS }; }catch(e){}

/* ════════════════ 以下為畫面與通訊 ════════════════ */
if (typeof document !== 'undefined') {

var S = { cards:[], active:[], disabled:[], todayDone:[], filter:'', loaded:false, user:null, timer:null, fetching:false };
var P = new URLSearchParams(location.search);
var MY_TOKEN_KEY = 'visitor_my_token';
/* 從保全首頁按「在本機填寫」進來時帶 local=1（與 empId），表單／完成畫面才顯示「返回」；
   廠商自己掃 QR 進來沒有這個參數（沒有 App 可返回，直接關掉分頁即可）。 */
function qs_(pairs){
  var o = [];
  Object.keys(pairs).forEach(function(k){ if(pairs[k]) o.push(k + '=' + encodeURIComponent(pairs[k])); });
  ['empId','local'].forEach(function(k){ if(pairs[k] === undefined && P.get(k)) o.push(k + '=' + encodeURIComponent(P.get(k))); });
  return '?' + o.join('&');
}
function backBtnHtml_(){
  if(P.get('local') !== '1') return '';
  var emp = P.get('empId') || '';
  return '<a class="back" href="' + esc(location.pathname + (emp ? '?empId=' + encodeURIComponent(emp) : '')) + '"><i class="ti ti-arrow-left"></i>返回</a>';
}
var PROFILE_KEY = 'visitor_profile';     // 記在這支手機上的常用資料（樓層/專櫃/姓名/電話），不上傳
function loadProfile(){
  try { var p = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null'); return (p && typeof p === 'object') ? p : {}; } catch(e){ return {}; }
}
function saveProfile(v){
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify({ floor:v.floor, shop:v.shop, name:v.name, phone:v.phone })); } catch(e){}
}
function clearProfile(){
  try { localStorage.removeItem(PROFILE_KEY); } catch(e){}
  ['f-shop','f-name','f-phone'].forEach(function(i){ if($(i)) $(i).value = ''; });
  if($('f-floor')) $('f-floor').value = '';
  var b = $('f-clear'); if(b) b.style.display = 'none';
  toast('已清除這支手機記住的資料', 'inf');
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
function getSessionUser(){ try { return JSON.parse(localStorage.getItem('hsh_session_user') || 'null'); } catch(e){ return null; } }
function getAuthToken(){ try { return localStorage.getItem('hsh_auth_token') || ''; } catch(e){ return ''; } }
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k, v){ try { if(v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e){} }
function toast(msg, type){
  var d = document.createElement('div');
  d.className = 'toast ' + (type==='ok'?'t-ok':type==='err'?'t-err':'t-inf');
  d.textContent = msg; $('twrap').appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 3200);
}
function closeModal(){ $('modal').innerHTML = ''; }
function gasReady(){ return /^https:\/\//.test(VISITOR_GAS_URL); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function fetchJson_(url, opt){
  var ctl = window.AbortController ? new AbortController() : null;
  var t = ctl ? setTimeout(function(){ ctl.abort(); }, 25000) : 0;
  var o = opt || {}; if(ctl) o.signal = ctl.signal;
  return fetch(url, o).then(function(r){ return r.json(); })
    .catch(function(e){ throw (e && e.name === 'AbortError') ? new Error('伺服器回應逾時，請稍後再試') : e; })
    .finally(function(){ clearTimeout(t); });
}
/* 公開 action（免登入） */
async function pubPost(action, data){
  if(!gasReady()) throw new Error('系統尚未設定完成，請洽保全櫃檯');
  var body = new URLSearchParams(); body.append('action', action); body.append('data', JSON.stringify(data||{}));
  var d = await fetchJson_(VISITOR_GAS_URL, { method:'POST', body:body });
  if(d.status !== 'ok'){ var e = new Error(d.msg || '未知錯誤'); e.code = d.code; throw e; }
  return d;
}
function pubGetRequest(t){
  if(!gasReady()) return Promise.reject(new Error('系統尚未設定完成'));
  return fetchJson_(VISITOR_GAS_URL + '?action=getRequest&t=' + encodeURIComponent(t)).then(function(d){
    if(d.status !== 'ok') throw new Error(d.msg || '讀取失敗'); return d; });
}
/* 管理 action（要登入） */
async function api(action, data){
  var body = new URLSearchParams(); body.append('action', action); body.append('token', getAuthToken());
  body.append('data', JSON.stringify(data||{}));
  var d = await fetchJson_(VISITOR_GAS_URL, { method:'POST', body:body });
  if(d.status !== 'ok'){ var e = new Error(d.msg || '未知錯誤'); e.code = d.code; throw e; }
  return d;
}
function adminGet(action, data){
  var u = VISITOR_GAS_URL + '?action=' + action + '&token=' + encodeURIComponent(getAuthToken()) +
          (data ? '&data=' + encodeURIComponent(JSON.stringify(data)) : '');
  return fetchJson_(u).then(function(d){
    if(d.status !== 'ok'){ var e = new Error(d.msg || '讀取失敗'); e.code = d.code; throw e; } return d; });
}

  ['f-floor','f-shop','f-name','f-phone'].forEach(function(i){ $(i).classList.remove('bad'); });

/* ───────────── 完成畫面（即時狀態，防舊截圖冒用） ───────────── */
var R = { token:'', rec:null, offset:0, poll:null, tick:null };
function stopResult(){ clearInterval(R.poll); clearInterval(R.tick); R.poll = R.tick = null; }
function startResult(token, rec){
  stopResult(); R.token = token; R.rec = rec || null;
  if(rec && rec.now) R.offset = rec.now - Date.now();
  drawResult();
  R.tick = setInterval(drawClock, 1000);
  R.poll = setInterval(pollResult, 5000);
  if(!rec) pollResult();
}
function drawClock(){
  var el = $('clock'); if(!el) return;
  el.textContent = new Intl.DateTimeFormat('zh-TW',{ timeZone:'Asia/Taipei', hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' })
    .format(new Date(Date.now() + R.offset));
}
async function pollResult(){
  try {
    var d = await pubGetRequest(R.token);
    if(d.now) R.offset = d.now - Date.now();
    if(d.gone){ R.rec = { gone:true }; }
    else R.rec = d.rec;
    drawResult();
  } catch(e){ /* 暫時連不上就維持原畫面，下一輪再試 */ }
}
function drawResult(){
  var r = R.rec;
  if(!r){ $('app').innerHTML = '<div class="card res"><div class="hint">讀取中…</div><div class="clock" id="clock"></div></div>'; drawClock(); return; }
  var dead = r.gone || ['已繳回','已取消','已逾時'].indexOf(r.status) >= 0;
  var banner, cls = 'dead';
  if(r.gone) banner = '此申請已失效（查無資料）';
  else if(r.status === '已申請'){ cls = 'pend'; banner = '請持此畫面與證件到保全櫃檯換證<br>請於 ' + esc(deadlineHM(r.appliedAt)) + ' 前領取，逾時號碼會自動釋放'; }
  else if(r.status === '已借出'){ cls = 'out'; banner = '已發證 ' + esc(hm(r.issuedAt)) + '，離開時請歸還洽公證'; }
  else if(r.status === '已繳回') banner = '此洽公證已繳回，畫面失效';
  else if(r.status === '已取消') banner = '此申請已取消，如需換證請重新掃碼';
  else banner = '此申請已逾時失效，如需換證請重新掃碼';
  var body = r.gone ? '' :
    '<div class="lbl">洽公證編號</div><div class="num">' + esc(r.no) + '</div>' +
    '<div class="kv"><div><span>姓名</span>' + esc(r.name) + '</div><div><span>電話</span>' + esc(r.phone) + '</div>' +
    '<div><span>樓層</span>' + esc(r.floor) + '</div><div><span>專櫃</span>' + esc(r.shop) + '</div>' +
    '<div><span>日期</span>' + esc(r.date) + '</div></div>';
  $('app').innerHTML =
    '<div class="hd">' + backBtnHtml_() + '<div class="hd-t"><div class="t1">洽公證申請</div><div class="t2">TIANYING SECURITY</div></div></div>' +
    '<div class="card res' + (dead ? ' dead' : '') + '">' + body +
    '<div class="banner ' + cls + '">' + banner + '</div>' +
    '<div class="hint">目前時間（台北）</div><div class="clock" id="clock"></div>' +
    (dead ? '<button class="btn" style="margin-top:14px" onclick="newApply()">重新申請</button>' : '') +
    '</div>';
  drawClock();
}
function newApply(){
  stopResult(); lsSet(MY_TOKEN_KEY, '');

/* ───────────── 首頁（大按鈕＋保全管理區） ───────────── */
function 有使用權限(role){
  if(role === 'admin') return true;
  try{
    var p = JSON.parse(localStorage.getItem('tianying_perms') || 'null');
    if(p && Array.isArray(p[role])) return p[role].indexOf(VISITOR_TOOL_ID) >= 0;
  }catch(e){}
  return ALL_ROLES.indexOf(role) >= 0;
}
function loggedIn(){
  var u = getSessionUser();
  return !!(u && u.empId && getAuthToken() && 有使用權限(u.role));
}

  if(!loggedIn()){

  loadAll(false);
  clearInterval(S.timer);
  S.timer = setInterval(function(){ if(!document.hidden && !$('modal').innerHTML) loadAll(false); }, 5000);

async function loadAll(manual){
  if(S.fetching || !loggedIn()) return;
  S.fetching = true;
  try {
    var d = await adminGet('getAll');
    S.active = d.active || []; S.disabled = d.disabled || []; S.todayDone = d.todayDone || [];
    S.cards = buildCards(d.min || NO_MIN, d.max || NO_MAX, S.active, S.disabled);
    S.loaded = true; renderStats(); renderList();
    if(manual) toast('✓ 已更新', 'ok');
  } catch(e){
    if(!S.loaded && $('list')) $('list').innerHTML = '<div class="errbox">載入失敗：' + esc(e.message) + '</div>';
    else if(manual || e.code === 'INVALID') toast('✗ ' + e.message, 'err');
  } finally { S.fetching = false; }
}
var STAT_DEF = [['free','未借出'],['out','已借出'],['pend','待領證'],['over','逾期'],['off','停用']];
function renderStats(){
  var s = calcStats(S.cards), box = $('statsBox'); if(!box) return;
  box.innerHTML = '<div class="stats">' + STAT_DEF.map(function(d){
    var v = d[0] === 'out' ? s.outAll : s[d[0]];
    return '<button class="st c-' + d[0] + (S.filter === d[0] ? ' on' : '') + '" onclick="setFilter(\'' + d[0] + '\')">' +
           '<div class="v">' + v + '</div><div class="k">' + d[1] + '</div></button>';
  }).join('') + '</div>';
}
function setFilter(k){ S.filter = (S.filter === k) ? '' : k; renderStats(); renderList(); }
function rowHtml(c){
  var r = c.rec, info, ops = '';
  if(c.state === 'free') info = '<span class="idle">未借出</span>';
  else if(c.state === 'off') info = '<span class="idle">已停用' + (c.note ? '：' + esc(c.note) : '') + '</span>';
  else {
    info = '<b>' + esc(r.name) + '</b>　' + esc(r.phone) + '<br>' + esc(r.floor) + '　' + esc(r.shop) +
           '<br>' + (r.status === '已申請' ? '申請 ' + esc(hm(r.appliedAt)) + '（' + esc(deadlineHM(r.appliedAt)) + ' 前未領自動釋放）'
                                          : '發證 ' + esc(hm(r.issuedAt)) + '・' + esc(r.issuedBy));
    if(r.status === '已申請') ops = '<button class="act act-gold act-sm" onclick="doIssue(' + r.id + ')"><i class="ti ti-id-badge-2"></i>確認發證</button>' +
                                    '<button class="act act-red act-sm" onclick="doCancel(' + r.id + ')">取消</button>';
    else ops = '<button class="act act-grn act-sm" onclick="doReturn(' + r.id + ')"><i class="ti ti-arrow-back-up"></i>已繳回</button>';
  }
  if(c.state === 'free') ops = '<button class="act act-sm" onclick="doDisable(' + c.no + ',true)">停用／遺失</button>';
  if(c.state === 'off') ops = '<button class="act act-sm" onclick="doDisable(' + c.no + ',false)">恢復可用</button>';
  return '<div class="row s-' + c.state + '"><div class="no">' + c.no + '</div><div class="info">' + info +
         (ops ? '<div class="ops">' + ops + '</div>' : '') + '</div><div class="tag ' + c.state + '">' + STATE_LABEL[c.state] + '</div></div>';
}
function renderList(){
  var box = $('list'); if(!box) return;
  var q = $('q') ? $('q').value : '';
  var rows = filterCards(S.cards, S.filter, q);
  box.innerHTML = rows.length ? rows.map(rowHtml).join('') : '<div class="empty">沒有符合的洽公證</div>';
  var done = $('doneBox');
  if(done) done.innerHTML = S.todayDone.length
    ? '<div class="sec-h">今日已完成（' + S.todayDone.length + '）</div><div class="list">' + S.todayDone.map(function(r){
        return '<div class="row"><div class="no">' + r.no + '</div><div class="info"><b>' + esc(r.name) + '</b>　' + esc(r.phone) +
               '<br>' + esc(r.floor) + '　' + esc(r.shop) + '</div><div class="tag off">' + esc(r.status) + '</div></div>'; }).join('') + '</div>'
    : '';
}
async function act_(fn, okMsg){
  try { var d = await fn(); toast('✓ ' + (d.msg || okMsg), 'ok'); } catch(e){ toast('✗ ' + e.message, 'err'); }
  await loadAll(false);
}
function findRec_(id){ for(var i = 0; i < S.active.length; i++) if(S.active[i].id === id) return S.active[i]; return null; }
function doIssue(id){ act_(function(){ return api('confirmIssue', { id:id }); }, '已確認發證'); }
function doReturn(id){
  var r = findRec_(id);
  if(r && !window.confirm('確認收回 ' + r.no + ' 號洽公證？\n' + r.name + '（' + r.shop + '）')) return;
  act_(function(){ return api('returnPass', { id:id }); }, '已繳回');
}
function doCancel(id){
  if(!window.confirm('確定取消這筆申請？號碼會立刻釋放。')) return;
  act_(function(){ return api('cancelRequest', { id:id }); }, '已取消');
}
function doDisable(no, dis){
  var note = '';
  if(dis){ note = window.prompt(no + ' 號停用（例如遺失、損壞）。請輸入原因：', ''); if(note === null) return; }
  act_(function(){ return api('setCardDisabled', { no:no, disabled:dis, note:note }); }, dis ? '已停用' : '已恢復');
}

/* ───────────── 歷史查詢＋匯出 ───────────── */
var H = { rows:[] };
function openHistory(){
  $('modal').innerHTML = '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">' +
    '<h3><i class="ti ti-history"></i>歷史查詢</h3>' +
    '<div class="fld"><label>關鍵字（編號／姓名／電話／專櫃，可空白）</label><input type="text" id="h-q"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><div class="fld"><label>起日</label><input type="date" id="h-from"></div>' +
    '<div class="fld"><label>迄日</label><input type="date" id="h-to"></div></div>' +
    '<div style="display:flex;gap:8px"><button class="btn" style="flex:1" id="h-go" onclick="runHistory()">查詢</button>' +
    '<button class="act" onclick="exportXlsx()"><i class="ti ti-file-spreadsheet"></i>匯出</button>' +
    '<button class="act" onclick="closeModal()">關閉</button></div><div id="h-res" style="margin-top:14px"></div></div></div>';
}
async function runHistory(){
  var b = $('h-go'); b.disabled = true; b.textContent = '查詢中…';
  try {
    var d = await adminGet('search', { q:$('h-q').value.trim(), from:$('h-from').value, to:$('h-to').value });
    H.rows = d.records || [];
    var warn = d.archiveError ? '<div class="errbox">⚠ ' + esc(d.archiveError) + '<br>以下只含近 30 天資料，不代表 30 天前沒有紀錄。</div>' : '';
    var more = d.truncated ? '<div class="hint">30 天前的結果超過 300 筆只顯示一部分，請縮小日期或加關鍵字。</div>' : '';
    $('h-res').innerHTML = warn + more + '<div class="hint" style="text-align:left;margin-bottom:6px">共 ' + H.rows.length + ' 筆</div>' +
      '<div class="list">' + H.rows.map(function(r){
        return '<div class="row"><div class="no" style="font-size:20px">' + r.no + '</div><div class="info"><b>' + esc(r.name) + '</b>　' + esc(r.phone) +
               '<br>' + esc(r.floor) + '　' + esc(r.shop) + '<br>' + esc(r.date) + ' ' + esc(hm(r.appliedAt)) + '</div>' +
               '<div class="tag ' + (r.overdue ? 'over' : (r.status === '已借出' ? 'out' : r.status === '已申請' ? 'pend' : 'off')) + '">' + esc(r.overdue ? '逾期未還' : r.status) + '</div></div>'; }).join('') + '</div>';
  } catch(e){ $('h-res').innerHTML = '<div class="errbox">查詢失敗：' + esc(e.message) + '</div>'; }
  b.disabled = false; b.textContent = '查詢';
}
function loadXlsx_(){
  if(window.XLSX) return Promise.resolve();
  return new Promise(function(ok, bad){
    var s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = function(){ bad(new Error('匯出元件載入失敗，請檢查網路')); }; document.head.appendChild(s);
  });
}
async function exportXlsx(){
  if(!H.rows.length){ toast('請先查詢，有結果才能匯出', 'inf'); return; }
  try {
    await loadXlsx_();
    var aoa = [['編號','狀態','日期','樓層','專櫃或廠商','姓名','電話','申請時間','發證時間','發證人','繳回時間','繳回人','備註']];
    H.rows.forEach(function(r){ aoa.push([r.no, r.overdue ? '逾期未還' : r.status, r.date, r.floor, r.shop, r.name, r.phone,
      r.appliedAt, r.issuedAt, r.issuedBy, r.returnedAt, r.returnedBy, r.note]); });
    var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '洽公證紀錄');
    XLSX.writeFile(wb, '洽公證紀錄_' + todayStr() + '.xlsx');
    toast('✓ 已匯出 ' + H.rows.length + ' 筆', 'ok');
  } catch(e){ toast('✗ ' + e.message, 'err'); }
}

/* ───────────── 回到最上面 ───────────── */
function scrollToTop(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top:0, behavior: reduce ? 'auto' : 'smooth' });
}
function updateToTop(){
  var b = $('toTop'); if(!b) return;
  b.classList.toggle('show', (window.pageYOffset || document.documentElement.scrollTop || 0) > Math.max(300, window.innerHeight * 0.6));
}
window.addEventListener('scroll', updateToTop, { passive:true });

/* onclick 用到的函式一律明確掛到 window（包在 if 區塊內的 async function 不會自動變全域，onclick 會靜默失敗） */
window.scrollToTop = scrollToTop; window.submitForm = submitForm; window.clearProfile = clearProfile; window.newApply = newApply; window.showQr = showQr; window.printPoster = printPoster;
window.closeModal = closeModal; window.loadAll = loadAll; window.setFilter = setFilter; window.renderList = renderList;
window.doIssue = doIssue; window.doReturn = doReturn; window.doCancel = doCancel; window.doDisable = doDisable;
window.openHistory = openHistory; window.runHistory = runHistory; window.exportXlsx = exportXlsx;

/* ── 啟動 ── */
window.addEventListener('load', function(){
  var token = P.get('r');
  if(token){ startResult(token, null); return; }                 // 完成畫面（重整還原）
  if(P.get('form')){
    // 同一支手機若已有有效申請，直接顯示原畫面，不讓同裝置重複占號
    var mine = lsGet(MY_TOKEN_KEY);
    if(mine && gasReady()){
      pubGetRequest(mine).then(function(d){
        if(!d.gone && d.rec && (d.rec.status === '已申請' || d.rec.status === '已借出')){
          history.replaceState(null, '', location.pathname + qs_({ r:mine })); startResult(mine, d.rec);
        } else { lsSet(MY_TOKEN_KEY, ''); renderForm(); }
      }).catch(function(){ renderForm(); });
    } else renderForm();
    return;
  }
  renderHome();
});
}
</script>
