function applySph() {
  camera.position.set(
    sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(0, 0, 0);
}
applySph();

// ── 輝光紋理 ──────────────────────────────────────────────────
function buildGlowTex(hexColor, size) {
  size = size || 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d'), cx = size / 2;
  const g   = ctx.createRadialGradient(cx, cx, 0, cx, cx, cx);
  g.addColorStop(0.00, hexColor + 'ff');
  g.addColorStop(0.18, hexColor + 'ee');
  g.addColorStop(0.45, hexColor + '66');
  g.addColorStop(0.75, hexColor + '22');
  g.addColorStop(1.00, hexColor + '00');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = {};

    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const r  = 22 + Math.random() * 60;
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
    const t = Math.random();
    cols[i*3] = 0.7 + t*0.3; cols[i*3+1] = 0.75 + t*0.25; cols[i*3+2] = 0.9 + t*0.1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(cols, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.065, vertexColors: true, transparent: true, opacity: 0.55, sizeAttenuation: true,
  })));
})();

// ── 節點建立 ─────────────────────────────────────────────────
const SCALE      = 2.1;
const nodeGroup  = new THREE.Group();
scene.add(nodeGroup);
const hitMeshes  = [], coreMeshes = [], glowSprites = [];

const worldPos = NODES.map(n =>
  new THREE.Vector3(n.pos[0] * SCALE, n.pos[1] * SCALE, n.pos[2] * SCALE)
);

NODES.forEach((node, i) => {
  const tp = TOPICS[node.topic] || { color: '#ffffff' };
  const wp = worldPos[i];

  // 命中球（不可見）
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 8, 8),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hit.position.copy(wp);
  hit.userData.nodeIdx = i;
  nodeGroup.add(hit);
  hitMeshes.push(hit);

  // 核心球（可見）
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.058, 20, 20),
    new THREE.MeshBasicMaterial({ color: hex2num(tp.color) })
  );
  core.position.copy(wp);
  nodeGroup.add(core);
  coreMeshes.push(core);

  // 輝光 Sprite
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex[node.topic] || glowTex[Object.keys(TOPICS)[0]],
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  sp.position.copy(wp);
  sp.scale.set(0.56, 0.56, 1);
  sp.userData.highlighted = false;
  nodeGroup.add(sp);
  glowSprites.push(sp);
});

// ── 邊建立 ───────────────────────────────────────────────────
const edgeData = [];
EDGES.forEach(([a, b]) => {
  if (a >= NODES.length || b >= NODES.length) return;
  const same  = NODES[a].topic === NODES[b].topic;
  const alpha = same ? 0.32 : 0.12;
  const color = same ? hex2num(TOPICS[NODES[a].topic]?.color || '#ffffff') : 0x6B7280;
  const geo   = new THREE.BufferGeometry().setFromPoints([worldPos[a].clone(), worldPos[b].clone()]);
  const line  = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: alpha }));
  nodeGroup.add(line);
  edgeData.push({ line, a, b, sameTopic: same, baseAlpha: alpha, baseColor: color });
});

// ── Raycaster + Tooltip ──────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouseNDC  = new THREE.Vector2(-9, -9);
const tooltip   = document.getElementById('tooltip');
const tipTitle  = document.getElementById('tip-title');
const tipNote   = document.getElementById('tip-note');
const tipTopic  = document.getElementById('tip-topic');
const tipDot    = document.getElementById('tip-dot');
let txp = 0, typ = 0, hoveredIdx = -1;

function showTip(node, x, y) {
  const tp = TOPICS[node.topic] || { name: node.topic, color: '#ffffff' };
  tipTitle.textContent = node.title;
  tipTopic.textContent = tp.name;
  tipDot.style.background = tp.color;
  tipDot.style.boxShadow  = `0 0 6px ${tp.color}`;
  if (node.note && node.note.trim()) {
    tipNote.textContent    = node.note;
    tipNote.style.display  = 'block';
  } else {
    tipNote.style.display  = 'none';
  }
  const W = window.innerWidth, H = window.innerHeight;
  let tx = x + 18, ty = y - 10;
  if (tx + 240 > W) tx = x - 248;
  if (ty + 80  > H) ty = y - 84;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
  tooltip.classList.add('vis');
}
function hideTip() { tooltip.classList.remove('vis'); }

function setEdgeHL(idx, on) {
  edgeData.forEach(ed => {
    if (ed.a !== idx && ed.b !== idx) return;
    const other = (ed.a === idx) ? ed.b : ed.a;
    if (on) {
      ed.line.material.opacity = Math.min(0.9, ed.baseAlpha * 4.5);
      ed.line.material.color.setHex(hex2num(TOPICS[NODES[other].topic]?.color || '#ffffff'));
    } else {
      ed.line.material.opacity = ed.baseAlpha;
      ed.line.material.color.setHex(ed.baseColor);
    }
  });
}

// ── 相機控制 ─────────────────────────────────────────────────
let isDragging = false, lastPx = {x:0,y:0}, autoRotate = true, autoTimer = null;

function startDrag(x, y) { isDragging = true; lastPx = {x,y}; autoRotate = false; clearTimeout(autoTimer); canvas.style.cursor = 'grabbing'; }
function moveDrag(x, y)  {
  if (!isDragging) return;
  sph.theta -= (x - lastPx.x) * 0.0042;
  sph.phi   -= (y - lastPx.y) * 0.0042;
  sph.phi    = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi));
  lastPx = {x, y};
  applySph();
}
function endDrag()  { isDragging = false; canvas.style.cursor = 'grab'; autoTimer = setTimeout(() => { autoRotate = true; }, 5000); }
function doZoom(d)  { sph.r = Math.max(2.2, Math.min(11, sph.r + d * 0.0025)); applySph(); }

canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', e => {
  mouseNDC.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  txp = e.clientX; typ = e.clientY;
  moveDrag(e.clientX, e.clientY);
});
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('wheel', e => { e.preventDefault(); doZoom(e.deltaY); }, { passive: false });

let pinchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
  else if (e.touches.length === 2) { pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); isDragging = false; }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
  else if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); doZoom((pinchDist - d) * 1.8); pinchDist = d; }
}, { passive: true });
canvas.addEventListener('touchend', endDrag);
canvas.style.cursor = 'grab';

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── 航海日誌：角色人物系統 ───────────────────────────────────
const WORKFLOW_GAS_URL = 'https://script.google.com/macros/s/AKfycbzxjedGAbxj3G85zkybqoFoB-P7uQ9ycqdJZ7mzQ2Ax-vaxKgOTG60120PlGPbcNJpR/exec';

// 角色光暈顏色
const CHAR_COLORS = {
  '路飛':  '#D4A800',
  '索隆':  '#22C55E',
  '娜美':  '#FB923C',
  '烏索普':'#92400E',
  '山治':  '#1D4ED8',
  '布魯克':'#F5F5F5',
  '羅賓':  '#7C3AED',
  '喬巴':  '#F87171',
  '弗蘭奇':'#06B6D4',
  '甚平':  '#0D9488',
};

// 角色圖片（預載）
const CHAR_IMG_MAP = {
  '路飛': 'luffy.png', '索隆': 'zoro.png',   '娜美': 'nami.png',
  '烏索普':'usopp.png','山治': 'sanji.png',   '喬巴': 'chopper.png',
  '羅賓': 'robin.png', '弗蘭奇':'franky.png', '布魯克':'brook.png',
  '甚平': 'jinbe.png',
};
const CHAR_IMAGES = {};
Object.entries(CHAR_IMG_MAP).forEach(([role, file]) => {
  const img = new Image();
  img.src = file;
  CHAR_IMAGES[role] = img;
});

// 節點 → 角色映射（地盤）
const NODE_CHAR = {
  0:  '路飛',   // 主控台（黃金梅利號）
  1:  '烏索普', // 登入與角色系統
  3:  '羅賓',   // 事故報告工具
  4:  '喬巴',   // 匿名表揚/反應
  7:  '甚平',   // 明日哨表
  8:  '娜美',   // 班表查詢
  10: '弗蘭奇', // 資料上傳工具
  11: '索隆',   // 簽到/車輛/工作
  12: '山治',   // 請假申請
  29: '布魯克', // AI 小助手
};

// 活躍角色狀態（從航海日誌讀來）
let activeChars = {};     // { nodeId: { role, count, lastSeen } }
let lastFetch = 0;
const FETCH_INTERVAL = 60000; // 每 60 秒重新拉一次

async function fetchWorkflowData() {
  try {
    const res = await fetch(`${WORKFLOW_GAS_URL}?mode=recent&hours=24`);
    const data = await res.json();
    if (data.status === 'ok' && Array.isArray(data.data)) {
      const counts = {};
      data.data.forEach(r => {
        const nid = parseInt(r.nodeId);
        if (!counts[nid]) counts[nid] = { role: r.role, count: 0, lastSeen: r.timestamp };
        counts[nid].count++;
        if (r.timestamp > counts[nid].lastSeen) counts[nid].lastSeen = r.timestamp;
      });
      activeChars = counts;
    }
  } catch(e) { /* 靜默失敗，不影響地圖運作 */ }
}

// 初次載入拉資料
fetchWorkflowData();

// 2D Canvas overlay
const charCanvas = document.getElementById('char-canvas');
const charCtx    = charCanvas.getContext('2d');
charCanvas.width  = window.innerWidth;
charCanvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  charCanvas.width  = window.innerWidth;
  charCanvas.height = window.innerHeight;
});

// 把 3D 世界座標投影到螢幕座標，回傳 null 表示在相機背後
function worldToScreen(vec3) {
  const v = vec3.clone().project(camera);
  if (v.z > 1) return null; // 在相機背後，不畫
  return {
    x: (v.x + 1) / 2 * window.innerWidth,
    y: (1 - v.y) / 2 * window.innerHeight
  };
}

// 用角色圖片繪製人物（圖片預載後直接 drawImage）
function drawCharacter(ctx, x, y, role, count, alpha) {
  const glowColor = CHAR_COLORS[role] || '#D4A800';
  const img = CHAR_IMAGES[role];
  const iw = 80, ih = 80; // 顯示尺寸
  const ix = x - iw / 2;
  const iy = y - ih;      // 圖片底部對齊節點上方

  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);

  // 光暈
  const gr = ctx.createRadialGradient(x, y - ih * 0.5, 0, x, y - ih * 0.5, iw * 0.75);
  gr.addColorStop(0, glowColor + '55');
  gr.addColorStop(1, glowColor + '00');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x, y - ih * 0.5, iw * 0.75, 0, Math.PI * 2); ctx.fill();

  // 角色圖片
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, ix, iy, iw, ih);
  } else {
    // 圖片未載入：顯示彩色圓圈佔位
    ctx.fillStyle = glowColor + '88';
    ctx.beginPath(); ctx.arc(x, y - ih * 0.5, iw * 0.4, 0, Math.PI * 2); ctx.fill();
  }

  // 角色名
  ctx.fillStyle = '#F5F5F5'; ctx.strokeStyle = '#00000099'; ctx.lineWidth = 3;
  ctx.font = "bold 12px 'Microsoft JhengHei', sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.strokeText(role, x, y + 2);
  ctx.fillText(role, x, y + 2);

  // 活動計數氣泡
  if (count > 0) {
    const bx = x + iw * 0.38, bby = y - ih * 0.88;
    ctx.fillStyle = '#D4A800'; ctx.strokeStyle = '#0A0C10'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, bby, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0A0C10'; ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(count > 99 ? '99+' : String(count), bx, bby);
  }

  ctx.restore();
}
// 每格畫面更新人物
function drawAllCharacters() {
  charCtx.clearRect(0, 0, charCanvas.width, charCanvas.height);
  const now = Date.now();

  // 無論有無日誌，在各節點固定地盤顯示淡淡待機人物
  Object.entries(NODE_CHAR).forEach(([nodeIdStr, role]) => {
    const nodeId = parseInt(nodeIdStr);
    const nodeIdx = NODES.findIndex(n => n.id === nodeId);
    if (nodeIdx < 0) return;

    const wp  = worldPos[nodeIdx];
    const scr = worldToScreen(wp);

    // 在相機背後或螢幕外則跳過
    if (!scr) return;
    if (scr.x < -50 || scr.x > window.innerWidth + 50) return;
    if (scr.y < -50 || scr.y > window.innerHeight + 50) return;

    const activity = activeChars[nodeId];
    const count    = activity ? activity.count : 0;
    const alpha    = activity ? 0.95 : 0.75; // 有活動全亮，待機也清楚可見

    drawCharacter(charCtx, scr.x, scr.y - 28, role, count, alpha);
  });
}

// ── 動畫主迴圈 ──────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (autoRotate && !isDragging) { sph.theta += 0.0014; applySph(); }

  glowSprites.forEach((sp, i) => {
    const hl = sp.userData.highlighted;
    const s  = (hl ? 0.95 : 0.54) + Math.sin(t * (hl ? 2.2 : 1.3) + i * 0.68) * (hl ? 0.16 : 0.07);
    sp.scale.set(s, s, 1);
  });
  coreMeshes.forEach((core, i) => {
    const target = glowSprites[i].userData.highlighted ? 1.6 : 1.0;
    core.scale.setScalar(core.scale.x + (target - core.scale.x) * 0.12);
  });

  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(hitMeshes);
  if (hits.length > 0) {
    const idx = hits[0].object.userData.nodeIdx;
    if (idx !== hoveredIdx) {
      if (hoveredIdx !== -1) { glowSprites[hoveredIdx].userData.highlighted = false; setEdgeHL(hoveredIdx, false); }
      hoveredIdx = idx;
      glowSprites[idx].userData.highlighted = true;
      setEdgeHL(idx, true);
      showTip(NODES[idx], txp, typ);
    }
    if (!isDragging) canvas.style.cursor = 'pointer';
  } else {
    if (hoveredIdx !== -1) {
      glowSprites[hoveredIdx].userData.highlighted = false;
      setEdgeHL(hoveredIdx, false);
      hoveredIdx = -1;
      hideTip();
    }
    if (!isDragging) canvas.style.cursor = 'grab';
  }

  renderer.render(scene, camera);

  // 定時拉航海日誌（每 60 秒）
  const nowMs = Date.now();
  if (nowMs - lastFetch > FETCH_INTERVAL) {
    lastFetch = nowMs;
    fetchWorkflowData();
  }

  // 畫 2D 角色人物
  drawAllCharacters();
}
animate();
</script>
</body>
</html>
