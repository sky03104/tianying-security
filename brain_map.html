  );
  camera.lookAt(0, 0, 0);
}

// ── 輝光紋理 ──────────────────────────────────────────────────
function buildGlowTex(hexColor, size) {
  size = size || 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d'), cx = size / 2;
  const g   = ctx.createRadialGradient(cx, cx, 0, cx, cx, cx);
  g.addColorStop(0.00, hexColor + 'ff');
  g.addColorStop(0.18, hexColor + 'ee');
  g.addColorStop(0.45, hexColor + '66');
  g.addColorStop(0.75, hexColor + '22');
  g.addColorStop(1.00, hexColor + '00');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = {};
Object.keys(TOPICS).forEach(k => { glowTex[k] = buildGlowTex(TOPICS[k].color); });

// ── 星空 ─────────────────────────────────────────────────────
(function buildStars() {
  const N = 3000, pos = new Float32Array(N * 3), cols = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const r  = 22 + Math.random() * 60;
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
    const t = Math.random();
    cols[i*3] = 0.7 + t*0.3; cols[i*3+1] = 0.75 + t*0.25; cols[i*3+2] = 0.9 + t*0.1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(cols, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.065, vertexColors: true, transparent: true, opacity: 0.55, sizeAttenuation: true,
  })));
})();

// ── 無風帶星雲（偉大的航道，銀河雲海視覺）────────────────────────
// 2026-07-03 美化：改用柔光貼圖（借 buildGlowTex）取代硬邊方塊點，
// 並分「主霧層＋亮點層」兩層、粒子聚集成雲團而非均勻亂數散佈，
// 避免看起來像規則點陣
(function buildNebula() {
  const innerR = 3.4, outerR = 7.5, thicknessMax = 0.8, spiralTwist = 0.5;
  const warm = { r: 1.00, g: 0.85, b: 0.92 }; // 粉白：近赤道/內圈
  const cool = { r: 0.42, g: 0.32, b: 0.88 }; // 藍紫：外圈/遠離赤道
  const nebulaTex = buildGlowTex('#FFFFFF', 128); // 柔和放射狀白光，vertexColors 再上色

  // 雲團中心：粒子優先聚在這些點附近，做出「一坨一坨」的雲霧感而非噪點
  const CLUMP_N = 14;
  const clumps = [];
  for (let c = 0; c < CLUMP_N; c++) {
    const rad   = innerR + Math.random() * (outerR - innerR);
    const angle = Math.random() * Math.PI * 2 + rad * spiralTwist;
    const y     = ((Math.random() + Math.random() + Math.random() - 1.5) / 1.5) * thicknessMax * 0.6;
    clumps.push({ x: rad * Math.cos(angle), y, z: rad * Math.sin(angle) });
  }

  function colorFor(rad, y) {
    const t = Math.min(1, Math.max(0,
      (rad - innerR) / (outerR - innerR) * 0.6 + Math.abs(y) / thicknessMax * 0.4
    ));
    return { r: warm.r + (cool.r - warm.r) * t, g: warm.g + (cool.g - warm.g) * t, b: warm.b + (cool.b - warm.b) * t };
  }

  // clumpRatio：粒子落在雲團附近的機率（其餘完全隨機散開，避免雲團間太空）
  function buildLayer(N, spread, sizeVal, opacityVal, clumpRatio, brightBias) {
    const pos = new Float32Array(N * 3), cols = new Float32Array(N * 3);
    const jitter = () => (Math.random() + Math.random() - 1) * spread; // 三角分布，中心密邊緣疏
    for (let i = 0; i < N; i++) {
      let x, y, z, rad;
      if (Math.random() < clumpRatio) {
        const c = clumps[(Math.random() * CLUMP_N) | 0];
        x = c.x + jitter(); y = c.y + jitter() * 0.6; z = c.z + jitter();
        rad = Math.hypot(x, z);
      } else {
        rad = innerR + Math.random() * (outerR - innerR);
        const angle = Math.random() * Math.PI * 2 + rad * spiralTwist;
        x = rad * Math.cos(angle);
        z = rad * Math.sin(angle);
        y = ((Math.random() + Math.random() + Math.random() - 1.5) / 1.5) * thicknessMax;
      }
      pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
      let col = colorFor(rad, y);
      if (brightBias) col = { r: col.r * 0.5 + 0.5, g: col.g * 0.5 + 0.45, b: col.b * 0.5 + 0.5 }; // 亮點層偏暖白
      cols[i*3] = col.r; cols[i*3+1] = col.g; cols[i*3+2] = col.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(cols, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      map: nebulaTex, size: sizeVal, vertexColors: true, transparent: true, opacity: opacityVal,
      sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
    })));
  }

  buildLayer(6000, 1.0,  0.22, 0.35, 0.8, false); // 主霧層：大顆、淡、大範圍聚集+部分隨機補空
  buildLayer(2500, 0.35, 0.06, 0.9,  1.0, true);  // 亮點層：小顆、亮、緊貼雲團中心
})();

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({

// ── 邊建立 ───────────────────────────────────────────────────
const edgeData = [];
EDGES.forEach(([a, b]) => {
  if (a >= NODES.length || b >= NODES.length) return;
  const same  = NODES[a].topic === NODES[b].topic;
  const alpha = same ? 0.32 : 0.12;
  const color = same ? hex2num(TOPICS[NODES[a].topic]?.color || '#ffffff') : 0x6B7280;
  const geo   = new THREE.BufferGeometry().setFromPoints([worldPos[a].clone(), worldPos[b].clone()]);
  const line  = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: alpha }));
  nodeGroup.add(line);
  edgeData.push({ line, a, b, sameTopic: same, baseAlpha: alpha, baseColor: color });
});

function setEdgeHL(idx, on) {
  edgeData.forEach(ed => {
    if (ed.a !== idx && ed.b !== idx) return;
    const other = (ed.a === idx) ? ed.b : ed.a;
    if (on) {
      ed.line.material.opacity = Math.min(0.9, ed.baseAlpha * 4.5);
      ed.line.material.color.setHex(hex2num(TOPICS[NODES[other].topic]?.color || '#ffffff'));
    } else {
      ed.line.material.opacity = ed.baseAlpha;
      ed.line.material.color.setHex(ed.baseColor);
    }
  });
}

// ── 相機控制 ─────────────────────────────────────────────────
let isDragging = false, lastPx = {x:0,y:0}, autoRotate = true, autoTimer = null;

function startDrag(x, y) { isDragging = true; lastPx = {x,y}; autoRotate = false; clearTimeout(autoTimer); canvas.style.cursor = 'grabbing'; }
function moveDrag(x, y)  {
  if (!isDragging) return;
  sph.theta -= (x - lastPx.x) * 0.0042;
  sph.phi   -= (y - lastPx.y) * 0.0042;
  sph.phi    = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi));
  lastPx = {x, y};
  applySph();
}
function endDrag()  { isDragging = false; canvas.style.cursor = 'grab'; autoTimer = setTimeout(() => { autoRotate = true; }, 5000); }
function doZoom(d)  { sph.r = Math.max(2.2, Math.min(40, sph.r + d * 0.0025)); applySph(); }

canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', e => {
  mouseNDC.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  txp = e.clientX; typ = e.clientY;
  moveDrag(e.clientX, e.clientY);
});
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('wheel', e => { e.preventDefault(); doZoom(e.deltaY); }, { passive: false });

let pinchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
  else if (e.touches.length === 2) { pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); isDragging = false; }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
  else if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); doZoom((pinchDist - d) * 1.8); pinchDist = d; }

// 把 3D 世界座標投影到螢幕座標，回傳 null 表示在相機背後
function worldToScreen(vec3) {
  const v = vec3.clone().project(camera);
  if (v.z > 1) return null; // 在相機背後，不畫
  return {
    x: (v.x + 1) / 2 * window.innerWidth,
    y: (1 - v.y) / 2 * window.innerHeight
  };
}

// 用角色圖片繪製人物（圖片預載後直接 drawImage）
// 特定角色的顯示倍率：黃金梅利號是船不是人，該比其他角色明顯大一號；
// 2026-07-03 咖哩要求現有角色先整體縮小（船不動），其餘角色沒特別列出的一律吃 DEFAULT_CHAR_SCALE
const DEFAULT_CHAR_SCALE = 0.6;
const CHAR_SCALE = { '黃金梅利號': 1.75 };

// extraScale：動態縮放乘數（預設1）。跑動作路線的角色會傳較小值，看起來像在小跑；
// animated：true 時若該角色有 RUN_IMG_MAP 序列幀，改播放跑步循環（否則照舊用靜態圖）
function drawCharacter(ctx, x, y, role, count, alpha, extraScale, animated) {
  const glowColor = CHAR_COLORS[role] || '#D4A800';
  const img = (animated && getRunFrame(role)) || CHAR_IMAGES[role];
  const scale = (CHAR_SCALE[role] || DEFAULT_CHAR_SCALE) * (extraScale || 1);
  const boxW = 80 * scale, boxH = 80 * scale; // 顯示框：光暈/名字/計數氣泡都固定用這個尺寸排版
  let iw = boxW, ih = boxH;   // 圖片實際繪製尺寸：依原始長寬比縮放，避免船隻等非正方形圖被拉伸變形
  if (img && img.complete && img.naturalWidth > 0) {
    const ratio = img.naturalWidth / img.naturalHeight;
    if (ratio >= 1) { iw = boxW; ih = boxW / ratio; }
    else { ih = boxH; iw = boxH * ratio; }
  }
  const ix = x - iw / 2;
  const iy = y - boxH + (boxH - ih); // 底部對齊節點上方（與其他角色齊平站在同一條基準線）

  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);

  // 光暈
  const gr = ctx.createRadialGradient(x, y - boxH * 0.5, 0, x, y - boxH * 0.5, boxW * 0.75);
  gr.addColorStop(0, glowColor + '55');
  gr.addColorStop(1, glowColor + '00');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x, y - boxH * 0.5, boxW * 0.75, 0, Math.PI * 2); ctx.fill();

  // 角色圖片
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, ix, iy, iw, ih);
  } else {
    // 圖片未載入：顯示彩色圓圈佔位
    ctx.fillStyle = glowColor + '88';
    ctx.beginPath(); ctx.arc(x, y - boxH * 0.5, boxW * 0.4, 0, Math.PI * 2); ctx.fill();
  }

  // 角色名
  ctx.fillStyle = '#F5F5F5'; ctx.strokeStyle = '#00000099'; ctx.lineWidth = 3;
  ctx.font = "bold 12px 'Microsoft JhengHei', sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.strokeText(role, x, y + 2);
  ctx.fillText(role, x, y + 2);

  // 活動計數氣泡
  if (count > 0) {
    const bx = x + boxW * 0.38, bby = y - boxH * 0.88;
    ctx.fillStyle = '#D4A800'; ctx.strokeStyle = '#0A0C10'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, bby, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0A0C10'; ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(count > 99 ? '99+' : String(count), bx, bby);
  }

  ctx.restore();
}
// 每格畫面更新人物
function drawAllCharacters() {
  const now = Date.now();

  // 無論有無日誌，在各節點固定地盤顯示淡淡待機人物
  Object.entries(NODE_CHAR).forEach(([nodeIdStr, role]) => {
    const nodeId = parseInt(nodeIdStr);
    if (NODE_IMG_MAP[nodeId]) return; // 有地點圖的節點改由 drawNodeLocations 統一畫（圖+名字+計數），不重複疊角色浮空圖
    const nodeIdx = NODES.findIndex(n => n.id === nodeId);
    if (nodeIdx < 0) return;

    const wp  = worldPos[nodeIdx];
    const scr = worldToScreen(wp);

    // 在相機背後或螢幕外則跳過
    if (!scr) return;
    if (scr.x < -50 || scr.x > window.innerWidth + 50) return;
    if (scr.y < -50 || scr.y > window.innerHeight + 50) return;

    const activity = activeChars[nodeId];
    const count    = activity ? activity.count : 0;
    const alpha    = activity ? 0.95 : 0.75; // 有活動全亮，待機也清楚可見

    drawCharacter(charCtx, scr.x, scr.y - 28, role, count, alpha);
  });
}

// 工具節點的地點圖（取代發光球體＋取代角色浮空圖，兩者合一變成節點唯一的圖；
// 圖片還沒到位的節點自動略過，照舊顯示 Three.js 球體／角色浮空圖）
function drawNodeLocations() {
  Object.entries(NODE_IMG_MAP).forEach(([nodeIdStr, file]) => {
    const nodeId = parseInt(nodeIdStr);
    const img = NODE_IMAGES[nodeId];
    if (!img || !img.complete || img.naturalWidth === 0) return; // 未載入完成就不畫，底下球體照樣看得到

    const nodeIdx = NODES.findIndex(n => n.id === nodeId);
    if (nodeIdx < 0) return;
    const scr = worldToScreen(worldPos[nodeIdx]);
    if (!scr) return;
    if (scr.x < -80 || scr.x > window.innerWidth + 80) return;
    if (scr.y < -80 || scr.y > window.innerHeight + 80) return;

    const scale = NODE_IMG_SCALE[nodeId] || 1;
    const boxW = 110 * scale, boxH = 110 * scale;
    const ratio = img.naturalWidth / img.naturalHeight;
    let iw = boxW, ih = boxH;
    if (ratio >= 1) { ih = boxW / ratio; } else { iw = boxH * ratio; }
    const ix = scr.x - iw / 2, iy = scr.y - ih / 2;
    charCtx.drawImage(img, ix, iy, iw, ih);

    // 補回角色名字＋活動計數氣泡（原本畫在角色浮空圖上，現在地點圖取代了角色圖，
    // 這兩樣資訊還是要留著，不然節點失去角色識別跟活動度資訊）
    const role = NODE_CHAR[nodeId];
    if (role) {
      const labelY = iy + ih + 4;
      charCtx.save();
      charCtx.fillStyle = '#F5F5F5'; charCtx.strokeStyle = '#00000099'; charCtx.lineWidth = 3;
      charCtx.font = "bold 12px 'Microsoft JhengHei', sans-serif";
      charCtx.textAlign = 'center'; charCtx.textBaseline = 'top';
      charCtx.strokeText(role, scr.x, labelY);
      charCtx.fillText(role, scr.x, labelY);

      const activity = activeChars[nodeId];
      const count = activity ? activity.count : 0;
      if (count > 0) {
        const bx = ix + iw * 0.92, bby = iy + 2;
        charCtx.fillStyle = '#D4A800'; charCtx.strokeStyle = '#0A0C10'; charCtx.lineWidth = 1.5;
        charCtx.beginPath(); charCtx.arc(bx, bby, 10, 0, Math.PI * 2); charCtx.fill(); charCtx.stroke();
        charCtx.fillStyle = '#0A0C10'; charCtx.font = 'bold 9px sans-serif';
        charCtx.textAlign = 'center'; charCtx.textBaseline = 'middle';
        charCtx.fillText(count > 99 ? '99+' : String(count), bx, bby);
      }
      charCtx.restore();

      // 角色小頭像徽章：貼地點圖右下角，不疊在場景中間（縮小版角色識別，圓形裁切＋色框）
      const charImg = CHAR_IMAGES[role];
      if (charImg && charImg.complete && charImg.naturalWidth > 0) {
        const avatarR = 20;
        const acx = ix + iw - avatarR * 0.6, acy = iy + ih - avatarR * 0.6;
        charCtx.save();
        charCtx.beginPath();
        charCtx.arc(acx, acy, avatarR, 0, Math.PI * 2);
        charCtx.closePath();
        charCtx.clip();
        const scale2 = Math.max((avatarR * 2) / charImg.naturalWidth, (avatarR * 2) / charImg.naturalHeight);
        const aw = charImg.naturalWidth * scale2, ah = charImg.naturalHeight * scale2;
        charCtx.drawImage(charImg, acx - aw / 2, acy - ah / 2, aw, ah);
        charCtx.restore();
        charCtx.beginPath();
        charCtx.arc(acx, acy, avatarR, 0, Math.PI * 2);
        charCtx.strokeStyle = CHAR_COLORS[role] || '#D4A800';
        charCtx.lineWidth = 2.5;
        charCtx.stroke();
      }
    }
  });
}

// 工具 → 巡航路線（工具節點 → 後端 GAS → 資料表）；送出資料時沿路線跑一圈回來
const TOOL_ROUTE = {
  app: [0], schedule: [8, 20], work: [11], aiwork: [11], signin: [11], car: [11],
  closing: [6, 15, 18], opening: [5, 15, 19], report: [3, 13, 17], feedback: [4, 13, 17],
  leave: [12, 14, 17], upload: [10, 18], aichat: [29, 30, 31], emergency: [9, 21],
  post: [7], hailing: [7], logistics: [37, 38, 39],
};
const SUBMIT_ACTIONS = new Set(['submit', 'direct-submit', 'queue-submit', 'vehicle-reg', 'push-contacts', 'update', 'delete']);

// 鄰接表 + BFS 最短路徑（人物沿現有連線走，不穿牆）
const ADJ = {};
EDGES.forEach(([a, b]) => { (ADJ[a] = ADJ[a] || []).push(b); (ADJ[b] = ADJ[b] || []).push(a); });
function bfsPath(from, to) {
  if (from === to) return [to];
  const prev = { [from]: null }, queue = [from];
  while (queue.length) {
    const cur = queue.shift();
    for (const nxt of (ADJ[cur] || [])) {
      if (nxt in prev) continue;
      prev[nxt] = cur;
      if (nxt === to) {
        const path = [to]; let p = cur;
        while (p !== null) { path.unshift(p); p = prev[p]; }
        return path;
      }
      queue.push(nxt);
    }
  }
  return [from, to]; // 圖上無路 → 直線飛過去
}
function nodeWorldById(id) {
  const idx = NODES.findIndex(n => n.id === id);
  return idx < 0 ? null : worldPos[idx];
}

// 每個工號固定一個顏色（好認）
const USER_COLORS = ['#FFD700', '#4ADE80', '#818CF8', '#FB923C', '#38BDF8', '#F87171', '#A78BFA', '#34D399'];
function userColor(empId) {
  let h = 0; const s = String(empId);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return USER_COLORS[h % USER_COLORS.length];
}

let liveUsers = {};            // empId → 人物狀態
let lastEventTs = 0;           // 已處理事件的最新時間戳
let firstActiveLoad = true;
let lastActiveFetch = 0;
const ACTIVE_INTERVAL = 10000; // brain_map 每 10 秒輪詢
const HOP_SPEED = 0.9;         // 世界座標單位/秒（沿線移動速度，看得到跑）

function ensureUser(empId, name, nodeId) {
  if (liveUsers[empId]) return liveUsers[empId];
  const wp = nodeWorldById(nodeId) || nodeWorldById(0);
  liveUsers[empId] = {
    empId: empId, name: name || empId, color: userColor(empId),
    node: nodeId, pos: wp.clone(), waypoints: [], seg: null,
    alpha: 0, leaving: false, tool: 'app', action: 'login',
    lastSeen: Date.now(), screen: null,
  };
  return liveUsers[empId];
}

function queueMoveTo(u, targetNodeId) {
  if (nodeWorldById(targetNodeId) === null) return;
  const path = bfsPath(u.node, targetNodeId);
  for (let i = 1; i < path.length; i++) u.waypoints.push(path[i]);
  u.node = targetNodeId;
}

// ── 動作跑者（action runner）：送出資料時，由「地點所屬角色」代替使用者
// 跑完 地點→GAS→資料表→地點 這段路，使用者球體留在地點原地等，跑者跑完
// 才觸發使用者回主控台。跑者是每次事件各自獨立的實例（不共用/不重用），
// 兩個人同時做同一動作就會同時出現兩個一樣角色的跑者。
let actionRunners = [];
let runnerSeq = 0;

function buildRoundTripWaypoints(route) {
  const wps = [];
  for (let i = 1; i < route.length; i++) wps.push(route[i]);   // 去程：地點→GAS→資料表
  for (let i = route.length - 2; i >= 0; i--) wps.push(route[i]); // 回程：原路折返
  return wps;
}

function spawnActionRunner(tool, role, locationNodeId, onComplete) {
  const route = TOOL_ROUTE[tool];
  const wp = nodeWorldById(locationNodeId);
  if (!route || !wp) return null;
  const runner = {
    id: 'run_' + (runnerSeq++), role, color: CHAR_COLORS[role] || '#D4A800',
    node: locationNodeId, pos: wp.clone(), waypoints: buildRoundTripWaypoints(route),
    seg: null, alpha: 1, leaving: false, onComplete: onComplete || null,
  };
  actionRunners.push(runner);
  return runner;
}

async function fetchActiveUsers() {
  try {
    const res = await fetch(`${WORKFLOW_GAS_URL}?mode=getActive`);
    const data = await res.json();
    if (data.status !== 'ok' || !data.data) return;
    const users = data.data.users || [], events = data.data.events || [];
    const onlineIds = new Set(users.map(su => String(su.empId)));

    if (firstActiveLoad) {
      // 首次載入：直接放到目前位置，不重播歷史動畫
      users.forEach(su => {
        const u = ensureUser(String(su.empId), su.userName, parseInt(su.nodeId));
        u.tool = su.tool; u.action = su.actionType;
        u.lastSeen = new Date(su.timestamp).getTime();
      });
      lastEventTs = events.length ? new Date(events[events.length - 1].timestamp).getTime() : Date.now();
      firstActiveLoad = false;
    } else {
      // 新事件依序驅動動畫：
      //   登入 → 使用者現身主控台
      //   開工具 → 使用者從目前位置走到該工具的地點
      //   送出資料 → 使用者留在地點，該地點所屬角色代跑 GAS→資料表 一圈，
      //             跑者跑完才觸發使用者回主控台
      //   登出 → 使用者原地淡出
      events.forEach(ev => {
        const ts = new Date(ev.timestamp).getTime();
        if (ts <= lastEventTs) return;
        lastEventTs = ts;
        const id = String(ev.empId);
        if (ev.actionType === 'logout') { if (liveUsers[id]) liveUsers[id].leaving = true; return; }
        const u = ensureUser(id, ev.userName, ev.actionType === 'login' ? 0 : parseInt(ev.nodeId));
        u.name = ev.userName || u.name; u.tool = ev.tool;
        u.action = ev.actionType; u.lastSeen = ts; u.leaving = false;
        if (ev.actionType === 'login') {
          queueMoveTo(u, 0);
        } else if (SUBMIT_ACTIONS.has(ev.actionType)) {
          const nodeId = parseInt(ev.nodeId);
          queueMoveTo(u, nodeId); // 保險：若還沒收到對應的 open 事件，先確保使用者站在地點上
          const intendedRole = ev.role || NODE_CHAR[nodeId] || '路飛';
          // 該角色還沒有完整跑步幀 → 代打路飛先跑；等該角色補齊幀數，ANIMATED_ROLES 會自動納入
          const role = ANIMATED_ROLES.has(intendedRole) ? intendedRole : '路飛';
          const runner = spawnActionRunner(ev.tool, role, nodeId, () => queueMoveTo(u, 0));
          if (!runner) queueMoveTo(u, 0); // 沒有巡航路線可跑（未知工具）就直接回主控台
        } else {
          queueMoveTo(u, parseInt(ev.nodeId));
        }
      });
    }

    // 不設閒置逾時：只有明確登出/被強制登出才離場，呼應「記住我」持久登入
    Object.keys(liveUsers).forEach(id => { if (!onlineIds.has(id)) liveUsers[id].leaving = true; });

    // 線上人數徽章
    const badge = document.getElementById('online-badge');
    if (badge) {
      const n = Object.keys(liveUsers).filter(id => !liveUsers[id].leaving).length;
      badge.textContent = '👥 線上 ' + n + ' 人';
      badge.style.display = n > 0 ? 'block' : 'none';
    }
  } catch (e) { /* 靜默失敗，不影響地圖 */ }
}

function updateLiveUsers(dt) {
  Object.keys(liveUsers).forEach(id => {
    const u = liveUsers[id];
    // 淡入淡出
    if (u.leaving) {
      u.alpha -= dt * 1.5;
      if (u.alpha <= 0) { delete liveUsers[id]; return; }
    } else {
      u.alpha = Math.min(1, u.alpha + dt * 1.5);
    }
    // 沿線移動：一次走一段（節點 → 相鄰節點）
    if (!u.seg && u.waypoints.length) {
      const target = nodeWorldById(u.waypoints.shift());
      if (target) {
        const dist = u.pos.distanceTo(target);
        u.seg = { from: u.pos.clone(), to: target.clone(), t: 0, dur: Math.max(0.4, dist / HOP_SPEED) };
      }
    }
    if (u.seg) {
      u.seg.t += dt;
      const k = Math.min(1, u.seg.t / u.seg.dur);
      const ease = k * k * (3 - 2 * k); // smoothstep：起步加速、到站減速
      u.pos.lerpVectors(u.seg.from, u.seg.to, ease);
      if (k >= 1) { u.pos.copy(u.seg.to); u.seg = null; }
    }
  });
}

// 動作跑者移動：路線跑完（waypoints 清空且沒有移動中的 seg）就觸發
// onComplete（讓使用者球體回主控台）並開始淡出
function updateActionRunners(dt) {
  actionRunners.forEach(r => {
    if (!r.leaving && !r.seg && r.waypoints.length === 0) {
      r.leaving = true;
      if (r.onComplete) { r.onComplete(); r.onComplete = null; }
    }
    if (r.leaving) r.alpha -= dt * 1.8;

    if (!r.seg && r.waypoints.length) {
      const target = nodeWorldById(r.waypoints.shift());
      if (target) {
        const dist = r.pos.distanceTo(target);
        r.seg = { from: r.pos.clone(), to: target.clone(), t: 0, dur: Math.max(0.4, dist / HOP_SPEED) };
      }
    }
    if (r.seg) {
      r.seg.t += dt;
      const k = Math.min(1, r.seg.t / r.seg.dur);
      const ease = k * k * (3 - 2 * k);
      r.pos.lerpVectors(r.seg.from, r.seg.to, ease);
      if (k >= 1) { r.pos.copy(r.seg.to); r.seg = null; }
    }
  });
  actionRunners = actionRunners.filter(r => r.alpha > 0);
}

function drawActionRunners(ctx) {
  actionRunners.forEach(r => {
    const scr = worldToScreen(r.pos);
    if (!scr) return;
    if (scr.x < -60 || scr.x > window.innerWidth + 60 || scr.y < -60 || scr.y > window.innerHeight + 60) return;
    // 跑動作路線時縮小顯示（0.55倍），視覺上區分「代跑角色」跟站崗的正常大小角色；
    // animated=true：有序列幀的角色（目前只有羅賓）在跑路線時播放跑步循環
    drawCharacter(ctx, scr.x, scr.y, r.role, 0, r.alpha, 0.55, true);
  });
}

function drawLiveUsers(ctx, t) {
  // 先算出每個人的基礎螢幕座標
  const items = [];
  Object.keys(liveUsers).forEach(id => {
    const u = liveUsers[id];
    const scr = worldToScreen(u.pos);
    if (!scr || scr.x < -60 || scr.x > window.innerWidth + 60 || scr.y < -60 || scr.y > window.innerHeight + 60) {
      u.screen = null; return;
    }
    items.push({ id, u, x: scr.x, y: scr.y, ox: 0, oy: 0 });
  });

  // 分組：螢幕座標相近（同一節點聚集）的人圍著節點排成一圈，名字才不會疊在一起
  const GROUP_DIST = 50;
  const groups = [];
  items.forEach(it => {
    let g = groups.find(g => Math.hypot(g.x - it.x, g.y - it.y) < GROUP_DIST);
    if (!g) { g = { x: it.x, y: it.y, members: [] }; groups.push(g); }
    g.members.push(it);
  });
  groups.forEach(g => {
    // 依工號排序，順序穩定，才不會每次輪詢後名字互換位置閃爍
    g.members.sort((a, b) => a.id.localeCompare(b.id));
    const n = g.members.length;
    if (n === 1) { g.members[0].ox = 0; g.members[0].oy = 0; return; }
    // 若這群人剛好站在「地點圖放大節點」（如黃金梅利號）旁，圍站半徑也跟著放大，
    // 否則放大後的地點圖會把使用者圓點擠在圖片裡面
    let imgScale = 1, minD = GROUP_DIST;
    Object.keys(NODE_IMG_SCALE).forEach(nidStr => {
      const nid = parseInt(nidStr);
      const scr = worldToScreen(worldPos[nid]);
      if (!scr) return;
      const d = Math.hypot(scr.x - g.x, scr.y - g.y);
      if (d < minD) { minD = d; imgScale = NODE_IMG_SCALE[nid]; }
    });
    // 圓點縮小一倍後（PR #83），圍站半徑跟著縮短，對齊地點圖外圍（boxW/2＝55px）
    // 而不是飄在圖外太遠；人越多圈越大，設上限避免過度誇張
    const radius = (30 + Math.min(n, 6) * 5) * imgScale;
    g.members.forEach((m, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI / 2; // 從正上方開始，順時針排列
      m.ox = Math.cos(angle) * radius;
      m.oy = Math.sin(angle) * radius * 0.65; // 螢幕投影稍微壓扁，看起來像圍站在節點旁而不是飄在空中
    });
  });

  items.forEach(it => {
    const u = it.u;
    const moving = !!u.seg;
    const bob = moving ? 0 : Math.sin(t * 2.2 + u.pos.x * 7) * 2.5; // 待機輕輕浮動
    const x = it.x + it.ox, y = it.y + it.oy + bob;
    u.screen = { x: x, y: y };

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, u.alpha));

    // 移動殘影尾巴（看得出正在跑）
    if (moving && u.seg) {
      const dx = u.seg.to.x - u.seg.from.x, dy = u.seg.to.y - u.seg.from.y;
      for (let i = 1; i <= 3; i++) {
        const back = worldToScreen(u.pos.clone().addScaledVector(new THREE.Vector3(dx, dy, u.seg.to.z - u.seg.from.z).normalize(), -0.06 * i));
        if (back) {
          ctx.fillStyle = u.color + ['66', '44', '22'][i - 1];
          ctx.beginPath(); ctx.arc(back.x, back.y, 8 - i * 1.8, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // 光暈 + 本體圓點
    const gr = ctx.createRadialGradient(x, y, 0, x, y, 11);
    gr.addColorStop(0, u.color + '66');
    gr.addColorStop(1, u.color + '00');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = u.color;
    ctx.strokeStyle = '#F5F5F5'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // 名字標籤（深色底 + 顏色邊框）
    ctx.font = "bold 12px 'Microsoft JhengHei', sans-serif";
    const label = u.name;
    const tw = ctx.measureText(label).width;
    const lx = x - tw / 2 - 7, ly = y + 14, lw = tw + 14, lh = 20;
    ctx.fillStyle = 'rgba(10,12,16,.88)';
    ctx.strokeStyle = u.color + 'AA'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(lx, ly, lw, lh, 6) : ctx.rect(lx, ly, lw, lh);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F5F5F5';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, ly + lh / 2 + 1);

    ctx.restore();
  });
}

        action: 'forceLogout', targetEmpId: u.empId, targetName: u.name,
        operatorEmpId: SESSION_USER.empId, operatorName: SESSION_USER.name || SESSION_USER.empId,
      }) });
      const d = await res.json();
      alert(d.status === 'ok' ? '✅ ' + d.msg : '❌ ' + d.msg);
      if (d.status === 'ok') { u.leaving = true; hideUserMenu(); }
    } catch (e) { alert('❌ 送出失敗，請檢查網路'); }
  };
}

// 點擊偵測：短按（非拖曳）且點在人物上 → 開資訊卡
if (CAN_VIEW_USERS) {
  // 線上人數徽章
  const badge = document.createElement('div');
  badge.id = 'online-badge';
  badge.style.cssText = 'position:fixed;top:22px;right:26px;z-index:110;display:none;' +
    'padding:6px 14px;background:rgba(13,15,20,.85);border:1px solid rgba(212,168,0,.4);' +
    'border-radius:20px;color:#FFD700;font-size:13px;font-weight:bold;' +
    'font-family:"Microsoft JhengHei",sans-serif;backdrop-filter:blur(8px);pointer-events:none;';
  document.body.appendChild(badge);

  let downPos = null;
  const hitUser = (cx, cy) => {
    const ids = Object.keys(liveUsers);
    for (let i = ids.length - 1; i >= 0; i--) {
      const u = liveUsers[ids[i]];
      if (u.screen && Math.hypot(cx - u.screen.x, cy - u.screen.y) < 24) return u;
    }
    return null;
  };
  canvas.addEventListener('mousedown', e => { downPos = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('mouseup', e => {
    if (!downPos) return;
    const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    downPos = null;
    if (moved > 6) return;
    const u = hitUser(e.clientX, e.clientY);
    if (u) showUserMenu(u, e.clientX + 12, e.clientY + 12);
    else hideUserMenu();
  });
  canvas.addEventListener('touchend', e => {
    if (e.changedTouches.length !== 1) return;
    const tc = e.changedTouches[0];
    const u = hitUser(tc.clientX, tc.clientY);
    if (u) { showUserMenu(u, tc.clientX + 12, tc.clientY + 12); }
  });
}

// ── 動畫主迴圈 ──────────────────────────────────────────────
const clock = new THREE.Clock();
let lastFrameT = 0;
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (autoRotate && !isDragging) { sph.theta += 0.0014; applySph(); }

  glowSprites.forEach((sp, i) => {
    const hl = sp.userData.highlighted;
    const dim = sp.userData.isEmpty ? 0.53 : 1; // 空節點呼吸動畫等比縮小，不被每幀覆寫回原尺寸
    const s  = ((hl ? 0.95 : 0.54) + Math.sin(t * (hl ? 2.2 : 1.3) + i * 0.68) * (hl ? 0.16 : 0.07)) * dim;
    sp.scale.set(s, s, 1);
  });
  coreMeshes.forEach((core, i) => {
    const target = glowSprites[i].userData.highlighted ? 1.6 : 1.0;
    core.scale.setScalar(core.scale.x + (target - core.scale.x) * 0.12);
  });

  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(hitMeshes);
  if (hits.length > 0) {
    const idx = hits[0].object.userData.nodeIdx;
    if (idx !== hoveredIdx) {
      if (hoveredIdx !== -1) { glowSprites[hoveredIdx].userData.highlighted = false; setEdgeHL(hoveredIdx, false); }
      hoveredIdx = idx;
      glowSprites[idx].userData.highlighted = true;
      setEdgeHL(idx, true);
      showTip(NODES[idx], txp, typ);
    }
    if (!isDragging) canvas.style.cursor = 'pointer';
  } else {
    if (hoveredIdx !== -1) {
      glowSprites[hoveredIdx].userData.highlighted = false;
      setEdgeHL(hoveredIdx, false);
      hoveredIdx = -1;
      hideTip();
    }
    if (!isDragging) canvas.style.cursor = 'grab';
  }

  renderer.render(scene, camera);

  // 定時拉航海日誌（每 60 秒）
  const nowMs = Date.now();
  if (nowMs - lastFetch > FETCH_INTERVAL) {
    lastFetch = nowMs;
    fetchWorkflowData();
  }

  // 整張 2D 疊層畫布每幀只清一次，畫工具節點地點圖（背景場景，先畫）→
  // 再畫角色人物（疊在場景上）；順序不能顛倒，也不能各自清畫布，
  // 不然後畫的會把先畫的清掉（地點圖曾因此完全被蓋掉，見此處修復）
  charCtx.clearRect(0, 0, charCanvas.width, charCanvas.height);
  drawNodeLocations();
  drawAllCharacters();

  // 即時航跡人物層（限主管，且分頁在前景才輪詢省額度）
  if (CAN_VIEW_USERS) {
    if (!document.hidden && nowMs - lastActiveFetch > ACTIVE_INTERVAL) {
      lastActiveFetch = nowMs;
      fetchActiveUsers();
    }
    const dt = Math.min(0.05, t - lastFrameT);
    updateLiveUsers(dt);
    updateActionRunners(dt);
    drawLiveUsers(charCtx, t);
    drawActionRunners(charCtx);
  }
  lastFrameT = t;
}
animate();
</script>
</body>
</html>
