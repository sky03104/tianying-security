<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天鷹保全 · 匿名表揚/反應</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #0A0C10;
            --surface: #111827;
            --primary: #D4A800;
            --primary-glow: rgba(212, 168, 0, 0.3);
            --text: #F5F5F5;
            --text-muted: #8A95A8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #4ADE80;
            --error: #F87171;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh;
        }

        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
        }

        /* ===== 天鷹品牌啟動遮罩：三層金色光環 + 中央去背 LOGO + 四角金框 ===== */
        #splash { flex-direction: column; }
        .splash-logo-wrap { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring1 { inset: 0; border-top-color: #FFD700; border-right-color: rgba(212,168,0,.4); animation: spin 2.4s linear infinite; }
        .ring2 { inset: 14px; border-bottom-color: #D4A800; border-left-color: rgba(212,168,0,.3); animation: spin 1.8s linear infinite reverse; }
        .ring3 { inset: 28px; border-top-color: #F0C040; animation: spin 3s linear infinite; }
        .splash-logo { width: 62px; max-width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0 0 16px rgba(212,168,0,.7)); z-index: 2; }
        .corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--primary); }
        .corner.tl { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
        .corner.tr { top: -6px; right: -6px; border-left: 0; border-bottom: 0; }
        .corner.bl { bottom: -6px; left: -6px; border-right: 0; border-top: 0; }
        .corner.br { bottom: -6px; right: -6px; border-left: 0; border-top: 0; }
        .splash-brand { margin-top: 22px; color: #FFD700; font-size: 22px; font-weight: 700; letter-spacing: 4px; }
        .splash-brand-en { margin-top: 6px; color: var(--text-muted); font-size: 11px; letter-spacing: 2px; }

        /* ===== 頂部品牌區 + 頁尾版權 ===== */
        .logo-area { text-align: center; margin-bottom: 20px; }
        .logo-img { width: 60px; max-width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0 0 16px rgba(212,168,0,.7)); }
        .brand-title { color: var(--primary); font-size: 18px; font-weight: 700; margin-top: 8px; letter-spacing: 2px; }
        .brand-sub { color: var(--text-muted); font-size: 11px; letter-spacing: 2px; margin-top: 4px; }
        .footer { text-align: center; color: var(--text-muted); font-size: 11px; letter-spacing: 1px; margin-top: 24px; opacity: .7; }

        .splash-ring {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
        }

        .emp-info {
            color: var(--text-muted);
            font-size: 12px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            color: var(--primary);
            margin: 0 0 20px 0;
            font-size: 20px;
            font-weight: 700;
        }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0 0 16px 0;
            line-height: 1.5;
        }

        .tab-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #D4A800, #F0C040);
            color: #000;
            border-color: var(--primary);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .label-required {
            color: var(--error);
            margin-left: 4px;
        }

        .input,
        .textarea,
        .select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text);
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input:focus,
        .textarea:focus,
        .select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .textarea {
            resize: vertical;
            min-height: 120px;
        }

        .input::placeholder,
        .textarea::placeholder {
            color: var(--text-muted);
        }

        .select option {
            background: var(--surface);
            color: var(--text);
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            display: none;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .file-input-label:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(212, 168, 0, 0.05);
        }

        .file-preview {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .file-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
        }

        .file-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: var(--error);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .file-remove:hover {
            background: #ff4444;
        }

        .anonymous-notice {
            background: rgba(212, 168, 0, 0.1);
            border: 1px solid rgba(212, 168, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .anonymous-notice-icon {
            color: var(--primary);
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .anonymous-notice-text {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #D4A800, #F0C040);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 168, 0, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal-title {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 12px 0;
        }

        .modal-content {
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .modal-btn-cancel {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .modal-btn-cancel:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #D4A800, #F0C040);
            color: #000;
        }

        .modal-btn-confirm:hover {
            box-shadow: 0 4px 12px rgba(212, 168, 0, 0.3);
        }

        /* Success State */
        .success-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #D4A800, #F0C040);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: scaleIn 0.6s ease-out;
        }

        .success-icon i {
            color: #000;
            font-size: 40px;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .success-message {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .error-message {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 10px;
            padding: 12px;
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .error-message i {
            flex-shrink: 0;
            margin-top: 2px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(212, 168, 0, 0.3);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }

            .card {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .modal {
                width: 95%;
            }
        }
    </style>
</head>

    <div id="root"></div>
    <script>
        const { useState, useEffect } = React;
        const params = new URLSearchParams(window.location.search);
        // 工號：優先 ?empId=（主選單帶入），缺則同 origin 讀登入態 session，最後才『未登入』
        let empId = params.get('empId') || '';
        if (!empId) { try { empId = (JSON.parse(localStorage.getItem('hsh_session_user') || '{}').empId) || ''; } catch (e) {} }
        if (!empId) empId = '未登入';
        // 同 origin 可讀主程式登入態，盡量帶出姓名供後台辨識（前台不顯示）
        function getSessionName(){
            try { const u = JSON.parse(localStorage.getItem('hsh_session_user') || '{}');
                return u.name || u.empName || u.userName || u['姓名'] || ''; } catch(e){ return ''; }
        }

        // ===== 主管模式（?mode=admin）共用 =====
        const mode = params.get('mode') || '';
        function getSessionRole(){
            try { return (JSON.parse(localStorage.getItem('hsh_session_user') || '{}').role) || ''; } catch(e){ return ''; }
        }
        const STATUS_COLORS = { '未讀': '#F87171', '已讀': '#D4A800', '處理中': '#FB923C', '已處理': '#4ADE80' };
        const ALL_STATUS = ['未讀', '已讀', '處理中', '已處理'];
        const ADMIN_GAS_URL = 'https://script.google.com/macros/s/AKfycbwHXlwTMmJyA79Cuzdh2IPRnBLUWm2YPEqXn5XJj4GVEUlCnNIv8hgRTJ7Xr198hZxG/exec';
        const WORKFLOW_GAS_URL = 'https://script.google.com/macros/s/AKfycbzxjedGAbxj3G85zkybqoFoB-P7uQ9ycqdJZ7mzQ2Ax-vaxKgOTG60120PlGPbcNJpR/exec';
        async function logWorkflow(tool, actionType, status) {
            const u = JSON.parse(localStorage.getItem('hsh_session_user') || '{}');
            if (!u.empId) return;
            try { await fetch(WORKFLOW_GAS_URL, { method:'POST', body: JSON.stringify({ action:'logTask', tool, empId:u.empId, userName:u.name||'未知', actionType, status:status||'已完成' }) }); } catch(e) {}
        }

        // 輕量 Toast（此檔原本以 errorMessage 呈現，主管模式自帶提示）
        function fbToast(msg, type){
            const t = document.createElement('div');
            t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:9999;padding:12px 18px;border-radius:10px;font-size:14px;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:opacity .3s;max-width:90%;';
            t.style.background = type === 'success' ? '#22C55E' : '#E53E3E';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 2600);
        }
        // 狀態徽章
        function StatusBadge(status){
            const c = STATUS_COLORS[status] || '#8A95A8';
            return React.createElement("span", { style: { background: c + '22', color: c, border: '1px solid ' + c + '55', borderRadius: '999px', padding: '2px 10px', fontSize: '12px', fontWeight: 700, whiteSpace: 'nowrap' } }, status || '未讀');
        }
        // 類型徽章（表揚綠 / 反應橙）；舊資料「檢舉」一律顯示為「反應」
        function TypeBadge(t){
            const label = (t === '檢舉') ? '反應' : (t || '—');
            const c = (label === '表揚') ? '#4ADE80' : '#FB923C';
            return React.createElement("span", { style: { background: c + '22', color: c, border: '1px solid ' + c + '55', borderRadius: '999px', padding: '2px 10px', fontSize: '12px', fontWeight: 700, whiteSpace: 'nowrap' } }, label);
        }
        // 詳情欄位列
        function fieldRow(label, value){
            return React.createElement("div", { style: { marginBottom: '12px' } },
                React.createElement("div", { style: { fontSize: '12px', color: 'var(--primary)', marginBottom: '3px' } }, label),
                React.createElement("div", { style: { fontSize: '14px', color: 'var(--text)', whiteSpace: 'pre-wrap', wordBreak: 'break-word' } }, value || '—')
            );
        }
        // 附件連結（以 \n 分隔）
        function attachLinks(raw){
            const urls = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean);
            if (!urls.length) return React.createElement("div", { style: { fontSize: '14px', color: 'var(--text-muted)' } }, "（無附件）");
            return React.createElement("div", { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
                urls.map((u, i) => React.createElement("a", { key: i, href: u, target: "_blank", rel: "noopener", style: { fontSize: '13px', color: '#818CF8', wordBreak: 'break-all' } },
                    React.createElement("i", { className: "ti ti-paperclip", style: { marginRight: '4px' } }), "查看附件 " + (i + 1)))
            );
        }

        // 表揚類別
        const praiseCategories = [
            '工作表現優異',
            '熱心助人',
            '客戶好評',
            '創新思維',
            '團隊合作',
            '其他'
        ];

        // 反應類別
        const reportCategories = [
            '違規行為',
            '態度不佳',
            '曠職遲到',
            '服務不周',
            '其他違規',
            '其他'
        ];

        function App() {
            const [feedbackType, setFeedbackType] = useState('praise'); // 'praise' or 'report'
            const [formData, setFormData] = useState({
                targetName: '',
                category: '',
                description: '',
                date: new Date().toISOString().split('T')[0],
                files: []
            });
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitSuccess, setSubmitSuccess] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');

            useEffect(() => {
                setTimeout(() => {
                    const s = document.getElementById('splash');
                    if (s) {
                        s.classList.add('hide');
                        setTimeout(() => s.remove(), 500);
                    }
                }, 500);
            }, []);

            // 切換反饋類型時重置表單
            useEffect(() => {
                setFormData({
                    targetName: '',
                    category: '',
                    description: '',
                    date: new Date().toISOString().split('T')[0],
                    files: []
                });
                setErrorMessage('');
            }, [feedbackType]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
                setErrorMessage('');
            };

            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                const validFiles = files.filter(file => {
                    if (!file.type.startsWith('image/')) {
                        setErrorMessage('只支援圖片檔案（JPG、PNG、GIF 等）');
                        return false;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        setErrorMessage('單個檔案不超過 5MB');
                        return false;
                    }
                    return true;
                });

                if (formData.files.length + validFiles.length > 5) {
                    setErrorMessage('最多只能上傳 5 張圖片');
                    return;
                }

                setFormData(prev => ({
                    ...prev,
                    files: [...prev.files, ...validFiles]
                }));
            };

            const removeFile = (index) => {
                setFormData(prev => ({
                    ...prev,
                    files: prev.files.filter((_, i) => i !== index)
                }));
            };

            const validateForm = () => {
                if (!formData.targetName.trim()) {
                    setErrorMessage('請填寫對象（被表揚/反應的人員姓名或工號）');
                    return false;
                }
                if (!formData.category) {
                    setErrorMessage('請選擇事由分類');
                    return false;
                }
                if (!formData.description.trim()) {
                    setErrorMessage('請填寫事件描述');
                    return false;
                }
                if (!formData.date) {
                    setErrorMessage('請選擇發生日期');
                    return false;
                }
                return true;
            };

            const handleSubmit = () => {
                if (!validateForm()) {
                    return;
                }
                setShowConfirmModal(true);
            };

            // 將檔案轉為 base64 的輔助函式
            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            const confirmSubmit = async () => {
                setShowConfirmModal(false);
                setIsSubmitting(true);
                setErrorMessage('');

                try {
                    // 將圖片轉為 base64 陣列
                    let imagesBase64 = [];
                    if (formData.files.length > 0) {
                        imagesBase64 = await Promise.all(
                            formData.files.map(file => fileToBase64(file))
                        );
                    }

                    // urlencoded 提交（簡單請求無 preflight），照片走公告同款 base64 流程
                    const gasUrl = 'https://script.google.com/macros/s/AKfycbwHXlwTMmJyA79Cuzdh2IPRnBLUWm2YPEqXn5XJj4GVEUlCnNIv8hgRTJ7Xr198hZxG/exec';
                    const body = new URLSearchParams();
                    body.append('action', 'feedback');
                    // 前台完全匿名；empId/name 僅後台試算表記錄，用於辨識填寫人與防濫用
                    body.append('payload', JSON.stringify({
                        type: feedbackType,            // praise | report
                        target: formData.targetName,
                        category: formData.category,
                        description: formData.description,
                        date: formData.date,
                        empId: empId,
                        name: getSessionName(),
                        images: imagesBase64           // base64 陣列，GAS 存公告 Drive 資料夾
                    }));

                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: body.toString()
                    });
                    const result = await response.json();

                    if (result.status === 'ok') {
                        logWorkflow('feedback', 'submit', '已完成');
                        setSubmitSuccess(true);
                        setFormData({
                            targetName: '',
                            category: '',
                            description: '',
                            date: new Date().toISOString().split('T')[0],
                            files: []
                        });
                        setIsSubmitting(false);
                        // 3 秒後自動返回表單
                        setTimeout(() => {
                            setSubmitSuccess(false);
                        }, 3000);
                    } else {
                        setErrorMessage('提交失敗：' + (result.msg || '未知錯誤'));
                        setIsSubmitting(false);
                    }
                } catch (error) {
                    setErrorMessage('網路連線錯誤，請稍後重試：' + error.message);
                    setIsSubmitting(false);
                }
            };

            const categories = feedbackType === 'praise' ? praiseCategories : reportCategories;
            const typeLabel = feedbackType === 'praise' ? '表揚' : '反應';

            if (submitSuccess) {

        // ===== 主管審閱畫面（匿名表揚／反應）=====
        function AdminApp(){
            const [list, setList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filter, setFilter] = useState('unread'); // unread | read | all
            const [selected, setSelected] = useState(null);
            const [navRows, setNavRows] = useState([]); // 凍結的瀏覽順序（進入詳情時的篩選清單列號）
            const [navPos, setNavPos] = useState(-1);
            const [updating, setUpdating] = useState(false);
            const FB_STATUS = ['未讀', '已讀'];
            const role = getSessionRole();
            const allowed = ['executive', 'admin'].includes(role);
            const canDelete = role === 'admin'; // 永久刪除僅限管理員

            useEffect(() => {
                setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); } }, 500);
                if (allowed) loadList();
            }, []);

            const loadList = async () => {
                setLoading(true);
                try {
                    const res = await fetch(ADMIN_GAS_URL + '?action=getFeedback');
                    const d = await res.json();
                    if (d.status === 'ok' && Array.isArray(d.list)) setList(d.list);
                    else fbToast('讀取失敗：' + (d.msg || '未知錯誤'), 'err');
                } catch (e) { fbToast('網路連線錯誤', 'err'); }
                setLoading(false);
            };

            const changeStatus = async (item, status, decision) => {
                if (updating) return;
                const patch = decision !== undefined ? { '狀態': status, '處置': decision } : { '狀態': status };
                setUpdating(true);
                try {
                    const payload = { sheet: 'feedback', row: item.row, status: status };
                    if (decision !== undefined) payload.decision = decision;
                    const body = new URLSearchParams();
                    body.append('action', 'updateStatus');
                    body.append('payload', JSON.stringify(payload));
                    const res = await fetch(ADMIN_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, body: body.toString() });
                    const d = await res.json();
                    if (d.status === 'ok') {
                        setList(prev => prev.map(r => r.row === item.row ? { ...r, ...patch } : r));
                        setSelected(prev => (prev && prev.row === item.row) ? { ...prev, ...patch } : prev);
                        fbToast(decision !== undefined ? '已記錄處置「' + decision + '」' : '狀態已更新為「' + status + '」', 'success');
                    } else fbToast('更新失敗：' + (d.msg || ''), 'err');
                } catch (e) { fbToast('網路連線錯誤', 'err'); }
                setUpdating(false);
            };
            // 主管裁決：同意/不同意 → 狀態轉「已處理」並記錄處置
            const decide = (item, decision) => changeStatus(item, '已處理', decision);

            // 永久刪除（限管理員）：刪後重讀清單以同步列號
            const deleteItem = async (item) => {
                if (updating) return;
                if (!window.confirm('確定永久刪除編號 #' + item['編號'] + '？\n此動作無法復原。')) return;
                setUpdating(true);
                try {
                    const body = new URLSearchParams();
                    body.append('action', 'deleteRow');
                    body.append('payload', JSON.stringify({ sheet: 'feedback', row: item.row }));
                    const res = await fetch(ADMIN_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, body: body.toString() });
                    const d = await res.json();
                    if (d.status === 'ok') {
                        fbToast('已刪除編號 #' + item['編號'], 'success');
                        setSelected(null);
                        await loadList();
                    } else fbToast('刪除失敗：' + (d.msg || ''), 'err');
                } catch (e) { fbToast('網路連線錯誤', 'err'); }
                setUpdating(false);
            };

            // 開啟詳情：凍結目前篩選順序供上一篇/下一篇，並自動將未讀標記為「已讀」
            const openDetail = (item, orderedRows) => {
                setNavRows(orderedRows);
                setNavPos(orderedRows.indexOf(item.row));
                setSelected(item);
                autoMark(item);
            };
            const goRel = (delta) => {
                const np = navPos + delta;
                if (np < 0 || np >= navRows.length) return;
                const item = list.find(r => r.row === navRows[np]);
                if (!item) return;
                setNavPos(np);
                setSelected(item);
                autoMark(item);
            };
            // 未讀 → 打開後自動轉「已讀」（瀏覽順序已凍結，下一篇仍走原篩選清單）
            const autoMark = (item) => { if (item && (item['狀態'] || '未讀') === '未讀') changeStatus(item, '已讀'); };
            const navBtnStyle = (dis) => ({ flexShrink: 0, padding: '8px 12px', borderRadius: '8px', fontSize: '13px', fontWeight: 700,
                cursor: dis ? 'default' : 'pointer', border: '1px solid var(--border)', background: dis ? 'transparent' : 'rgba(212,168,0,.12)',
                color: dis ? 'var(--text-muted)' : 'var(--primary)', opacity: dis ? .4 : 1 });

            const header = React.createElement("div", { className: "header" },
                React.createElement("a", { href: `index.html?empId=${empId}`, className: "back-btn" }, React.createElement("i", { className: "ti ti-chevron-left" }), "返回主選單"),
                React.createElement("div", { style: { fontSize: '12px', color: 'var(--primary)' } }, "主管審閱")
            );

            if (!allowed) {
                return React.createElement("div", { className: "container" }, header,
                    React.createElement("div", { className: "card", style: { textAlign: 'center', padding: '40px 20px' } },
                        React.createElement("div", { style: { fontSize: '40px', marginBottom: '12px' } }, "🔒"),
                        React.createElement("div", { style: { fontSize: '16px', fontWeight: 700, marginBottom: '6px' } }, "無檢視權限"),
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)' } }, "此頁面僅限公司主管／管理員檢視")
                    )
                );
            }

            // 詳情頁
            if (selected) {
                const it = selected;
                return React.createElement("div", { className: "container" },
                    React.createElement("div", { className: "header" },
                        React.createElement("a", { href: "#", className: "back-btn", onClick: e => { e.preventDefault(); setSelected(null); } }, React.createElement("i", { className: "ti ti-chevron-left" }), "返回清單"),
                        StatusBadge(it['狀態'])
                    ),
                    React.createElement("div", { style: { display: 'flex', gap: '8px', marginBottom: '12px', alignItems: 'center' } },
                        React.createElement("button", { disabled: navPos <= 0, onClick: () => goRel(-1), style: navBtnStyle(navPos <= 0) }, "‹ 上一篇"),
                        React.createElement("div", { style: { flex: 1, textAlign: 'center', fontSize: '12px', color: 'var(--text-muted)' } }, navRows.length ? ((navPos + 1) + " / " + navRows.length) : ''),
                        React.createElement("button", { disabled: navPos >= navRows.length - 1, onClick: () => goRel(1), style: navBtnStyle(navPos >= navRows.length - 1) }, "下一篇 ›")
                    ),
                    React.createElement("div", { className: "card" },
                        React.createElement("div", { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' } },
                            React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)' } }, "編號 #" + it['編號']),
                            TypeBadge(it['類型'])
                        ),
                        fieldRow("對象", it['對象']),
                        fieldRow("事由分類", it['分類']),
                        fieldRow("事件描述", it['描述']),
                        fieldRow("發生日期", it['發生日期']),
                        fieldRow("提交時間", it['時間戳記']),
                        React.createElement("div", { style: { marginBottom: '12px' } },
                            React.createElement("div", { style: { fontSize: '12px', color: 'var(--primary)', marginBottom: '3px' } }, "附件"),
                            attachLinks(it['附件'])
                        ),
                        React.createElement("div", { style: { marginTop: '8px', paddingTop: '12px', borderTop: '1px dashed var(--border)' } },
                            React.createElement("div", { style: { fontSize: '11px', color: 'var(--text-muted)', marginBottom: '6px' } }, "⚠ 以下為後台辨識資訊（前台匿名，僅主管可見）"),
                            fieldRow("填寫人工號", it['工號']),
                            fieldRow("填寫人姓名", it['姓名'])
                        )
                    ),
                    React.createElement("div", { className: "card" },
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--primary)', marginBottom: '10px', fontWeight: 700 } }, "主管裁決"),
                        it['處置'] ? React.createElement("div", { style: { fontSize: '13px', color: 'var(--text)', marginBottom: '10px' } },
                            React.createElement("span", { style: { color: 'var(--text-muted)' } }, "目前處置："), it['處置']) : null,
                        React.createElement("div", { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                            ((it['類型'] === '表揚') ? ['同意表揚', '不同意表揚'] : ['同意懲處', '不同意懲處']).map((dec, di) => {
                                const active = it['處置'] === dec;
                                const c = (di === 0) ? '#4ADE80' : '#F87171';
                                return React.createElement("button", { key: dec, disabled: updating, onClick: () => decide(it, dec),
                                    style: { padding: '12px', borderRadius: '10px', fontSize: '14px', fontWeight: 700, cursor: updating ? 'default' : 'pointer',
                                        border: '1px solid ' + c + (active ? '' : '55'), background: active ? c : c + '15', color: active ? '#0A0C10' : c } }, dec);
                            })
                        )
                    ),
                    canDelete && React.createElement("button", { disabled: updating, onClick: () => deleteItem(it),
                        style: { width: '100%', marginTop: '12px', padding: '13px', borderRadius: '10px', fontSize: '14px', fontWeight: 700,
                            cursor: updating ? 'default' : 'pointer', border: '1px solid #F87171', background: 'rgba(248,113,113,.12)', color: '#F87171' } },
                        "🗑️ 永久刪除此筆")
                );
            }

            // 清單頁
            const filtered = list.filter(r => {
                const s = r['狀態'] || '未讀';
                if (filter === 'all') return true;
                if (filter === 'read') return s === '已讀';
                if (filter === 'done') return s === '已處理';
                return s === '未讀'; // unread
            });
            const tabBtn = (key, label) => React.createElement("button", { onClick: () => setFilter(key),
                style: { flex: 1, padding: '8px 4px', borderRadius: '8px', fontSize: '13px', fontWeight: 700, cursor: 'pointer',
                    border: '1px solid var(--border)', background: filter === key ? 'var(--primary)' : 'transparent', color: filter === key ? '#0A0C10' : 'var(--text-muted)' } }, label);

            return React.createElement("div", { className: "container" }, header,
                React.createElement("div", { style: { textAlign: 'center', marginBottom: '12px' } },
                    React.createElement("div", { style: { color: 'var(--primary)', fontSize: '18px', fontWeight: 700, letterSpacing: '2px' } }, "表揚／反應審閱"),
                    React.createElement("div", { style: { color: 'var(--text-muted)', fontSize: '11px', letterSpacing: '1px' } }, "TIANYING SECURITY · DATA SYSTEM")
                ),
                React.createElement("div", { style: { display: 'flex', gap: '8px', marginBottom: '14px' } },
                    tabBtn('unread', '未讀'), tabBtn('read', '已讀'), tabBtn('done', '已處理'), tabBtn('all', '全部')
                ),
                loading ? React.createElement("div", { className: "card", style: { textAlign: 'center', padding: '40px' } }, React.createElement("i", { className: "ti ti-loader-2", style: { fontSize: '28px', color: 'var(--primary)' } })) :
                filtered.length === 0 ? React.createElement("div", { className: "card", style: { textAlign: 'center', padding: '40px 20px', color: 'var(--text-muted)' } }, "目前沒有符合條件的項目") :
                React.createElement("div", { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
                    filtered.map(it => React.createElement("div", { key: it.row, className: "card", style: { cursor: 'pointer', padding: '14px', position: 'relative' }, onClick: () => openDetail(it, filtered.map(r => r.row)) },
                        canDelete && React.createElement("button", { onClick: e => { e.stopPropagation(); deleteItem(it); }, title: "刪除",
                            style: { position: 'absolute', top: '8px', right: '8px', background: 'rgba(248,113,113,.12)', border: '1px solid #F8717155', color: '#F87171', borderRadius: '8px', padding: '3px 8px', fontSize: '13px', cursor: 'pointer', lineHeight: 1, zIndex: 2 } }, "🗑️"),
                        React.createElement("div", { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px', gap: '8px', paddingRight: canDelete ? '34px' : '0' } },
                            React.createElement("div", { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, TypeBadge(it['類型']),
                                React.createElement("span", { style: { fontSize: '13px', fontWeight: 700, color: 'var(--text)' } }, "#" + it['編號'])),
                            StatusBadge(it['狀態'])
                        ),
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text)', marginTop: '2px' } },
                            React.createElement("span", { style: { color: 'var(--text-muted)' } }, "對象："), it['對象'] || '—'),
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)', marginTop: '2px' } },
                            (it['分類'] || '') + "　·　" + (it['發生日期'] || ''))
                    ))
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(mode === 'admin' ? AdminApp : App));
    </script>
</body>
</html>
