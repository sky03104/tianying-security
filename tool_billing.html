*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh;}

.title-sub{color:var(--text-muted);font-size:11px;letter-spacing:2px;margin-top:2px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);}
.step-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.step-no{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#D4A800,#FFD700);color:#0A0C10;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-title{font-size:16px;font-weight:700;color:var(--gold2);}

label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:5px;}
.field{margin-bottom:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:110px;}
input[type=text],input[type=number],select{

input:focus,select:focus{outline:none;border-color:var(--gold);}

   淺色文字，等於看不見（2026-08-09 咖哩回報）。option 要自己指定顏色。

select option{background:#0D0F14;color:var(--text);}
select option:disabled{color:var(--text-muted);}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

.btn{border:none;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;}

/* ════════════════════════════════════════════════════════════════════
   天鷹保全 · 請款資料產生工具
   ────────────────────────────────────────────────────────────────────
   每月請款 Excel（20 分頁）自動產生。時數來源優先讀月班表代號，
   讀不到或不適用的項目改手動輸入。

   ⚠️ 這支工具算的是要跟業主請的錢，改任何計算相關的程式前，
      務必先看懂下面「資料模型」那段註解，並跑 test/billing.test.js 對帳。
   ════════════════════════════════════════════════════════════════════ */

/* 班表 GAS（與 index.html 的 asUrl 同一支，action=getSchedule 可取整月班表） */
const SCHEDULE_GAS_URL = 'https://script.google.com/macros/s/AKfycbzs56InZLeaHiRJhy1alNfQwDyH0mXEV9t_WJxzfjTjIhf68DHgMiWVQvVG6vKrRZ2x1w/exec';

const 一般費率 = 270;
const 假日費率 = 410;
const WD = ['日','一','二','三','四','五','六'];

/* ── 項目定義 ──────────────────────────────────────────────────
   代號對應由咖哩 2026-08-08 親自確認：
     海→2海底撈、N→3地下停車場、H/H2→4漢來VIP、L→5假日勤務、南→6其他(南側門)
     7安全駕駛(VIP泊車) 不在月班表，手動輸入
   班別：早班表 morning / 晚班表 night（海底撈的「海」在晚班表）
   ──────────────────────────────────────────────────────────── */
const ITEMS = [
  { no:2, 代號:['海'], 班別:'night', 預設時:4,  預設人:1,
    發票:'2海底撈發票', 明細:'海底撈明細', 附表:'海底撈附表一', 附表號:'一',
    標題:'2.海底撈增派', 明細標題:'漢神巨蛋海底撈哨增派', 組別:'(一)保安組海底撈哨增派',
    發票合計欄:'F', 發票標題合併:'A1:E1', 時數欄:'C', 計價:{一般:'E4',假日:'E7',共計:'E12'},
    時段:{4:'06:00-10:00'} },
  /* LN ＝ 巡檢增派＋停巡增派同一人，兩邊都要算，所以 3、5 兩項都收 LN。
     為什麼 LN 一天會算成 16 小時卻是對的（2026-08-09 咖哩說明，別再改回去）：
       ・LN 的 1200-2000（8H）→ 算項5 假日勤務支援
       ・LN 的 2000-2400（4H）→ 算項3 地下停車場的其中 4 小時
       ・項3 另外 4 小時來自：平日有個 S 班（0800-1600，8H），假日會變成
         A 班（0800-2000，12H），多出來的 1600-2000 這 4 小時補進項3
       ・4H ＋ 4H ＝ 項3 的 8 小時，跟項5 的 8 小時是兩筆不同的勤務，
         合計 16 小時並非重複計算。 */
  { no:3, 代號:['N','LN'], 班別:'morning', 預設時:8, 預設人:1,
    發票:'3停車場增派發票', 明細:'停車場增派明細', 附表:'停管附表二', 附表號:'二',
    標題:'3.地下停車場增派', 明細標題:'漢神巨蛋地下停車場增派', 組別:'(一)停管組假日勤務支援增派',
    發票合計欄:'F', 發票標題合併:'A1:E1', 時數欄:'C', 計價:{一般:'D6',假日:'D10',共計:'D8'},
    時段:{8:'12:00-20:00',4:'16:00-20:00'} },
  { no:4, 代號:['H','H2'], 班別:'morning', 代號時數:{'H':11,'H2':11.5}, 預設時:11, 預設人:1,
    發票:'4漢來VIP發票', 明細:'漢來增派明細', 附表:'漢來增派明細附表三', 附表號:'三',
    標題:'4.漢神巨蛋漢來前服務貴賓車增派', 明細標題:'漢神巨蛋漢來前服務貴賓車增派',
    組別:'(一)漢來前服務貴賓車增派',
    發票合計欄:'I', 發票標題合併:'A1:H1', 時數欄:'D', 有時數欄:true,
    計價:{一般:'E7',假日:'E11',共計:'E9'},
    時段:{11:'11:00-22:00',11.5:'11:00-22:30'} },
  { no:5, 代號:['L','LN'], 班別:'morning', 預設時:8, 預設人:1,
    發票:'5.假日勤務支援發票', 明細:'假日勤務支援明細表', 附表:'假日勤務支援附表四', 附表號:'四',
    標題:'5.假日勤務支援', 明細標題:'漢神巨蛋假日勤務支援', 組別:'(一)保安組假日勤務支援增派',
    發票合計欄:'F', 發票標題合併:'A1:E1', 時數欄:'C', 計價:{一般:'E7',假日:'E11',共計:'E9'},
    時段:{8:'12:00-20:00'} },
  { no:6, 代號:['南'], 班別:'morning', 預設時:12, 預設人:1,
    發票:'6.其他費用', 明細:'其他費用明細', 附表:'其他附表五', 附表號:'五',
    標題:'6.其他費用', 明細標題:'其他費用', 組別:'(一)保安組南側門哨增派',
    發票合計欄:'F', 發票標題合併:'A1:E1', 時數欄:'C', 計價:{一般:'D4',假日:'D8',共計:'D6'},
    時段:{11:'南側門哨 12:00-23:00',12:'南側門哨 11:00-23:00'} },
  { no:7, 代號:[], 班別:null, 預設時:8, 預設人:2, 手動:true,
    發票:'7.安全駕駛費用(VIP泊車)', 明細:'安全駕駛費用(VIP泊車)明細',
    附表:'安全駕駛費用(VIP泊車)附表六', 附表號:'六',
    標題:'7.安全駕駛費用(VIP泊車)', 明細標題:'其他費用', 組別:'(一)安全駕駛費用(VIP泊車)哨增派',
    發票合計欄:'F', 發票標題合併:'A1:E1', 時數欄:'C', 計價:{一般:'D4',假日:'D8',共計:'D6'},
    // 固定 12:30 上哨，時數由咖哩逐日填（8/9/10 小時都出現過），
    // 下哨時間交給 時段文字_() 自動算，不用窮舉對照表
    時段:{8:'VIP泊車哨 12:30-20:30'}, 起始:'12:30', 哨名:'VIP泊車哨 ' }
];
const ITEM_BY_NO = {}; ITEMS.forEach(it => ITEM_BY_NO[it.no] = it);

const 總表項目名 = {
  1:'保全固定每月合約費用', 2:'海底撈增派', 3:'地下停車場增派',
  4:'漢來前服務\n貴賓車增派一人', 5:'假日勤務支援', 6:'其他增派費用',
  7:'安全駕駛費用\n(VIP泊車)'
};

/* ════════════════════════════════════════════════════════════════
   【資料模型 — 改動前務必看懂，這裡搞錯就會算錯錢】
     days[] = [{ d:日, 人:當天人數, 時:每人時數, 假:是否國定假日 }]
     每日小計H（實檔明細頁 C 欄，漢來是 D 欄）＝ 人 × 時
       例：安全駕駛 2 人 × 8H ＝ 每日小計 16
     金額 ＝ Σ每日小計 × 費率
   誤把「時」當每日小計 → 2 人以上的項目少算一半
   誤把每日小計再乘人數 → 多算一倍
   ════════════════════════════════════════════════════════════════ */
function 算項目(days) {
  let 一般時 = 0, 假日時 = 0, 人次 = 0;
  (days || []).forEach(x => {
    const h = Number(x.時) || 0, p = Number(x.人) || 0;
    const 小計 = h * p;
    人次 += p;
    if (x.假) 假日時 += 小計; else 一般時 += 小計;
  });
  return { 一般時, 假日時, 總時: 一般時 + 假日時, 人次,
    一般金額: 一般時 * 一般費率, 假日金額: 假日時 * 假日費率,
    金額: 一般時 * 一般費率 + 假日時 * 假日費率 };
}

/* 主合約：單價×人數 － 減班折抵。折抵時薪＝單價÷8÷30（照實檔算法）
   時薪先四捨五入成整數再乘時數：實檔 55,200÷8÷30 剛好＝230 整數，但單價一改成
   非 240 倍數就會變成 229.16666…，說明欄印出來的算式會跟折抵金額對不起來
   （業主看的是那行算式，數字要能自己乘得出來）。 */
function 算主合約(單價, 人數, 減班時數) {
  const 基礎 = (Number(單價)||0) * (Number(人數)||0);
  const 時薪 = Math.round((Number(單價)||0) / 8 / 30);
  const 折抵 = 時薪 * (Number(減班時數) || 0);
  return { 基礎, 時薪, 折抵, 金額: 基礎 - 折抵 };
}

/* 從月班表 rows 撈出某代號出現的日期。
   rows = [{ name, shifts:[31天代號] }]，shifts[0] 是 1 號 */
function 撈代號日期(rows, 代號清單, 天數) {
  const 結果 = [];
  for (let d = 1; d <= 天數; d++) {
    const 命中 = [];
    (rows || []).forEach(p => {
      const code = String((p.shifts || [])[d - 1] || '').trim();
      if (code && 代號清單.indexOf(code) >= 0) 命中.push({ name: p.name, code });
    });
    if (命中.length) 結果.push({ d, 命中 });
  }
  return 結果;
}

/* 附表用：日期列舉，每行 7 天，最後一行補「日」 */
function 日期分行(days, 月) {
  const ds = days.map(x => String(x.d).padStart(2, '0'));
  const 行 = [];
  for (let i = 0; i < ds.length; i += 7) 行.push(ds.slice(i, i + 7));
  return 行.map((g, i) => {
    const 尾 = (i === 行.length - 1) ? '日' : '';
    const 前綴 = (i === 0) ? (String(月).padStart(2,'0') + '月 ') : '      ';
    return 前綴 + g.join('、') + 尾;
  });
}

/* 附表要寫的時段文字。優先用 ITEMS.時段 的對照表；查不到而該項目有固定上哨時間
   （起始）時，用「起始 ＋ 時數」自動算出下哨時間。
   VIP泊車固定 12:30 上哨，咖哩會依當天狀況調整時數（8/9/10 小時都有），
   對照表不可能窮舉，自動算才不會出現「9小時時段(9小時)」這種佔位文字。 */
function 時段文字_(it, 時) {
  if (it.時段 && it.時段[時]) return it.時段[時];
  if (it.起始) {
    const p = n => String(n).padStart(2, '0');
    const [h, m] = it.起始.split(':').map(Number);
    const 總分 = h * 60 + m + Math.round(時 * 60);
    return (it.哨名 || '') + it.起始 + '-' + p(Math.floor(總分 / 60) % 24) + ':' + p(總分 % 60);
  }
  return 時 + '小時時段';
}

/* 把 days 依「日」聚合。同一天可以有多筆班次（例如 VIP泊車 一個人 8 小時、
   另一個人 9 小時），這是咖哩 2026-08-09 回報的真實情況。
   回傳 [{ d, 假, 班次:[{人,時}], 人:當天總人數, 小計:當天總時數 }] */
function 依日聚合_(days) {
  const m = new Map();
  (days || []).forEach(x => {
    if (!m.has(x.d)) m.set(x.d, { d: x.d, 假: !!x.假, 班次: [], 人: 0, 小計: 0 });
    const v = m.get(x.d);
    v.班次.push({ 人: Number(x.人) || 0, 時: Number(x.時) || 0 });
    v.人 += Number(x.人) || 0;
    v.小計 += (Number(x.人) || 0) * (Number(x.時) || 0);
    if (x.假) v.假 = true;   // 同一天只要有一筆標假日，整天算假日
  });
  return Array.from(m.values()).sort((a, b) => a.d - b.d);
}

/* 附表的內容（日期列舉行＋各時段描述＋小計）。
   產生 xlsx 的 建附表() 與畫面上的預覽都走這裡——預覽看到的必須跟實際下載的檔案
   一模一樣，兩邊各寫一套的話，預覽就失去意義了。

   分段規則：把「當天班次組成完全相同」的日期歸成一段（例如 7/18、7/19 都是
   1人8H＋1人9H），段內再按時數各列一行。這樣同一天多時段的情況才描述得出來，
   對照咖哩實檔 7 月的寫法（09~12日一段、18~19日一段、25~26日一段）。 */
function 附表內容_(it, 月, days) {
  const 依日 = 依日聚合_(days);
  const 組 = new Map();
  依日.forEach(v => {
    const key = v.班次.slice().sort((a, b) => a.時 - b.時 || a.人 - b.人)
      .map(b => b.人 + 'x' + b.時).join(',') + (v.假 ? '|假' : '');
    if (!組.has(key)) 組.set(key, { 假: v.假, 班次: v.班次.slice().sort((a, b) => b.時 - a.時), days: [] });
    組.get(key).days.push(v);
  });
  const 段 = Array.from(組.values()).sort((a, b) => a.days[0].d - b.days[0].d).map(g => {
    const 天數 = g.days.length;
    const 明細行 = g.班次.map(b => ({
      文字: 時段文字_(it, b.時) + '(' + b.時 + '小時) ×' + b.人 + '人'
            + (g.假 ? '【國定假日】' : ''),
      小時: b.時 * b.人 * 天數
    }));
    return {
      日期行: 日期分行(g.days, 月),
      明細行: 明細行,
      每日: g.班次.reduce((s, b) => s + b.人 * b.時, 0),
      小計: 明細行.reduce((s, x) => s + x.小時, 0)
    };
  });
  return { 段: 段, 總時: 段.reduce((s, x) => s + x.小計, 0) };
}

/* 附表要把同時數的日期歸成一組（南側門那種同月有 11H 和 12H 的） */
function 依時數分組(days) {
  const m = new Map();
  (days || []).forEach(x => {
    const k = x.時 + '|' + x.人 + '|' + (x.假 ? '假' : '般');
    if (!m.has(k)) m.set(k, { 時: x.時, 人: x.人, 假: !!x.假, days: [] });
    m.get(k).days.push(x);
  });
  return Array.from(m.values()).sort((a, b) => a.days[0].d - b.days[0].d);
}

const fmt = n => Number(n || 0).toLocaleString('en-US');
const 月天數 = (西元年, 月) => new Date(西元年, 月, 0).getDate();

/* ════════════════════════════════════════════════════════════════
   xlsx 產生（ExcelJS）— 分頁順序照 115年7、8月實檔的 20 分頁標準結構
   ────────────────────────────────────────────────────────────────
   兩個踩過的坑（沿用 tool_guard_gen.html 的經驗）：
     1. mergeCells 一定要在逐格設定樣式「之後」，否則合併範圍最後一格的
        樣式會蓋掉 anchor 格（標題靠左會被中間格的置中蓋掉）。
     2. pageSetup 要一併寫入，否則每次列印都要重設橫向/縮放。
   另：ExcelJS 的 formula 欄位「不要」寫開頭的等號，寫了會變成 ==SUM(...)。
   ════════════════════════════════════════════════════════════════ */
/* ⚠️ 框線一定要連顏色一起指定。ExcelJS 的 { style:'thin' } 只寫粗細不寫顏色，
   產出的 XML 是 <left style="thin"/>，Excel 遇到沒指定顏色的框線渲染行為不一致，
   會出現「有些線畫得出來、有些不見」（2026-08-09 咖哩回報總表項次/內容右邊的
   直線消失）。咖哩手工做的實檔是 <left style="thin"><color auto="1"/></left>。
   這種問題用 ExcelJS 讀回來檢查抓不到（讀回來看起來完全正常），
   只有拆開 xlsx 內部 XML 比對才看得出來。 */
const 線色 = { argb: 'FF000000' };
const 細線 = { style: 'thin', color: 線色 };
const 四邊 = { top: 細線, bottom: 細線, left: 細線, right: 細線 };
const 字型 = (size, bold) => ({ name: '微軟正黑體', size: size || 12, bold: !!bold });
/* 金額一律套千分位。Excel 要靠 numFmt 才會顯示逗號，只寫數值會印出
   2097600 這種七位數，業主看請款單很難讀（2026-08-09 咖哩比對後提出）。 */
const 金額格式 = '#,##0';
const 金額 = (ws, addr, v) => { const c = ws.getCell(addr); c.value = v; c.numFmt = 金額格式; return c; };
/* 公式一律走這個 helper：自動去掉多寫的等號，並強制帶 result
   （ExcelJS 不會自己算，沒帶 result 別的程式讀這個檔會拿不到值） */
const 公式 = (f, result) => ({ formula: String(f).replace(/^=+/, ''), result: result });

/* 建立分頁並套版面。
   ⚠️ 用「固定縮放 scale ＋ 列印區域 printArea」，不要用 fitToPage——
   fitToPage 只會縮小不會放大，內容少的時候表格會擠在紙張左上角一小塊
   （2026-08-09 咖哩回報「總表沒有符合整張 A4」就是這個原因）。
   咖哩手工做的實檔就是 scale + printArea，每個分頁剛好一張 A4，這裡照抄。
   真正把版面撐滿的是「大列高」，printArea 只是框住要印的範圍。 */
function 建頁(wb, name, opt) {
  opt = opt || {};
  const ws = wb.addWorksheet(name, { pageSetup: {
    paperSize: 9,
    orientation: opt.landscape ? 'landscape' : 'portrait',
    fitToPage: false,
    scale: opt.scale || 95,
    printArea: opt.printArea,
    horizontalCentered: opt.hCenter !== false,
    margins: opt.margins || { left: 0.5, right: 0.5, top: 0.5, bottom: 0.5, header: 0.3, footer: 0.3 }
  }});
  (opt.cols || []).forEach((w, i) => { if (w) ws.getColumn(i + 1).width = w; });
  return ws;
}

/* 發票頁中間的「發票位」框——實體發票要貼在這裡。
   咖哩的實檔是用 Excel 的「文字方塊」（可拖曳的圖形物件）做的，ExcelJS 產不出
   圖形物件，所以改用「合併儲存格＋外框＋直排文字」畫一個外觀接近的替代品。
   ⚠️ 一定要先 mergeCells 再對 master 設 border：合併格的框線由 master 決定、
   畫在整個合併範圍的外圍；若先逐格畫框再合併，框線會被合併行為吃掉。 */
function 畫發票位(ws, r1, c1, r2, c2) {
  try { ws.mergeCells(r1, c1, r2, c2); } catch (e) {}
  const cell = ws.getCell(r1, c1);
  cell.value = '發\n票\n位';
  cell.font = { name: '微軟正黑體', size: 28 };
  cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
  cell.border = { top: 細線, bottom: 細線, left: 細線, right: 細線 };
}

/* 附表的框線：兩個並排的 medium 粗線方框（左 B~F、右 H~L），中間 G 欄當間隙。
   ⚠️ 第 1 列是合併的標題列 B1:L1，橫跨兩個框，所以那一列只畫「一整條上框
   ＋左右兩端封口」，不能在 F1／H1 畫側邊——那兩條線落在合併儲存格內部，
   Excel 不會顯示，反而會污染 master 格的樣式（實測 B1 會多出一條右框）。
   第 2 列起才分成兩個框。這是照咖哩實檔逐格量出來的畫法。 */
function 附表框線(ws) {
  const M = { style: 'medium', color: 線色 };   // 顏色不可省，理由見檔頭 細線 的註解
  const 加 = (r, c, 邊) => {
    const cell = ws.getCell(r, c);
    cell.border = Object.assign({}, cell.border, 邊);
  };
  const 左1 = 2, 左2 = 6, 右1 = 8, 右2 = 12, 末 = 35;
  for (let c = 左1; c <= 右2; c++) {
    加(1, c, { top: M });        // 標題列上框（整條）
    加(2, c, { top: M });        // 標題列與內容之間的橫線
    加(末, c, { bottom: M });    // 底框（整條）
  }
  加(1, 左1, { left: M });
  加(1, 右2, { right: M });
  for (let r = 2; r <= 末; r++) {
    加(r, 左1, { left: M });  加(r, 左2, { right: M });
    加(r, 右1, { left: M });  加(r, 右2, { right: M });
  }
}
function 收尾(ws, 範圍, merges) {
  for (let r = 範圍.r1; r <= 範圍.r2; r++) {
    for (let c = 範圍.c1; c <= 範圍.c2; c++) {
      const cell = ws.getCell(r, c);
      cell.border = 四邊;
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      if (!cell.font) cell.font = 字型(12);
    }
  }
  (merges || []).forEach(m => { try { ws.mergeCells(m); } catch (e) {} });
}
/* 'E4' 位移 (下dr, 右dc) → 'F4'。用來從計價區塊錨點推出各格位置。
   只支援單字母欄位（A~Z）——目前版面最遠用到 J 欄，夠用。超出範圍寧可直接報錯，
   也不要回傳算出來的垃圾字元讓它默默寫進請款檔案。 */
function 位移(addr, dr, dc) {
  const m = String(addr).match(/^([A-Z])(\d+)$/);
  if (!m) throw new Error('位移() 只支援單字母欄位 A~Z，收到：' + addr);
  const 新欄 = m[1].charCodeAt(0) + dc;
  if (新欄 < 65 || 新欄 > 90) throw new Error('位移() 算出的欄位超出 A~Z：' + addr + ' 右移 ' + dc);
  return String.fromCharCode(新欄) + (parseInt(m[2], 10) + dr);
}
const 下一欄 = ch => String.fromCharCode(ch.charCodeAt(0) + 1);

/* ⚠️ 以下版面常數「只能有這一份定義」。
   發票頁要「引用」金額格、明細頁要「寫入」金額格，兩邊算出來的位置必須一致；
   一旦各寫一份，改了一邊就會變成發票抓到空格。
   （這個 repo 2026-08-08 才因為 H2 時間寫在兩處而改漏一邊，同一種坑不要再踩。） */
const 金額格 = 錨點 => 位移(錨點, 1, 4);   // 計價區塊：(一)/(二) 錨點往下1列、往右4欄
const 資料首列 = 4;                        // 明細頁逐日資料起始列
const 資料末列 = 34;                       // 4~34 剛好容納 31 天
const 總計列 = 35;

function 建總表(wb, cfg, 結果) {
  // 版面參數照咖哩手工實檔（115年08月）逐項量出來的
  const ws = 建頁(wb, '總表', {
    scale: 84, cols: [6.75, 25.125, 21, 20.75, 33.375],
    margins: { left: 0.51, right: 0.51, top: 1.18, bottom: 1.18, header: 0.31, footer: 0 }
  });
  ws.getCell('A1').value = '天鷹保全駐警保全服務費用' + cfg.民國年 + ' 年 ' + String(cfg.月).padStart(2,'0') + ' 月(未稅)';
  ws.getCell('A1').font = 字型(14, true);
  ['項次','內容','預估金額','金額','撙節(增加)經費原因'].forEach((t, i) => {
    ws.getCell(2, i + 1).value = t; ws.getCell(2, i + 1).font = 字型(12, true);
  });
  const mc = 算主合約(cfg.主合約.單價, cfg.主合約.人數, cfg.主合約.減班時數);
  ws.getCell('A3').value = 1;
  ws.getCell('B3').value = 總表項目名[1];
  金額(ws, 'C3', mc.基礎);
  金額(ws, 'D3', mc.金額);
  ws.getCell('E3').value = 主合約說明(cfg, mc);
  ws.getRow(3).height = 92;

  let r = 4;
  ITEMS.forEach(it => {
    const ref = "'" + it.發票 + "'!" + it.發票合計欄 + '1';
    ws.getCell(r, 1).value = it.no;
    ws.getCell(r, 2).value = 總表項目名[it.no];
    金額(ws, 'C' + r, 公式(ref, 結果[it.no].金額));
    金額(ws, 'D' + r, 公式(ref, 結果[it.no].金額));
    r++;
  });
  (cfg.臨時項目 || []).forEach((it, i) => {
    const res = 算項目(it.days);
    ws.getCell(r, 1).value = 8 + i;
    ws.getCell(r, 2).value = it.名稱;
    金額(ws, 'C' + r, res.金額);
    金額(ws, 'D' + r, res.金額);
    r++;
  });
  const 末 = r;
  const 增派總 = ITEMS.reduce((s, it) => s + 結果[it.no].金額, 0)
    + (cfg.臨時項目 || []).reduce((s, it) => s + 算項目(it.days).金額, 0);
  ws.getCell(末, 1).value = '總計';
  ws.getCell(末, 1).font = 字型(12, true);
  金額(ws, 'C' + 末, 公式('SUM(C3:C' + (末-1) + ')', mc.基礎 + 增派總));
  金額(ws, 'D' + 末, 公式('SUM(D3:D' + (末-1) + ')', mc.金額 + 增派總));
  收尾(ws, { r1:1, r2:末, c1:1, c2:5 }, ['A1:E1', 'A'+末+':B'+末]);
  ws.getCell('E3').alignment = { horizontal:'left', vertical:'middle', wrapText:true };
  /* 列高：靠這個把表格撐滿整張 A4（實檔 R1=30 R2=51.75 R3=140.45 其餘≈69.9）。
     沒設列高的話，就算 scale 對了，表格還是只佔紙張上方一小塊。
     項次列平均分配剩餘高度，臨時項目多時自動壓縮，仍容納於一頁。 */
  ws.getRow(1).height = 30;
  ws.getRow(2).height = 51.75;
  ws.getRow(3).height = 140.45;      // 主合約的算式說明有多行，需要最高
  const 資料列數 = 末 - 3;            // 項2 起到總計列
  const 每列高 = Math.max(24, Math.min(69.95, 490 / 資料列數));
  for (let r = 4; r <= 末; r++) ws.getRow(r).height = 每列高;
  ws.pageSetup.printArea = 'A1:E' + 末;
}

function 主合約說明(cfg, mc) {
  const M = String(cfg.月).padStart(2, '0');
  const 末日 = 月天數(cfg.民國年 + 1911, cfg.月);
  if (!Number(cfg.主合約.減班時數)) return cfg.民國年 + '年合約人數' + cfg.主合約.人數 + '人。';
  return '1.' + cfg.民國年 + '年合約人數' + cfg.主合約.人數 + '人。\n'
    + '2.' + M + '月01至' + M + '月' + 末日 + '日因人力效率化減班，縮減合約時數共' + cfg.主合約.減班時數 + '小時。\n'
    + '3.' + fmt(cfg.主合約.單價) + '÷8÷30＝' + mc.時薪 + '元。\n'
    + '4.' + mc.時薪 + '×' + cfg.主合約.減班時數 + '=' + mc.折抵 + '元。\n'
    + fmt(mc.基礎) + '-' + mc.折抵 + '=' + fmt(mc.金額) + '元。';
}

function 建主合約頁(wb, cfg) {
  /* 發票頁下半部是「留白給實體發票貼上去」的空間，所以列印區域一定要拉到 R41，
     不能只框住有字的前幾列——否則印出來只有頂端一小條，發票沒地方貼
     （2026-08-09 咖哩回報「發票位置都沒做出來」就是這個）。 */
  /* scale 95 不是 98：發票位方框加大後這頁總高變 851pt，98% 會是 834pt
     超過 A4 可用的 813pt 而印成兩頁（2026-08-09 實測抓到）。 */
  const ws = 建頁(wb, '1主合約發票', {
    scale: 95, printArea: 'A1:I41',
    cols: [8.875, 8.875, 8.875, 8.875, 8.875, 8.875, 8.875, 8.875, 14.5],
    margins: { left: 0.51, right: 0.51, top: 0, bottom: 0, header: 0.31, footer: 0.31 }
  });
  [[1,27.75],[2,27.75],[3,27.75],[4,21.6],[10,27.75],[26,30],[27,28.15],[28,28.15],
   [29,28.9],[30,28.9],[31,28.9],[32,28.9],[33,28.9],[34,28.15],[38,27.75]]
    .forEach(([r, h]) => { ws.getRow(r).height = h; });
  const M = String(cfg.月).padStart(2, '0');
  const 末日 = 月天數(cfg.民國年 + 1911, cfg.月);

  ws.getCell('A1').value = '漢神巨蛋' + cfg.民國年 + '年 ' + M + ' 月份服務費用請款明細表(主合約)';
  ws.getCell('A1').font = 字型(16, true);
  ws.getCell('A2').value = M + '月01日至' + M + '月' + 末日 + '日保全固定每月合約費用';
  ws.getCell('A2').font = 字型(14);
  ws.getCell('A3').value = fmt(cfg.主合約.單價) + '元 × ' + cfg.主合約.人數 + '人 = ' + fmt(mc.基礎) + '元(未稅)';
  ws.getCell('A3').font = 字型(14);
  const merges = ['A1:I1','A2:I2','A3:I3'];
  if (Number(cfg.主合約.減班時數)) {
    [ '1.' + M + '月01至' + M + '月' + 末日 + '日因人力效率化減班\n   縮減合約時數共為' + cfg.主合約.減班時數 + '小時。',
      '2.' + fmt(cfg.主合約.單價) + '÷8÷30=' + mc.時薪 + '元。',
      '3.' + mc.時薪 + '×' + cfg.主合約.減班時數 + '=' + mc.折抵 + '元。',
      '4.' + fmt(mc.基礎) + '－' + mc.折抵 + '=' + fmt(mc.金額) + '元'
    ].forEach((t, i) => {
      const r = 29 + i;
      ws.getCell(r, 3).value = t;
      ws.getCell(r, 3).alignment = { horizontal:'left', vertical:'middle', wrapText:true };
      ws.getCell(r, 3).font = 字型(12);
      merges.push('C' + r + ':I' + r);
    });
  }
  merges.forEach(m => { try { ws.mergeCells(m); } catch (e) {} });
  // 主合約頁的發票位：位置比各項發票頁再低一點，因為上面有三行標題
  畫發票位(ws, 6, 4, 23, 6);   // D6:F23（比各項發票頁再低一列，上面有三行標題）
  for (let r = 6; r <= 23; r++) ws.getRow(r).height = 18;
}

function 建發票頁(wb, it, 結果) {
  // 同主合約頁：下半部留白給實體發票，列印區域必須拉到 R42
  /* I 欄是漢來VIP 的合計欄（其餘項目用 F），14pt 粗體加千分位後 8.875 會爆成 ####，
     放寬到 14（2026-08-09 咖哩回報）。 */
  /* 列印範圍要到 J：漢來VIP 的合計在 I 欄、「元」在 J 欄，原本框到 I 會把「元」
     切掉印不出來（2026-08-09 咖哩回報）。其餘項目合計在 F、「元」在 G，本來就在範圍內，
     統一到 J 對它們只是多一欄空白，不影響版面。 */
  const ws = 建頁(wb, it.發票, {
    scale: 95, printArea: 'A1:J42',
    cols: [8.875, 8.875, 8.875, 8.875, 8.875, 19.5, 11.375, 8.875, 14.0, 8.875],
    margins: { left: 0.7, right: 0.7, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 }
  });
  [[1,27.75],[2,28.15],[3,28.15],[10,27.75],[38,27.75],[39,27.75]]
    .forEach(([r, h]) => { ws.getRow(r).height = h; });
  // 發票位所在的列給高一點，方框才夠大（咖哩回報原本的框太小）
  for (let r = 5; r <= 22; r++) ws.getRow(r).height = 18;
  ws.getCell('A1').value = it.標題;
  ws.getCell('A1').font = 字型(16, true);
  /* 標題靠右、金額置中（2026-08-09 咖哩指定）。原本標題置中、金額靠預設，
     兩者中間會空一大片；標題靠右貼近金額欄就不會有那個空洞。 */
  ws.getCell('A1').alignment = { horizontal:'right', vertical:'middle', wrapText:true };
  const 一般格 = 金額格(it.計價.一般), 假日格 = 金額格(it.計價.假日);
  金額(ws, it.發票合計欄 + '1',
    公式("'" + it.明細 + "'!" + 一般格 + "+'" + it.明細 + "'!" + 假日格, 結果.金額));
  ws.getCell(it.發票合計欄 + '1').font = 字型(14, true);
  ws.getCell(it.發票合計欄 + '1').alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getCell(下一欄(it.發票合計欄) + '1').value = '元';
  ws.getCell(下一欄(it.發票合計欄) + '1').alignment = { horizontal: 'left', vertical: 'middle' };
  try { ws.mergeCells(it.發票標題合併); } catch (e) {}
  畫發票位(ws, 5, 4, 22, 6);   // D5:F22（列高已加到18，框比原本大約四成）
}

function 建明細頁(wb, it, cfg, days) {
  /* A 欄放的是完整日期（2026/8/1），欄寬 12 會顯示成 #####（2026-08-09 咖哩回報）。
     實檔 A 欄是 15.4（漢來 16.6，因為它多一個「時數」欄，整體往右推）。
     Excel 的規則是欄寬不足就顯示 #，不會自動縮字，所以寬度一定要給夠。 */
  /* scale 用 90 不用 95：列高固定（R1=26.25 R2=23.25 R3~R37=23.1，共約 873pt），
     A4 直向可用高度約 813pt（842 扣上下邊界），95% 會是 829pt 剛好溢出到第二頁。
     90% ＝ 786pt，留有餘裕。日數多寡不影響總高（空列也有設列高）。 */
  /* E／F 欄放的是計價區的「共計」金額，加了千分位之後 6.0~6.3 的寬度會變成 #####
     （2026-08-09 咖哩回報，實測 21,600 需要約 7.8 才放得下）。一律給到 11 留餘裕，
     單價若哪天調高、金額變七位數也還撐得住。 */
  const ws = 建頁(wb, it.明細, {
    scale: 90, printArea: 'A1:J38',
    cols: it.有時數欄
      ? [16.6, 10.9, 9.1, 14.4, 8.5, 11.0, 10.8, 9.9, 16.5, 8.9]
      : [15.4, 10.4, 12.4, 7.6, 11.0, 11.0, 7.0, 13.8, 9.5, 8.9],
    margins: { left: 0.2, right: 0.2, top: 0.2, bottom: 0.2, header: 0, footer: 0 }
  });
  ws.getRow(1).height = 26.25;
  ws.getRow(2).height = 23.25;
  for (let r = 3; r <= 37; r++) ws.getRow(r).height = 23.1;
  const M = String(cfg.月).padStart(2, '0');
  ws.getCell('A1').value = it.明細標題;      ws.getCell('A1').font = 字型(14, true);
  ws.getCell('A2').value = cfg.民國年 + '年' + M + '月服務費請款時數明細表';
  ws.getCell('A2').font = 字型(13, true);
  // 漢來明細的欄序與其他頁不同：B時數 C人數 D小計（實檔如此，不要「統一」掉）
  const 表頭 = it.有時數欄 ? ['日期','時數','人數','每日小計H'] : ['日期','人數','每日小計H'];
  表頭.forEach((t, i) => { ws.getCell(3, i+1).value = t; ws.getCell(3, i+1).font = 字型(12, true); });

  /* 同一天可能有多筆班次（VIP泊車 一人8H、另一人9H），明細頁一天只佔一列，
     所以先聚合：人數加總、每日小計加總。這樣 7/18 會顯示「2人 / 17小時」。 */
  依日聚合_(days).forEach((x, i) => {
    const r = 資料首列 + i;
    /* ⚠️ 一定要用 Date.UTC，不能用 new Date(年, 月, 日)。
       後者建立的是「本地時間 00:00」，台灣是 UTC+8，換算成 UTC 會變成前一天 16:00；
       ExcelJS 寫入 Excel 日期序號時是以 UTC 為準，結果整欄日期往前跑一天
       （2026-08-09 從咖哩上傳的產出檔發現：8月的明細第一列變成 2026/7/31）。
       金額用的是人數×時數不看日期，所以對帳測試全過也抓不到這個錯。 */
    ws.getCell(r, 1).value = new Date(Date.UTC(cfg.民國年 + 1911, cfg.月 - 1, x.d));
    /* 顯示成 08/01(週六)，照咖哩實檔的格式。aaa 是 Excel 的星期短格式（繁中顯示「週六」）。
       比 yyyy/m/d 短、欄寬需求小，而且多了星期方便核對假日。
       底層仍存日期值（不是文字），排序與公式都還能用。 */
    ws.getCell(r, 1).numFmt = 'mm/dd(aaa)';
    if (it.有時數欄) {
      /* 漢來頁有獨立的「時數」欄。同一天只有一種時數時照寫並用 B*C 公式；
         萬一同天有多種時數（自動抓的 H/H2 互斥不會發生，手動改才可能），
         時數欄改放平均、小計直接寫死值，免得公式算出來跟小計對不起來。 */
      const 單一 = x.班次.length === 1;
      ws.getCell(r, 2).value = 單一 ? x.班次[0].時 : Math.round(x.小計 / (x.人 || 1) * 100) / 100;
      ws.getCell(r, 3).value = x.人;
      ws.getCell(r, 4).value = 單一 ? 公式('B'+r+'*C'+r, x.小計) : x.小計;
    } else {
      ws.getCell(r, 2).value = x.人;
      ws.getCell(r, 3).value = x.小計;
    }
  });

  // 總計列與 SUM 範圍一律走上面的版面常數，不要在這裡寫死數字。
  // （實檔有幾頁把總計放 R34 且 SUM 只加到第 33 列，滿月會漏算最後一天，這裡統一修正。）
  const res = 算項目(days), 總 = 總計列, 時欄 = it.時數欄;
  const 範圍 = 欄 => 'SUM(' + 欄 + 資料首列 + ':' + 欄 + 資料末列 + ')';
  ws.getCell(總, 1).value = '總計'; ws.getCell(總, 1).font = 字型(12, true);
  // 漢來頁 B 欄是「每人時數」，總計要用聚合後的每日時數相加（不能直接加原始 days，
  // 同一天有多筆時會重複計入）
  const 時數和 = 依日聚合_(days).reduce((s, x) => s + (x.人 ? x.小計 / x.人 : 0), 0);
  ws.getCell(總, 2).value = 公式(範圍('B'), it.有時數欄 ? 時數和 : res.人次);
  if (it.有時數欄) ws.getCell(總, 3).value = 公式(範圍('C'), res.人次);
  ws.getCell(時欄 + 總).value = 公式(範圍(時欄), res.總時);
  寫計價(ws, it, 總, res);
  ws.getCell(37, 1).value = '※時數明細請參閱附表' + it.附表號;
  收尾(ws, { r1:3, r2:總, c1:1, c2: it.有時數欄 ? 4 : 3 }, ['A37:G37']);
}

/* 計價區塊：(一)一般270 (二)國定假日410 (共計)。錨點逐項不同，見 ITEMS.計價 */
function 寫計價(ws, it, 總列, res) {
  const p = it.計價, 時欄 = it.時數欄;
  const put = (addr, v, f) => { const c = ws.getCell(addr); c.value = v; c.font = f || 字型(12); };
  put(p.一般, '(一)');
  put(位移(p.一般, 0, 1), '一般增派(每小時' + 一般費率 + '元)');
  const r1 = 位移(p.一般, 1, 0);
  put(r1, 一般費率);
  put(位移(r1, 0, 1), '元×');
  /* 🔴 2026-08-08 修：這格原本一律寫公式「=C35」（總計欄）。但 C35 是「一般＋假日」
     的總時數，明細表沒有欄位可以標記哪天是國定假日，公式沒辦法只加一般日。
     結果是：畫面預覽用的是正確的一般時數，Excel 開檔重算卻抓到總時數 → 只要該月
     有國定假日，送出去的檔案金額就會比畫面多（多請錢）。
     修法：沒有假日時 C35 剛好等於一般時數，維持公式（跟實檔長相一致）；
     一有假日就改寫純數值，正確性優先於形式。 */
  ws.getCell(位移(r1, 0, 2)).value = res.假日時
    ? res.一般時
    : 公式(時欄 + 總列, res.一般時);
  put(位移(r1, 0, 3), '小時=');
  金額(ws, 金額格(p.一般), 公式(位移(r1,0,0) + '*' + 位移(r1,0,2), res.一般金額));
  put(位移(r1, 0, 5), '元');

  put(p.假日, '(二)');
  put(位移(p.假日, 0, 1), '國定假日增派(每小時' + 假日費率 + '元)');
  const r2 = 位移(p.假日, 1, 0);
  put(r2, 假日費率);
  put(位移(r2, 0, 1), '元×');
  put(位移(r2, 0, 2), res.假日時);
  put(位移(r2, 0, 3), '小時=');
  金額(ws, 金額格(p.假日), 公式(位移(r2,0,0) + '*' + 位移(r2,0,2), res.假日金額));
  put(位移(r2, 0, 5), '元');

  put(p.共計, '共計:', 字型(12, true));
  金額(ws, 位移(p.共計, 0, 1), 公式(金額格(p.一般) + '+' + 金額格(p.假日), res.金額));
  ws.getCell(位移(p.共計, 0, 1)).font = 字型(13, true);
  put(位移(p.共計, 0, 3), '元(未稅)');
}

function 建附表(wb, it, cfg, days) {
  /* 附表的框線是「兩個並排的粗線大方框」（B1:F35 與 H1:L35），不是每格畫線。
     中間 G 欄刻意極窄（0.125）當作兩框之間的間隙。
     2026-08-09 咖哩回報「附表的表格框線都沒做出來」——先前完全沒畫。 */
  const ws = 建頁(wb, it.附表, {
    scale: 80, printArea: 'A1:M37',
    cols: [4.625, 9.875, 9.875, 9.875, 14.125, 12.125, 0.125, 9.875, 9.875, 9.875, 9.875, 12.125, 4.625],
    margins: { left: 0.2, right: 0.2, top: 0.2, bottom: 0.2, header: 0.12, footer: 0.12 }
  });
  // 列高 24（原 19.9）：咖哩回報附表的字擠在一起，行距要鬆一點才好讀
  for (let r = 1; r <= 38; r++) ws.getRow(r).height = 24;
  ws.getCell('B1').value = '附表' + it.附表號; ws.getCell('B1').font = 字型(16, true);
  ws.getCell('B2').value = '    ' + it.組別;   ws.getCell('B2').font = 字型(13, true);
  ws.getCell('B2').alignment = { horizontal:'left', vertical:'middle' };
  const merges = ['B1:L1','B2:F2'];
  const 靠左 = r => { ws.getCell(r,2).alignment = { horizontal:'left', vertical:'middle' }; ws.getCell(r,2).font = 字型(12); };
  let r = 3;
  const 內容 = 附表內容_(it, cfg.月, days);  // 與畫面預覽共用同一份內容，確保預覽＝實際檔案
  內容.段.forEach(g => {
    g.日期行.forEach(t => {
      ws.getCell(r, 2).value = t; 靠左(r); merges.push('B'+r+':E'+r); r++;
    });
    // 同一天可能有多種時數（VIP泊車 一人8H、另一人9H），各列一行
    g.明細行.forEach(行 => {
      ws.getCell(r, 2).value = '        ' + 行.文字;
      靠左(r);
      ws.getCell(r, 6).value = 行.小時 + '小時';
      merges.push('B'+r+':E'+r); r++;
    });
    ws.getCell(r,3).value='每日共計'; ws.getCell(r,4).value=g.每日; ws.getCell(r,5).value='小時'; r++;
    ws.getCell(r,3).value='共小計';   ws.getCell(r,4).value=g.小計; ws.getCell(r,5).value='小時'; r++;
    r++;
  });
  const 末 = Math.max(30, r + 1);
  ws.getCell(末,3).value = '以上共計'; ws.getCell(末,3).font = 字型(12, true);
  ws.getCell(末,4).value = 內容.總時;   ws.getCell(末,4).font = 字型(12, true);
  ws.getCell(末,5).value = '小時';
  merges.forEach(m => { try { ws.mergeCells(m); } catch (e) {} });
  /* 框線要畫在合併之後：合併會讓範圍內的格子共用同一個樣式物件，
     先畫框再合併的話，框線會被合併行為蓋掉（跟本檔開頭的踩坑同一個原因）。 */
  附表框線(ws);
}

function buildWorkbook(ExcelJSLib, cfg) {
  const wb = new ExcelJSLib.Workbook();
  const 結果 = {};
  ITEMS.forEach(it => { 結果[it.no] = 算項目((cfg.items[it.no] || {}).days || []); });
  建總表(wb, cfg, 結果);
  建主合約頁(wb, cfg);
  ITEMS.forEach(it => {
    const days = (cfg.items[it.no] || {}).days || [];
    建發票頁(wb, it, 結果[it.no]);
    建明細頁(wb, it, cfg, days);
    建附表(wb, it, cfg, days);
  });
  return wb;
}

/* 逐日編輯表。手機優先：用網格排版，不做橫向捲動 */
function DayEditor({ 民國年, 月, days, onChange, 預設時, 預設人 }) {
  const 西元 = 民國年 + 1911;
  const 天數 = 月天數(西元, 月);
  /* 同一天可以加第二筆（例如 VIP泊車 一人8H、另一人9H），所以日期不去重——
     全部日期都可選。已經有資料的那天會標「已有」，加進去就是同天第二筆。
     （2026-08-09 咖哩回報實際會發生這種情況） */
  const 已用 = {};
  days.forEach(x => { 已用[x.d] = (已用[x.d] || 0) + 1; });
  const 可加 = [];
  for (let d = 1; d <= 天數; d++) 可加.push(d);
  const [新日, set新日] = useState('');

  const 改 = (i, k, v) => {
    const n = days.slice();
    n[i] = Object.assign({}, n[i], { [k]: v });
    onChange(n);
  };
  const 刪 = i => onChange(days.filter((_, j) => j !== i));
  const 加 = () => {
    const d = parseInt(新日, 10);
    if (!d) return;
    // 新增的一天沿用「最後一天」的人數時數（同項目通常一樣），
    // 表是空的才退回該項目的預設值（海底撈4H、泊車8H×2人…），不要一律給8
    const 樣本 = days[days.length - 1] || {};
    const n = days.concat([{
      d,
      人: 樣本.人 != null ? 樣本.人 : (預設人 || 1),
      時: 樣本.時 != null ? 樣本.時 : (預設時 || 8),
      假: false
    }]);
    n.sort((a, b) => a.d - b.d);
    onChange(n); set新日('');
  };

  return h('div', null,
    days.length === 0
      ? h('div', { className: 'empty-note' }, '這個項目本月沒有資料。如果實際有，用下面的「新增日期」加進來。')
      : h('div', { className: 'day-grid' },
          h('div', { className: 'gh' }, '日期'),
          h('div', { className: 'gh' }, '人數'),
          h('div', { className: 'gh' }, '每人時數'),
          h('div', { className: 'gh' }, '國定\n假日'),
          h('div', { className: 'gh' }, ''),
          ...days.map((x, i) => [
            h('div', { key: 'd' + i, className: 'dlabel' },
              String(x.d) + '日',
              h('span', { className: 'wd' }, '(' + WD[new Date(西元, 月 - 1, x.d).getDay()] + ')')),
            h('input', { key: 'p' + i, type: 'number', min: '0', step: '1', value: x.人,
              onChange: e => 改(i, '人', parseFloat(e.target.value) || 0) }),
            h('input', { key: 'h' + i, type: 'number', min: '0', step: '0.5', value: x.時,
              onChange: e => 改(i, '時', parseFloat(e.target.value) || 0) }),
            h('input', { key: 'f' + i, type: 'checkbox', className: 'chk', checked: !!x.假,
              onChange: e => 改(i, '假', e.target.checked) }),
            h('button', { key: 'x' + i, className: 'del-btn', title: '刪除這天',
              onClick: () => 刪(i) }, '×')
          ]).reduce((a, b) => a.concat(b), [])
        ),
    h('div', { className: 'row', style: { marginTop: '10px', alignItems: 'flex-end' } },
      h('div', { className: 'field', style: { marginBottom: 0 } },
        h('label', null, '新增日期'),
        h('select', { value: 新日, onChange: e => set新日(e.target.value) },
          h('option', { value: '' }, '選擇…'),
          ...可加.map(d => h('option', { key: d, value: d },
            d + '日 (' + WD[new Date(西元, 月 - 1, d).getDay()] + ')'
            + (已用[d] ? '　已有' + 已用[d] + '筆' : ''))))),
      h('button', { className: 'btn btn-ghost btn-sm', onClick: 加, disabled: !新日 }, '＋ 加入'))
  );
}

function App() {
  /* 預設帶「上個月」：咖哩是次月初做上個月的請款，開起來就是他要做的那個月，
     不用每次自己改。（2026-08-09 依實際作業時間調整） */
  const 今 = new Date();
  const 上月 = new Date(今.getFullYear(), 今.getMonth() - 1, 1);
  const [民國年, set民國年] = useState(上月.getFullYear() - 1911);
  const [月, set月] = useState(上月.getMonth() + 1);
  const [主合約, set主合約] = useState({ 單價: 55200, 人數: 38, 減班時數: 0 });
  const [items, setItems] = useState(() => {
    const o = {}; ITEMS.forEach(it => o[it.no] = { days: [] }); return o;
  });
  const [來源, set來源] = useState({});      // {項次: 'auto'|'manual'}
  const [臨時, set臨時] = useState([]);
  const [busy, setBusy] = useState(false);
  const [班表狀態, set班表狀態] = useState(null);
  const [展開, set展開] = useState(null);
  const [預覽開, set預覽開] = useState(false);
  const [toast, setToast] = useState(null);
  const 提示 = (text, type) => { setToast({ text, type: type || 'ok' }); setTimeout(() => setToast(null), 2600); };

  const 結果 = useMemo(() => {
    const o = {}; ITEMS.forEach(it => o[it.no] = 算項目(items[it.no].days)); return o;
  }, [items]);
  const mc = 算主合約(主合約.單價, 主合約.人數, 主合約.減班時數);
  const 臨時金額 = 臨時.reduce((s, t) => s + 算項目(t.days).金額, 0);
  const 總金額 = mc.金額 + ITEMS.reduce((s, it) => s + 結果[it.no].金額, 0) + 臨時金額;

  /* 讀月班表 → 依代號自動帶出各項日期。
     線上班表只有「當月」一份，月份不符時一律不套用——寧可讓咖哩手動輸入，
     也不能拿錯月份的資料去請款。 */
  async function 讀班表() {
    // 已經有資料才問：重讀會整批覆蓋，手動改過的時數/假日勾選都會不見
    const 已有 = ITEMS.some(it => (items[it.no].days || []).length);
    if (已有 && !window.confirm('重新讀取會覆蓋掉目前所有項目的資料，包含你手動改過的時數和國定假日勾選。要繼續嗎？')) return;
    setBusy(true); set班表狀態(null);
    try {
      /* 2026-08-09 改：原本讀 action=getSchedule（永遠只回「目前線上」那份），
         但線上班表每月 1 號凌晨會被下個月蓋掉，而咖哩是次月初做上個月的請款——
         等於每次要用的班表都剛好在前一天消失。
         改讀 getScheduleByMonth：GAS 端會先找線上、再翻歷史備份分頁，
         而且只回指定月份，找不到就明確失敗，不會拿別的月份充數。 */
      const 期望 = 民國年 + 1911 + '/' + String(月).padStart(2, '0');
      const 資料 = {};
      for (const shift of ['morning', 'night']) {
        const res = await fetch(SCHEDULE_GAS_URL + '?action=getScheduleByMonth&shift='
          + shift + '&ym=' + encodeURIComponent(期望));
        const d = await res.json();
        if (!d.success) {
          set班表狀態({ ok: false,
            msg: (d.error || '讀取失敗') + '\n\n'
              + '班表備份是 2026-08-09 才加上去的，那之前的月份沒有留存，讀不到很正常。\n'
              + '這個月的日期請手動輸入，其餘功能都不受影響。' });
          setBusy(false); return;
        }
        if (!Array.isArray(d.rows)) throw new Error('班表回應格式異常（' + shift + '）');
        資料[shift] = d;
      }
      const 來源說明 = ['morning', 'night'].every(s => 資料[s].source === 'backup')
        ? '（來自歷史備份）' : '';
      const 天數 = 月天數(民國年 + 1911, 月);
      const 新items = {}, 新來源 = {}, 警語 = [];
      ITEMS.forEach(it => {
        if (it.手動 || !it.代號.length) { 新items[it.no] = items[it.no]; 新來源[it.no] = 'manual'; return; }
        const rows = 資料[it.班別 === 'night' ? 'night' : 'morning'].rows;
        const 命中 = 撈代號日期(rows, it.代號, 天數);
        新items[it.no] = { days: 命中.map(x => {
          const codes = x.命中.map(c => c.code).filter((v, i, a) => a.indexOf(v) === i);
          // H/H2 實務上互斥（同一天只會有一種），真的同時出現代表班表有問題：
          // 時數只能取其中一個，會少算或多算，所以一定要吐警告讓咖哩自己核。
          if (codes.length > 1) {
            警語.push(月 + '/' + x.d + ' 同時出現「' + codes.join('、') + '」代號（'
              + x.命中.map(c => c.name).join('、') + '），時數只能取一種，已用「' + codes[0]
              + '」計算，請自己核對這天');
          }
          return {
            d: x.d,
            人: x.命中.length,
            時: (it.代號時數 && it.代號時數[codes[0]]) || it.預設時,
            假: false
          };
        }) };
        新來源[it.no] = 'auto';
      });
      setItems(新items); set來源(新來源);
      const 抓到 = ITEMS.filter(it => !it.手動).reduce((s, it) => s + 新items[it.no].days.length, 0);
      // 有多種時數的項目（南側門 11/12H、停車場 8/4H）班表判斷不出來，一律帶預設值，
      // 不明講的話咖哩會以為時數也是自動算好的。
      const 需核對 = ITEMS.filter(it => !it.手動 && Object.keys(it.時段 || {}).length > 1
        && !it.代號時數 && 新items[it.no].days.length)
        .map(it => 總表項目名[it.no].replace('\n', ''));
      set班表狀態({ ok: true, 警語, msg: '已讀取 ' + 期望 + ' 月班表' + 來源說明 + '，自動帶出 ' + 抓到
        + ' 天的增派紀錄。\n※ 自動帶出的是「哪幾天」，時數一律先給預設值，請逐項核對。'
        + (需核對.length ? ('\n※ ' + 需核對.join('、') + ' 同一個代號會有不同時數，班表判斷不出來，這幾項務必逐日確認。') : '')
        + '\n※ 國定假日要自己勾，系統不會自動判斷。' });
      提示('班表讀取完成');
    } catch (e) {
      set班表狀態({ ok: false, msg: '讀取失敗：' + e.message + '。可以改用手動輸入，不影響產生檔案。' });
      提示('讀取失敗', 'err');
    }
    setBusy(false);
  }

  async function 下載() {
    setBusy(true);
    try {
      const cfg = { 民國年, 月, 主合約, items, 臨時項目: 臨時 };
      const wb = buildWorkbook(ExcelJS, cfg);
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 民國年 + '_' + String(月).padStart(2, '0') + '月漢神巨蛋請款資料.xlsx';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      提示('已下載');
    } catch (e) { 提示('產生失敗：' + e.message, 'err'); }
    setBusy(false);
  }

  const 加臨時 = () => set臨時(臨時.concat([{ 名稱: '', days: [] }]));

  return h('div', { className: 'container' },
    h('div', { className: 'header' },
      h('a', { className: 'back-btn', href: 返回網址 }, h('i', { className: 'ti ti-arrow-left' }), '返回'),
      h('div', { className: 'title-wrap' },
        h('div', { className: 'title-main' }, '請款資料產生'),
        h('div', { className: 'title-sub' }, 'TIANYING SECURITY · BILLING')),
      h('div', { style: { width: '86px' } })),

    /* 步驟一 */
    h('div', { className: 'card' },
      h('div', { className: 'step-head' },
        h('div', { className: 'step-no' }, '1'),
        h('div', { className: 'step-title' }, '基本設定')),
      h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '民國年'),
          h('input', { type: 'number', value: 民國年, onChange: e => set民國年(parseInt(e.target.value) || 0) })),
        h('div', { className: 'field' }, h('label', null, '月份'),
          h('select', { value: 月, onChange: e => set月(parseInt(e.target.value)) },
            ...Array.from({ length: 12 }, (_, i) => h('option', { key: i, value: i + 1 }, (i + 1) + ' 月'))))),
      h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '合約單價'),
          h('input', { type: 'number', value: 主合約.單價,
            onChange: e => set主合約(Object.assign({}, 主合約, { 單價: parseFloat(e.target.value) || 0 })) })),
        h('div', { className: 'field' }, h('label', null, '合約人數'),
          h('input', { type: 'number', value: 主合約.人數,
            onChange: e => set主合約(Object.assign({}, 主合約, { 人數: parseFloat(e.target.value) || 0 })) })),
        h('div', { className: 'field' }, h('label', null, '減班時數'),
          h('input', { type: 'number', step: '0.5', value: 主合約.減班時數,
            onChange: e => set主合約(Object.assign({}, 主合約, { 減班時數: parseFloat(e.target.value) || 0 })) }))),
      h('div', { className: 'hint' },
        '主合約 = ' + fmt(主合約.單價) + ' × ' + 主合約.人數 + '人 = ' + fmt(mc.基礎) + '元'
        + (主合約.減班時數 ? ('，減班折抵 ' + mc.時薪 + '元 × ' + 主合約.減班時數 + '小時 = ' + fmt(mc.折抵) + '元 → 實收 ' + fmt(mc.金額) + '元') : '')),
      h('button', { className: 'btn btn-sec btn-full', style: { marginTop: '12px' }, onClick: 讀班表, disabled: busy },
        h('i', { className: 'ti ti-cloud-download' }), busy ? '讀取中…' : '讀取月班表，自動帶入時數'),
      班表狀態 && h('div', { className: 'alert ' + (班表狀態.ok ? 'alert-ok' : 'alert-warn'),
        style: { marginTop: '12px', marginBottom: 0, whiteSpace: 'pre-line' } }, 班表狀態.msg),
      班表狀態 && 班表狀態.警語 && 班表狀態.警語.length
        ? h('div', { className: 'alert alert-err', style: { marginTop: '10px', marginBottom: 0 } },
            h('div', { style: { fontWeight: 700, marginBottom: '4px' } }, '⚠ 班表有這些狀況要你確認：'),
            ...班表狀態.警語.map((w, i) => h('div', { key: i }, '· ' + w)))
        : null),

    /* 步驟二 */
    h('div', { className: 'card' },
      h('div', { className: 'step-head' },
        h('div', { className: 'step-no' }, '2'),
        h('div', { className: 'step-title' }, '各項確認')),
      ...ITEMS.map(it => h(ItemCard, {
        key: it.no, it, 民國年, 月, data: items[it.no],
        來源: 來源[it.no] || (it.手動 ? 'manual' : 'manual'),
        展開: 展開 === it.no,
        setToggle: () => set展開(展開 === it.no ? null : it.no),
        onChange: nd => setItems(Object.assign({}, items, { [it.no]: nd }))
      })),
      ...臨時.map((t, i) => h('div', { key: 'x' + i, className: 'item-card' },
        h('div', { className: 'item-head' },
          h('div', { className: 'item-no' }, 8 + i),
          h('div', { className: 'item-name', style: { paddingRight: '8px' } },
            h('input', { type: 'text', placeholder: '臨時項目名稱（例：週年慶增派）', value: t.名稱,
              onChange: e => { const n = 臨時.slice(); n[i] = Object.assign({}, t, { 名稱: e.target.value }); set臨時(n); } })),
          h('div', { className: 'item-amt' }, '$' + fmt(算項目(t.days).金額)),
          h('button', { className: 'del-btn', onClick: () => set臨時(臨時.filter((_, j) => j !== i)) }, '×')),
        h('div', { className: 'item-body' },
          h('div', { className: 'alert alert-warn', style: { marginTop: '12px' } },
            '⚠ 臨時項目只會出現在「總表」，不會產生對應的發票／明細／附表三頁。',
            h('br'), '項次 1~7 每一項都有三層佐證，這一項只有一個金額數字，業主承辦人可能會要求補件。',
            h('br'), '要用的話，明細與附表請自己另外附上。'),
          h(DayEditor, { 民國年, 月, days: t.days,
            onChange: nd => { const n = 臨時.slice(); n[i] = Object.assign({}, t, { days: nd }); set臨時(n); } })))),
      h('button', { className: 'btn btn-ghost btn-full btn-sm', style: { marginTop: '4px' }, onClick: 加臨時 },
        h('i', { className: 'ti ti-plus' }), '新增臨時項目')),

    /* 步驟三 */
    h('div', { className: 'card' },
      h('div', { className: 'step-head' },
        h('div', { className: 'step-no' }, '3'),
        h('div', { className: 'step-title' }, '總表預覽')),
      h('table', { className: 'sum-table' }, h('tbody', null,
        h('tr', null, h('td', null, '1. ' + 總表項目名[1]), h('td', null, fmt(mc.金額))),
        ...ITEMS.map(it => h('tr', { key: it.no },
          h('td', null, it.no + '. ' + 總表項目名[it.no].replace('\n', '')),
          h('td', null, fmt(結果[it.no].金額)))),
        ...臨時.map((t, i) => h('tr', { key: 'x' + i },
          h('td', null, (8 + i) + '. ' + (t.名稱 || '（未命名）')),
          h('td', null, fmt(算項目(t.days).金額)))),
        h('tr', { className: 'total' }, h('td', null, '總計（未稅）'), h('td', null, fmt(總金額))))),
      h('button', { className: 'btn btn-sec btn-full', style: { marginTop: '14px' }, onClick: () => set預覽開(true) },
        h('i', { className: 'ti ti-eye' }), '預覽內容'),
      h('button', { className: 'btn btn-pri btn-full', style: { marginTop: '9px' }, onClick: 下載, disabled: busy },
        h('i', { className: 'ti ti-file-spreadsheet' }), busy ? '產生中…' : '產生 xlsx 下載'),
      h('div', { className: 'hint' },
        '建議先按「預覽內容」在手機上核對過，再下載。產生的檔案是 20 分頁的完整請款資料（總表＋主合約＋各項發票/明細/附表），列印格式已內建橫向縮一頁。')),

    預覽開 && h(PreviewModal, {
      cfg: { 民國年, 月, 主合約, items, 臨時項目: 臨時 },
      結果, mc, 總金額, busy,
      onClose: () => set預覽開(false),
      onDownload: async () => { await 下載(); set預覽開(false); }
    }),
    h(Toast, { msg: toast })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
}
</script>
</body>
</html>
