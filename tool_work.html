<title>天鷹保全 · 施工管理系統</title>

<!--
=============================================================
【GAS Web App 部署說明】
1. 開啟 Google Apps Script：https://script.google.com/
2. 新增專案，貼上以下代碼後儲存：

function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var sheetName = data.sheet;
    var ss = SpreadsheetApp.openById('1QuNkwu9zgPidUfSgWpqyT1M9X683IU-0LhXTc23hw-A');
    var sheet = ss.getSheetByName(sheetName);
    if(!sheet) throw new Error('找不到分頁：' + sheetName);
    var values = sheet.getDataRange().getValues();
    var found = false;
    for (var i = 1; i < values.length; i++) {
      var rowId = String(values[i][0]).trim();
      var dataId = String(data.id || '').trim();
      // 主要用ID比對，次要用廠商+月+日+進場時間
      var byId = dataId && dataId !== 'null' && rowId === dataId;
      var byCombo = !byId && (String(values[i][2]).trim() === String(data.vendor || '').trim())
                    && (String(values[i][3]).trim() === String(data.month || '').trim())
                    && (String(values[i][4]).trim() === String(data.day || '').trim())
                    && (String(values[i][5]).trim() === String(data.inTime || '').trim());
      if(byId || byCombo) {
        // O 欄 = 第15欄。每天制：寫「報到時間戳」而非永久字面值，前端據此判定是否過退場時間
        sheet.getRange(i + 1, 15).setValue(Utilities.formatDate(new Date(), 'Asia/Taipei', 'yyyy-MM-dd HH:mm'));
        found = true;
        break;
      }
    }
    return ContentService
      .createTextOutput(JSON.stringify({ success: found, msg: found ? 'OK' : '找不到對應資料列' }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService
      .createTextOutput(JSON.stringify({ success: false, msg: err.message }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

3. 部署 → 新增部署 → 類型選「網路應用程式」
   執行身分：我（你的 Google 帳號）
   存取權限：所有人
4. 複製部署網址，填入下方 JS 的 GAS_URL 變數
=============================================================
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0C10;--bg2:#0D0F14;--sur:#111827;
  --gld:#D4A800;--gld2:#FFD700;--gld3:#C9A227;--gldg:rgba(212,168,0,.14);
  --ind:#818CF8;--wrn:#FB923C;--red:#F87171;
  --t1:#F5F5F5;--t2:#8A95A8;--t3:#4B5563;
  --bdr:rgba(255,255,255,.07);
}
body{background:var(--bg);color:var(--t1);font-family:'Microsoft JhengHei','微軟正黑體',system-ui,sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--t3);border-radius:2px}
input[type=date]{color-scheme:dark}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-rings{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:1.5px solid transparent}
.r1{width:64px;height:64px;border-top-color:var(--gld2);border-right-color:rgba(212,168,0,.45);animation:spin 2s linear infinite;box-shadow:0 0 12px rgba(255,215,0,.2)}
.r2{width:104px;height:104px;border-bottom-color:var(--gld);border-left-color:rgba(212,168,0,.5);animation:spin 3.1s linear infinite reverse}
.r3{width:144px;height:144px;border-top-color:var(--gld3);animation:spin 4.3s linear infinite}
.r4{width:184px;height:184px;border-right-color:var(--gld2);border-left-color:rgba(212,168,0,.25);animation:spin 5.8s linear infinite reverse}
.r5{width:224px;height:224px;border-bottom-color:var(--gld);animation:spin 7.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-logo{text-align:center;z-index:1}
.sp-logo img{width:64px;height:64px;max-width:100%;object-fit:contain;display:block;margin:0 auto 8px;filter:drop-shadow(0 0 16px rgba(212,168,0,.7))}
.sp-brand{font-size:1.9rem;font-weight:800;color:var(--gld);letter-spacing:.12em;text-shadow:0 0 28px rgba(212,168,0,.55)}
.sp-sub{font-size:.56rem;color:var(--t2);letter-spacing:.2em;margin-top:4px}
#sp-msg{margin-top:24px;font-size:.8rem;color:var(--t2);letter-spacing:.06em;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:200;background:rgba(10,12,16,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--bdr);padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between}
.hdr-l{display:flex;align-items:center;gap:.5rem}
.hdr-logo{width:32px;height:32px;max-width:100%;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(212,168,0,.5))}
.hdr-l-txt{display:flex;flex-direction:column}
.hdr-ttl{font-size:1.1rem;font-weight:800;color:var(--gld);letter-spacing:.07em}
.hdr-sub{font-size:.55rem;color:var(--t3);letter-spacing:.18em}
.hdr-r{display:flex;align-items:center;gap:.4rem}
.upd-txt{font-size:.65rem;color:var(--t3)}
.ibtn{width:36px;height:36px;border-radius:8px;background:var(--sur);border:1px solid var(--bdr);color:var(--t2);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ibtn:hover{border-color:var(--gld);color:var(--gld);background:var(--gldg)}
.ibtn:disabled{opacity:.45;cursor:not-allowed}
.ibtn.spinning i{animation:spin .6s linear infinite}

/* ── TABS ── */
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr)}
.tab{flex:1;padding:.7rem .8rem;text-align:center;cursor:pointer;font-size:.88rem;color:var(--t2);border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.3rem;user-select:none}
.tab.on{color:var(--gld);border-bottom-color:var(--gld);background:rgba(212,168,0,.05)}
.tab:hover:not(.on){color:var(--t1)}
.tab-cnt{font-size:.65rem;color:var(--t3)}

/* ── VIEW BAR ── */
.vbar{display:flex;padding:.55rem .8rem;gap:.4rem;background:var(--bg2)}
.vbtn{padding:.35rem .95rem;border-radius:20px;cursor:pointer;font-size:.84rem;font-weight:600;border:1px solid var(--bdr);background:var(--sur);color:var(--t2);transition:all .2s;display:flex;align-items:center;gap:.28rem;user-select:none}
.vbtn.on-tonight{background:rgba(212,168,0,.12);border-color:var(--gld);color:var(--gld)}
.vbtn.on-morning{background:rgba(129,140,248,.12);border-color:var(--ind);color:var(--ind)}
.vbtn.on-history{background:rgba(75,85,99,.12);border-color:var(--t3);color:#9CA3AF}

/* ── SEARCH ── */
.srow{display:flex;gap:.4rem;padding:.5rem .8rem;background:var(--bg2);flex-wrap:wrap;align-items:center}
.swrap{flex:1;min-width:180px;position:relative}
.swrap .ti-search{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.88rem;pointer-events:none}
.sinp{width:100%;padding:.44rem .7rem .44rem 2.1rem;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;color:var(--t1);font-size:.86rem;font-family:inherit;outline:none;transition:border-color .2s}
.sinp::placeholder{color:var(--t3)}.sinp:focus{border-color:var(--gld)}
.dinp{padding:.44rem .7rem;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;color:var(--t1);font-size:.86rem;font-family:inherit;outline:none;cursor:pointer}
/* ── 樓層快選 ── */
.fbar{display:flex;gap:.35rem;padding:0 .8rem .55rem;background:var(--bg2);flex-wrap:wrap;align-items:center}
.fbar .flbl{color:var(--t3);font-size:.78rem;display:flex;align-items:center;gap:.25rem;margin-right:.1rem}
.fbtn{padding:.3rem .72rem;border-radius:16px;cursor:pointer;font-size:.82rem;font-weight:700;border:1px solid var(--bdr);background:var(--sur);color:var(--t2);transition:all .15s;user-select:none;flex-shrink:0}
.fbtn:active{transform:scale(.95)}
.fbtn.on{background:rgba(212,168,0,.14);border-color:var(--gld);color:var(--gld)}
/* 非樓層分類（行政課等）用靛藍區分 */
.fbtn-cat{border-color:rgba(129,140,248,.4);color:#A5B4FC}
.fbtn-cat.on{background:rgba(129,140,248,.16);border-color:var(--ind);color:var(--ind)}
.dinp:focus{border-color:var(--gld)}

/* ── STATS ── */
.stats{padding:.4rem .9rem;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-bottom:1px solid var(--bdr)}
.stats-lf{display:flex;flex-direction:column;gap:.1rem}
.scnt{font-size:.76rem;color:var(--t2)}.scnt em{color:var(--gld);font-weight:700;font-size:.92rem;font-style:normal}
.slbl{font-size:.65rem;color:var(--t3)}
.spreview{font-size:.68rem;color:var(--wrn);display:flex;align-items:center;gap:.2rem;margin-top:.05rem}
.spreview i{font-size:.68rem}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.65rem;padding:.75rem}
@media(max-width:520px){.grid{grid-template-columns:1fr;padding:.45rem;gap:.45rem}}

/* ── CARD ── */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:.85rem;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.card::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--ca,transparent)}
.card:hover{border-color:rgba(212,168,0,.2);box-shadow:0 4px 18px rgba(0,0,0,.32)}
.c-tn{--ca:var(--gld)}.c-mo{--ca:var(--ind)}.c-hi{--ca:var(--t3)}.c-hw{--ca:var(--wrn)}
.chead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.52rem;gap:.35rem}
.cdate-lbl{font-size:.78rem;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:.22rem;flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid var(--bdr);padding:.08rem .4rem;border-radius:5px}
.cdate-lbl i{font-size:.72rem;color:var(--t3)}
.cbdgs{display:flex;gap:.22rem;flex-wrap:wrap;justify-content:flex-end;flex:1}
.bdg{font-size:.74rem;padding:.1rem .42rem;border-radius:4px;font-weight:600}
.b-un{background:rgba(255,255,255,.05);color:var(--t2);border:1px solid var(--bdr)}
.b-fw{background:rgba(251,146,60,.11);color:var(--wrn);border:1px solid rgba(251,146,60,.24)}
.b-ov{background:rgba(251,146,60,.1);color:var(--wrn);border:1px solid rgba(251,146,60,.25)}
.b-day{background:rgba(129,140,248,.11);color:var(--ind);border:1px solid rgba(129,140,248,.26)}
/* 晚上8點後，20:00前進場的今晚舊資料弱化顯示，凸顯20:00~24:00的夜班進場 */
.card-day-dim{opacity:.62}
.card-day-dim::before{background:var(--ind)!important}
.cvendor{font-size:1.08rem;font-weight:700;color:var(--t1);margin-bottom:.3rem;line-height:1.35}
/* 施工地點 圖標改紅色 */
.cloc{display:flex;align-items:center;gap:.26rem;font-size:1rem;font-weight:600;color:var(--red);margin-bottom:.42rem}
.cloc i{font-size:1rem;color:var(--red)}
.cdiv{height:1px;background:var(--bdr);margin:.4rem 0}
.crow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem}
.ctime{display:flex;align-items:center;gap:.22rem;background:rgba(212,168,0,.07);border:1px solid rgba(212,168,0,.17);border-radius:6px;padding:.3rem .5rem;font-size:.98rem;font-weight:600;color:var(--gld3);flex-shrink:0}
.ctime i{font-size:.92rem}
/* 時間爛資料：整段標紅警示，主管一眼抓到要修的格子 */
.ctime.bad{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.45);color:#F87171}
.twarn{font-size:.82rem;font-weight:700;letter-spacing:.02em}
.cinfo{display:flex;align-items:center;gap:.24rem;font-size:.9rem;color:var(--t2)}
.cinfo i{font-size:.88rem;color:var(--t3)}.cinfo strong{color:var(--t1)}
.cwork{display:flex;align-items:flex-start;gap:.28rem;padding:.26rem .44rem;background:rgba(255,255,255,.025);border-radius:6px;font-size:.94rem;color:var(--t2);margin-top:.3rem}
.cwork i{font-size:.92rem;color:var(--t3);margin-top:1px;flex-shrink:0}
.cfire{display:flex;align-items:center;gap:.28rem;margin-top:.3rem;padding:.26rem .44rem;background:rgba(251,146,60,.07);border:1px solid rgba(251,146,60,.18);border-radius:6px;font-size:.9rem;color:var(--wrn)}
.cfire i{font-size:.9rem}
.cnote{margin-top:.28rem;padding:.24rem .44rem;background:rgba(59,130,246,.06);border-left:2px solid rgba(59,130,246,.3);font-size:.9rem;color:var(--t2);line-height:1.5}

/* 報到換證按鈕 */
.cbtn-checkin{width:100%;margin-top:.6rem;padding:.85rem .5rem;min-height:48px;border-radius:8px;background:rgba(212,168,0,.07);border:1px solid rgba(212,168,0,.22);color:var(--gld3);font-size:.98rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.32rem;letter-spacing:.03em}
.cbtn-checkin:hover:not(:disabled){background:rgba(212,168,0,.16);border-color:var(--gld);color:var(--gld)}
.cbtn-checkin:disabled{opacity:.65;cursor:not-allowed}
.cbtn-checkin.done{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35);color:#4ADE80;cursor:default}
.cbtn-checkin.fail{background:rgba(229,62,62,.1);border-color:rgba(229,62,62,.3);color:#F87171}

/* ── STATUS ── */
.stctr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;gap:.7rem;text-align:center}
.spinner{width:36px;height:36px;border:2px solid rgba(212,168,0,.18);border-top-color:var(--gld);border-radius:50%;animation:spin .8s linear infinite}
.st-ico{font-size:2.2rem;color:var(--t3)}.st-h{font-size:.96rem;color:var(--t2)}.st-p{font-size:.78rem;color:var(--t3);max-width:260px;line-height:1.5}
.errbox{margin:.8rem;padding:.85rem;border-radius:8px;background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.25);color:#F87171;font-size:.84rem;display:flex;gap:.45rem;align-items:flex-start}
.errbox i{font-size:.96rem;flex-shrink:0;margin-top:2px}
.errbox strong{display:block;margin-bottom:.2rem;font-size:.88rem}
.errbox small{opacity:.75;font-size:.76rem;line-height:1.5}

/* ── TOAST ── */
.twrap{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:.38rem;pointer-events:none;align-items:center}
.toast{padding:.48rem 1.1rem;border-radius:8px;font-size:.82rem;font-weight:500;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:tup .25s ease}
.t-ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.32);color:#4ADE80}
.t-err{background:rgba(229,62,62,.12);border:1px solid rgba(229,62,62,.32);color:#F87171}
.t-inf{background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.32);color:var(--ind)}
@keyframes tup{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.footer{padding:.9rem 1rem;text-align:center;font-size:.6rem;color:var(--t3);letter-spacing:.13em;border-top:1px solid var(--bdr);margin-top:.5rem}
</style>
</head>

function fetchSheetJsonp(name){
  return new Promise(function(resolve, reject){
    var tid = setTimeout(function(){
      reject(new Error('連線逾時（20秒），請確認網路與試算表權限'));
    }, 20000);

          if(resp.errors && resp.errors[0]){
            msg = resp.errors[0].detailed_message || resp.errors[0].message || msg;
          }
          reject(new Error(msg)); return;
        }
        resolve(parseGvizTable(resp.table));
      } catch(e){ reject(e); }
    };
    var s = document.createElement('script');
    // 加防快取參數：報到換證後重讀要拿到最新 O 欄，避免 gviz 快取回舊值造成誤報「未生效」
    s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
            '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(name) +
            '&_=' + Date.now();
    s.onerror = function(){
      clearTimeout(tid);
      reject(new Error('Script 載入失敗：請確認網路連線與試算表公開設定'));
    };

    s.onload = function(){ try{ document.head.removeChild(s); }catch(e){} };
  });
}

/* ══════════════════════════════════════════
   解析 gviz table
══════════════════════════════════════════ */
function parseGvizTable(table){
  var cols = table.cols || [];
  var lbls = cols.map(function(c,i){ return c.label || c.id || ('col'+i); });
  return (table.rows || [])
    .filter(function(row){
      return row && row.c && row.c.some(function(c){ return c && c.v != null; });
    })
    .map(function(row){
      var obj = {};
      lbls.forEach(function(lbl,i){
        var cell = row.c && row.c[i];
        if(!cell || cell.v == null){ obj[lbl]=null; return; }
        var v = cell.v;
        if(typeof v === 'string' && v.indexOf('Date(') === 0){
          var m = v.match(/Date\((\d+),(\d+),(\d+)\)/);
          obj[lbl] = m ? new Date(+m[1], +m[2], +m[3]) : null;
        } else if(cols[i] && cols[i].type === 'number'){
          obj[lbl] = v;
        } else {
          var f = cell.f;
          obj[lbl] = (f != null && typeof f === 'string' && /[^\d,]/.test(f)) ? f : v;
        }
      });
      // 報到換證狀態：直接讀取 O 欄（索引14，第15欄）原始值，不依賴標題名稱
      // 重整頁面後仍可依此判斷此筆是否已完成報到換證
      var ocell = row.c && row.c[14];
      var oval = (ocell && ocell.v != null) ? String(ocell.v).trim() : '';
      obj['__checkin'] = (oval && oval.toLowerCase() !== 'null') ? oval : '';
      return obj;
    });
}

/* ══════════════════════════════════════════
   去重：來源表常有同一張常態性施工單被重複登錄的列
   （同廠商/地點/項目/監工，但時間、日期、人數常有變異或爛資料 4230800）
   故以「穩定身份鍵 = 廠商+地點+施工項目+監工」判定重複，相同只留一筆
══════════════════════════════════════════ */
function dedupeKey(r){
  return ['廠商專櫃名稱','施工地點','施工項目','監工']
    .map(function(k){ return String(r[k]==null?'':r[k]).trim(); })
    .join('|');
}
// 進場時間是否為正常值（非爛資料）：用既有 fmtT/isBadTime 判定
function hasGoodInTime(r){
  var t=fmtT(r['進場時間輸入']);
  return t!=='--' && !isBadTime(t);
}
// 重複時要不要用新的這筆 r 取代已保留的 keep（優先序：報到仍有效 > 進場時間正常 > 先到）
function preferOver(r, keep){
  var rAct=isCheckinActive(r), kAct=isCheckinActive(keep);
  if(rAct!==kAct) return rAct;                 // ① 目前報到仍有效者優先（不藏進行中的報到）
  return hasGoodInTime(r) && !hasGoodInTime(keep); // ② 進場時間正常者優先
}

/* ══════════════════════════════════════════
   報到換證：改為「每天」制
   O 欄存報到的日期時間（非永久「已報到換證」字面值）
   前端據此判定：現在是否仍在這次施工時段內，過退場時間/隔天 → 回未報到
══════════════════════════════════════════ */
// 解析 O 欄報到值 → Date（失敗回 null）。相容 gviz 日期物件與文字時間戳；舊「已報到換證」字面值 → null
function parseCheckinTime(v){
  if(v==null) return null;
  var s=String(v).trim();
  if(!s || s.toLowerCase()==='null') return null;
  var m=s.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
  if(m) return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  var d=new Date(s.replace(' ','T'));       // "2026-06-28 19:30" → 可解析
  return isNaN(d.getTime()) ? null : d;
}
// 報到是否仍在有效時段內（沿用早班/晚班跨夜邏輯）
function isCheckinActive(rec){
  if(!rec) return false;
  var tc=parseCheckinTime(rec['__checkin']);
  if(!tc) return false;
  var out=toInt(rec['退場時間輸入']);
  var end;
  if(out>=0 && out<3000){
    var addDay=0, hh, mm;
    if(out>=2400){ addDay=1; hh=Math.floor((out-2400)/100); mm=(out-2400)%100; }
    else { hh=Math.floor(out/100); mm=out%100; }
    end=new Date(tc.getFullYear(),tc.getMonth(),tc.getDate()+addDay,hh,mm,0);
    if(end<=tc) end=new Date(end.getTime()+86400000);  // 退場早於報到 → 跨夜，順延一天
  } else {
    end=new Date(tc.getTime()+86400000);     // 退場時間缺漏/爛資料 → 退而求其次：有效 24 小時
  }
  return new Date()<=end;
}
// 產生報到時間戳（與 GAS 寫入格式一致），供樂觀更新本地狀態用
function nowStamp(){
  var n=new Date(), p=function(x){ return (x<10?'0':'')+x; };
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+' '+p(n.getHours())+':'+p(n.getMinutes());
}
function dedupeRows(rows){
  var seen={}, out=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i], key=dedupeKey(r);
    if(seen[key]==null){
      seen[key]=out.length;
      out.push(r);
    } else if(preferOver(r, out[seen[key]])){
      out[seen[key]]=r;                         // ③ 否則保留先到的那筆
    }
  }
  return out;
}

/* ══════════════════════════════════════════
   時間工具
══════════════════════════════════════════ */
function toInt(v){
  if(v==null) return -1;
  var n = parseInt(String(v).replace(/[^0-9]/g,''));
  return isNaN(n) ? -1 : n;
}
// 晚上8點後，今晚頁籤把「20:00~24:00(含跨夜)進場」排到「20:00前進場」上面
function isEveningSplitActive(view){
  if(view!=='tonight') return false;
  var now=new Date();
  return (now.getHours()*100+now.getMinutes())>=2000;
}
function isNightEntry(rec){
  return toInt(rec['進場時間輸入'])>=2000;
}
function fmtT(v){
  if(v==null||v==='') return '--';
  var s = String(v).trim();
  if(!s||s==='null') return '--';
  if(/[\/\n]/.test(s)) return s.replace(/\n/g,' ');
  if(/[\u4e00-\u9fff]/.test(s)) return s;
  var n = parseInt(s.replace(/[^0-9]/g,''));
  if(isNaN(n)) return s;
  var h=Math.floor(n/100), m=n%100;
  // 允許跨夜寫法 24:00~29:59（夜班到凌晨）；HH≥30 或 MM≥60 視為爛資料，原樣回傳供標記
  if(h>29||m>59) return s;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
// 判定 fmtT 結果是否為「非正常時間」（爛資料）：非「--」且不是 HH:MM 格式
function isBadTime(s){ return s!=='--' && !/^\d{1,2}:\d{2}$/.test(s); }
function d0(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function sameDay(a,b){
  return a instanceof Date && b instanceof Date &&
    a.getFullYear()===b.getFullYear() &&
    a.getMonth()===b.getMonth() &&
    a.getDate()===b.getDate();
}
function fmtD(d){ return d instanceof Date?(d.getMonth()+1)+'/'+d.getDate():null; }
function getTodayStr(){
  var n=new Date();
  return n.getFullYear()+'-'+(n.getMonth()+1<10?'0':'')+(n.getMonth()+1)+'-'+(n.getDate()<10?'0':'')+n.getDate();
}

/* ══════════════════════════════════════════
   過濾 + 排序
   今天 (tonight)：全天所有今日施工記錄
   明天 (morning)：明日記錄 + 今日通宵退場
   歷史 (history)：預設顯示近三日；有搜尋/日期則全量
══════════════════════════════════════════ */
function filterRows(rows, view, search, histDate){
  var today = d0(new Date());
  var tmr   = new Date(today); tmr.setDate(tmr.getDate()+1);
  var res;

  // 施工區間 [施工日期, 退場日期]：無退場日期視為單日，退場早於施工則修正為單日
  function jobRange(r){
    var sd=r['施工日期'];
    if(!(sd instanceof Date)) return null;
    var s=d0(sd), xd=r['退場日期'];
    var e=(xd instanceof Date)?d0(xd):s;
    if(e<s) e=s;
    return {s:s, e:e};
  }

  if(view==='tonight'){
    // 今天：今天落在施工區間內（跨多天施工如 6/1~6/30，6/15 當天也會顯示）
    res = rows.filter(function(r){
      var g=jobRange(r);
      return g && g.s<=today && today<=g.e;
    });
  } else if(view==='morning'){
    // 明天：明天落在施工區間內（涵蓋跨夜、跨多天）；退場日期缺漏時用通宵 fallback
    res = rows.filter(function(r){
      var g=jobRange(r); if(!g) return false;
      if(g.s<=tmr && tmr<=g.e) return true;
      var ei=toInt(r['進場時間輸入']), xi=toInt(r['退場時間輸入']);
      return sameDay(g.s,today) && ei>=1700 && xi>=0 && xi<1200;
    });
  } else {
    // 歷史：施工已結束（退場日期 < today）；進行中的跨日施工歸「今天」不留歷史
    res = rows.filter(function(r){
      var g=jobRange(r);
      return !g || g.e<today;
    });
    if(histDate){
      // 日期篩選：指定日
      var pts=histDate.split('-').map(Number);
      var fd=new Date(pts[0],pts[1]-1,pts[2]);
      res=res.filter(function(r){
        return r['施工日期'] instanceof Date && sameDay(d0(r['施工日期']),fd);
      });
    } else if(!search.trim()){
      // 無搜尋 + 無日期：只顯示近三日（昨、前、大前）
      var d3=new Date(today); d3.setDate(d3.getDate()-3);
      res=res.filter(function(r){
        var d=r['施工日期'];
        return d instanceof Date && d0(d)>=d3 && d0(d)<today;
      });
    }
    // 有搜尋文字：全量歷史中搜尋（不限日期）
  }

  if(search.trim()){
    var q=search.trim().toLowerCase();
    res=res.filter(function(r){
      return Object.values(r).some(function(v){
        return v && String(v).toLowerCase().indexOf(q)>=0;
      });
    });
  }

  var eveningSplit=isEveningSplitActive(view);
  return res.slice().sort(function(a,b){
    var da=a['施工日期'] instanceof Date?a['施工日期']:new Date(0);
    var db=b['施工日期'] instanceof Date?b['施工日期']:new Date(0);
    var dd=view==='history'?db-da:da-db;
    if(dd!==0) return dd;
    if(eveningSplit){
      var ga=isNightEntry(a)?0:1, gb=isNightEntry(b)?0:1;
      if(ga!==gb) return ga-gb;
    }
    return toInt(a['進場時間輸入'])-toInt(b['進場時間輸入']);
  });
}

/* ══════════════════════════════════════════
   HTML 生成
══════════════════════════════════════════ */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 監工姓名顯示遮蔽（陳小明→陳X明），僅用於畫面顯示，不影響搜尋/去重/帶入等原始資料
function maskName(s){
  s = String(s||'').trim();
  if(!s || s==='--') return s;
  var len = s.length;
  if(len<=1) return s;
  if(len===2) return s[0]+'X';
  if(len===3) return s[0]+'X'+s[2];
  return s[0]+'X'.repeat(len-2)+s[len-1];
}

function cardHtml(rec, view, isHot, idx){
  var today=d0(new Date());
  var cls='card '+(isHot?'c-hw':view==='tonight'?'c-tn':view==='morning'?'c-mo':'c-hi');
  // 晚上8點後，今晚頁籤把20:00前進場的舊資料用灰階弱化，20:00~24:00(含跨夜)進場維持原色凸顯
  var eveningDim = !isHot && isEveningSplitActive(view) && !isNightEntry(rec);
  if(eveningDim) cls+=' card-day-dim';

  var unit=rec['申請單位']||'', vendor=rec['廠商專櫃名稱']||'';
  var loc=rec['施工地點']||'--', work=rec['施工項目']||'--';
  var ei=fmtT(rec['進場時間輸入']), xi=fmtT(rec['退場時間輸入']);
  var timeBad = isBadTime(ei) || isBadTime(xi);  // 有爛時間就整段標紅提醒
  var ppl=rec['人數'], sv=rec['監工']||'--', svMasked=maskName(sv);
  var sd=rec['施工日期'], xd=rec['退場日期'], note=rec['備註']||'';

  var dateTag='';
  if(sd instanceof Date){
    dateTag=(xd instanceof Date&&!sameDay(d0(sd),d0(xd)))
      ?(fmtD(sd)+' ～ '+fmtD(xd)) : fmtD(sd);
  }
  var isOvernight=view==='morning'&&sd instanceof Date&&sameDay(d0(sd),today)&&toInt(rec['進場時間輸入'])>=1700;

  // badges（移除日期badge，日期改至左上）
  var bdgs='';
  if(isOvernight) bdgs+='<span class="bdg b-ov"><i class="ti ti-moon"></i> 通宵退場</span>';
  if(eveningDim) bdgs+='<span class="bdg b-day"><i class="ti ti-sun"></i> 日間已進場</span>';
  if(unit) bdgs+='<span class="bdg b-un">'+esc(unit)+'</span>';
  if(isHot) bdgs+='<span class="bdg b-fw"><i class="ti ti-flame"></i> 動火</span>';

  var extra='';
  // 施工單不再顯示備註欄（過去被上傳工具塞入分頁名，純雜訊）；動火維持顯示使用器具
  if(isHot&&note) extra='<div class="cfire"><i class="ti ti-flame"></i>使用器具：'+esc(note)+'</div>';

  // 日期左上角（取代原本 ID）
  var dateLbl=dateTag
    ?'<span class="cdate-lbl"><i class="ti ti-calendar"></i>'+esc(dateTag)+'</span>'
    :'<span></span>';

  // 報到換證按鈕：每天制——僅在這次施工時段內顯示「已報到換證」，過退場時間/隔天自動回「報到換證」
  var isDone = isCheckinActive(rec);
  var checkinBtn = isDone
    ? '<button class="cbtn-checkin done" id="cbtn-'+idx+'" onclick="checkIn('+idx+','+isHot+')">'
      +'<i class="ti ti-circle-check"></i>已報到換證</button>'
    : '<button class="cbtn-checkin" id="cbtn-'+idx+'" onclick="checkIn('+idx+','+isHot+')">'
      +'<i class="ti ti-badge-check"></i>報到換證</button>';

  return '<div class="'+cls+'">'
    +'<div class="chead">'
      +dateLbl
      +'<div class="cbdgs">'+bdgs+'</div>'
    +'</div>'
    +'<div class="cvendor">'+esc(vendor||unit||'未知廠商')+'</div>'
    +'<div class="cloc"><i class="ti ti-map-pin"></i>'+esc(loc)+'</div>'
    +'<div class="cdiv"></div>'
    +'<div class="crow">'
      +'<div class="ctime'+(timeBad?' bad':'')+'"><i class="ti '+(timeBad?'ti-alert-triangle':'ti-clock')+'"></i>'+esc(ei)+' → '+esc(xi)+(timeBad?' <span class="twarn">時間待確認</span>':'')+'</div>'
      +'<div class="cinfo"><i class="ti ti-users"></i><strong>'+esc(ppl!=null?ppl:'--')+'</strong> 人</div>'
      +'<div class="cinfo"><i class="ti ti-user-check"></i>'+esc(svMasked)+'</div>'
    +'</div>'
    +'<div class="cwork"><i class="ti ti-tool"></i><span>'+esc(work)+'</span></div>'
    +extra
    +checkinBtn
    +'</div>';
}

/* ══════════════════════════════════════════
   樓層快選：從施工地點/申請單位抽出樓層（B1F、1F、5F…），免打字篩選
══════════════════════════════════════════ */
// 抽出一筆記錄涉及的樓層（可多個，如「5F、6F、7F」），正規化為 B1F/1F/5F…
function extractFloors(rec){
  var txt = String(rec['施工地點']||'')+' '+String(rec['申請單位']||'');
  var out = [], seen = {};
  var m = txt.match(/B?\d{1,2}\s*(?:F|樓)/gi) || [];
  m.forEach(function(s){
    var f = s.toUpperCase().replace(/\s+/g,'').replace(/樓/,'F');
    if(!seen[f]){ seen[f]=1; out.push(f); }
  });
  return out;
}
// 樓層排序鍵：B 層在前（B1F→-1、B2F→-2），地上層升冪（1F→1…）
function floorSortKey(f){
  var n = parseInt(f.replace(/\D/g,''));
  if(isNaN(n)) return 999;
  return /^B/i.test(f) ? -n : n;
}
// 一個字串本身是否就是純樓層（B1F / 1F / 4樓）
function isFloorToken(s){ return /^B?\d{1,2}\s*(?:F|樓)$/i.test(String(s||'').trim()); }
// 一筆記錄的快選標籤：樓層（含多樓層）＋ 申請單位若非純樓層（如「行政課」）也當分類
function cardTags(rec){
  var tags = extractFloors(rec);
  var unit = String(rec['申請單位']||'').trim();
  if(unit && !isFloorToken(unit) && tags.indexOf(unit)<0) tags.push(unit);
  return tags;
}
// 彙整一批記錄的標籤：樓層用 floorSortKey 排前面，非樓層分類接後面（出現序）
function tagList(rows){
  var seen = {}, floors = [], cats = [];
  rows.forEach(function(r){
    cardTags(r).forEach(function(t){
      if(seen[t]) return;
      seen[t]=1;
      (isFloorToken(t) ? floors : cats).push(t);
    });
  });
  floors.sort(function(a,b){ return floorSortKey(a)-floorSortKey(b); });
  return floors.concat(cats);
}
// 渲染快選按鈕列（樓層金色、非樓層分類靛藍）
function renderFloorBar(tags){
  var fbar = document.getElementById('fbar');
  if(!tags.length){ fbar.style.display='none'; fbar.innerHTML=''; return; }
  fbar.style.display='flex';
  var html = '<span class="flbl"><i class="ti ti-building"></i>樓層／單位</span>'
    + '<button class="fbtn'+(S.floor===''?' on':'')+'" onclick="clickFloor(\'\')">全部</button>';
  tags.forEach(function(t){
    var cat = isFloorToken(t) ? '' : ' fbtn-cat';
    html += '<button class="fbtn'+cat+(S.floor===t?' on':'')+'" onclick="clickFloor(\''+t.replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';
  });
  fbar.innerHTML = html;
}
function clickFloor(f){
  S.floor = (S.floor===f ? '' : f);   // 再點同一個 = 取消
  render();
}

/* ══════════════════════════════════════════
   渲染
══════════════════════════════════════════ */
function render(){
  var rows   = S.tab==='con'?S.data.con:S.data.hot;
  var curErr = S.tab==='con'?S.errors.con:S.errors.hot;
  var isHot  = S.tab==='hot';
  var filteredNoFloor = filterRows(rows, S.view, S.search, S.histDate);
  var filtered = S.floor
    ? filteredNoFloor.filter(function(r){ return cardTags(r).indexOf(S.floor)>=0; })
    : filteredNoFloor;

  // 儲存當前過濾結果供 checkIn 使用
  window._cards = filtered;
  window._cardsIsHot = isHot;

  var content=document.getElementById('content');
  var stats  =document.getElementById('stats');
  var sinp   =document.getElementById('sinp');
  var dinp   =document.getElementById('dinp');
  var preview=document.getElementById('stats-preview');

  sinp.placeholder = S.view==='tonight'?'搜尋今天記錄…（廠商、地點、監工）':
                     S.view==='morning'?'搜尋明天記錄…':'搜尋歷史記錄…';
  dinp.style.display = S.view==='history'?'':'none';
  dinp.max = getTodayStr();

  if(S.loading){
    stats.style.display='none';
    document.getElementById('fbar').style.display='none';
    content.innerHTML='<div class="stctr"><div class="spinner"></div><span style="color:var(--t2);font-size:.88rem">讀取 Google Sheets 中…</span></div>';
    return;
  }
  if(curErr){
    stats.style.display='none';
    document.getElementById('fbar').style.display='none';
    content.innerHTML='<div class="errbox"><i class="ti ti-alert-circle"></i><div>'
      +'<strong>'+esc(curErr)+'</strong>'
      +'<small>試算表右上角 → 共用 → 一般存取 → 知道連結的人 · 檢視者</small>'
      +'</div></div>';
    return;
  }

  // 快選按鈕（樓層＋非樓層分類）：依目前 view+搜尋結果動態產生（0 筆的不出現）
  renderFloorBar(tagList(filteredNoFloor));

  stats.style.display='flex';

  // 歷史模式：stats 顯示總筆數（非預覽筆數）
  if(S.view==='history'){
    var histTotal = rows.filter(function(r){
      var d=r['施工日期'];
      return !(d instanceof Date) || d0(d)<d0(new Date());
    }).length;
    document.getElementById('stats-cnt').innerHTML='共 <em>'+histTotal+'</em> 筆 歷史紀錄';
    // 近三日預覽提示：無搜尋且無日期選擇時顯示
    var isPreview = !S.search.trim() && !S.histDate;
    preview.style.display = isPreview ? '' : 'none';
  } else {
    var vLbl = S.view==='tonight'?' 今天':' 明天';
    document.getElementById('stats-cnt').innerHTML='共 <em>'+filtered.length+'</em> 筆'+vLbl+'記錄';
    preview.style.display = 'none';
  }

  document.getElementById('stats-lbl').textContent=
    (isHot?'動火申請查詢':'施工單查詢')+(S.view==='morning'?' · 含通宵退場':'');

  if(!filtered.length){
    var ico =S.view==='tonight'?'ti-calendar-day':S.view==='morning'?'ti-calendar-week':'ti-archive';
    var ttl =S.view==='tonight'?'今天無施工作業':S.view==='morning'?'明天無施工作業':'查無符合記錄';
    var desc=S.view==='tonight'?'今日尚無進場記錄':
             S.view==='morning'?'今晚無通宵 / 明日無進場記錄':
             (S.search.trim()?'請調整搜尋條件':'近三日無歷史資料');
    content.innerHTML='<div class="stctr"><i class="ti '+ico+' st-ico"></i>'
      +'<div class="st-h">'+ttl+'</div><div class="st-p">'+desc+'</div></div>';
    return;
  }

  var html='<div class="grid">';
  for(var i=0;i<filtered.length;i++) html+=cardHtml(filtered[i], S.view, isHot, i);
  html+='</div>';
  content.innerHTML=html;
}

/* ══════════════════════════════════════════
   報到換證
══════════════════════════════════════════ */
async function checkIn(idx, isHot){
  var rec = window._cards[idx];
  if(!rec){ toast('找不到資料，請重新整理','err'); return; }

  var btn = document.getElementById('cbtn-'+idx);
  if(!btn) return;
  if(btn.classList.contains('done')){ toast('此筆已完成報到換證','inf'); return; }

  if(!GAS_URL){
    toast('⚠ 尚未設定 GAS_URL，請聯絡系統管理員','err');
    return;
  }

  // 送出前防呆：此筆要有可供後端比對的鍵（ID 或 廠商名），否則必定對不到，別送出造成假成功
  var hasId = rec['ID']!=null && String(rec['ID']).trim()!=='' && String(rec['ID']).trim().toLowerCase()!=='null';
  var hasVendor = rec['廠商專櫃名稱'] && String(rec['廠商專櫃名稱']).trim()!=='';
  if(!hasId && !hasVendor){
    toast('✗ 此筆缺少可比對欄位（ID／廠商），無法報到換證','err');
    return;
  }

  var sheetName = isHot ? '動火申請查詢' : '施工單查詢';
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin .6s linear infinite"></i>處理中…';

  var payload = JSON.stringify({
    sheet  : sheetName,
    id     : rec['ID'],
    vendor : rec['廠商專櫃名稱'] || '',
    month  : rec['月'],
    day    : rec['日'],
    inTime : rec['進場時間輸入']
  });

  try {
    // no-cors 送出：回應為 opaque 無法讀取，故送出後改以「重新讀取試算表」實際確認是否真的寫入
    await fetch(GAS_URL, {
      method : 'POST',
      mode   : 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body   : payload
    });
    btn.innerHTML = '<i class="ti ti-loader" style="animation:spin .6s linear infinite"></i>確認中…';
    var ok = await verifyCheckin(rec, sheetName);
    if(ok){
      rec['__checkin'] = nowStamp();     // 同步本地狀態為當下時間戳，使 isCheckinActive 立即生效
      btn.className = 'cbtn-checkin done';
      btn.innerHTML = '<i class="ti ti-circle-check"></i>已報到換證';
      toast('✓ 報到換證完成','ok');
    } else {
      btn.disabled = false;
      btn.className = 'cbtn-checkin fail';
      btn.innerHTML = '<i class="ti ti-badge-check"></i>報到換證';
      setTimeout(function(){ btn.classList.remove('fail'); },2500);
      toast('✗ 報到未生效：試算表查無此筆更新，請重試或確認資料','err');
    }
  } catch(err) {
    btn.disabled = false;
    btn.className = 'cbtn-checkin fail';
    btn.innerHTML = '<i class="ti ti-badge-check"></i>報到換證';
    setTimeout(function(){ btn.classList.remove('fail'); },2500);
    toast('✗ 報到失敗：'+err.message,'err');
  }
}

/* ══════════════════════════════════════════
   報到換證驗證：no-cors 無法讀回應，改重讀分頁確認 O 欄是否真的寫入有效報到時間戳
══════════════════════════════════════════ */
function checkinMatchKey(r){
  // 與 GAS 比對邏輯一致：優先 ID，否則 廠商+月+日+進場時間
  var id = r['ID']!=null ? String(r['ID']).trim() : '';
  if(id && id.toLowerCase()!=='null') return 'id:'+id;
  return 'cb:'+['廠商專櫃名稱','月','日','進場時間輸入'].map(function(k){
    return String(r[k]==null?'':r[k]).trim();
  }).join('|');
}
async function verifyCheckin(rec, sheetName){
  var key = checkinMatchKey(rec);
  // GAS 寫入需時間，最多嘗試兩輪（約 1.3s × 2）
  for(var attempt=0; attempt<2; attempt++){
    await new Promise(function(res){ setTimeout(res, 1300); });
    try {
      var rows = await fetchSheetJsonp(sheetName);
      for(var i=0;i<rows.length;i++){
        if(checkinMatchKey(rows[i])===key){
          // 確認寫入的是「這次、現在有效」的報到時間戳（非舊戳記殘留）
          if(isCheckinActive(rows[i])) return true;
          break; // 找到該筆但尚未寫入 → 再等一輪
        }
      }
    } catch(e){ /* 讀取失敗，下一輪再試 */ }
  }
  return false;
}

/* ══════════════════════════════════════════
   UI 操作
══════════════════════════════════════════ */
function switchTab(t){
  S.tab=t; S.search=''; S.floor=''; document.getElementById('sinp').value='';
  ['con','hot'].forEach(function(x){
    document.getElementById('tab-'+x).classList.toggle('on',x===t);
  });
  render();
}
function switchView(v){
  S.view=v; S.search=''; S.histDate=''; S.floor='';
  document.getElementById('sinp').value='';
  document.getElementById('dinp').value='';
  ['tonight','morning','history'].forEach(function(x){
    document.getElementById('vbtn-'+x).className='vbtn'+(x===v?' on-'+x:'');
  });
  render();
}
function onSearch(v){ S.search=v; render(); }
function onDateChange(v){ S.histDate=v; render(); }

function setSpinning(v){
  S.spinning=v;
  var btn=document.getElementById('btn-refresh');
  btn.classList.toggle('spinning',v);
  btn.disabled=v;
}
function setUpdTime(){
  var n=new Date();
  document.getElementById('upd-txt').textContent=
    (n.getHours()<10?'0':'')+n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes()+' 更新';
}
function updateCounts(){
  document.getElementById('cnt-con').textContent=S.errors.con?'':`(${S.data.con.length})`;
  document.getElementById('cnt-hot').textContent=S.errors.hot?'':`(${S.data.hot.length})`;
}

/* ══════════════════════════════════════════
   Toast
══════════════════════════════════════════ */
function toast(msg, type){
  var wrap=document.getElementById('twrap');
  var div=document.createElement('div');
  div.className='toast '+(type==='ok'?'t-ok':type==='err'?'t-err':'t-inf');
  div.textContent=msg;
  wrap.appendChild(div);
  setTimeout(function(){ if(div.parentNode) div.parentNode.removeChild(div); },3500);
}
function showErr(msg){
  S.loading=false; S.errors.con=msg; render();
}

/* ══════════════════════════════════════════
   本機快取（stale-while-revalidate）：
   開工具先顯示上次抓到的資料（秒開），背景同時重新抓最新的悄悄蓋上去，
   避免每次都要等 Google Sheets JSONP 一來一回才看得到東西
══════════════════════════════════════════ */
var WORK_CACHE_KEY = 'tianying_work_cache_v1';
function loadWorkCache(){
  try {
    var c = JSON.parse(localStorage.getItem(WORK_CACHE_KEY) || 'null');
    if(!c || !c.data) return false;
    S.data.con = Array.isArray(c.data.con) ? c.data.con : [];
    S.data.hot = Array.isArray(c.data.hot) ? c.data.hot : [];
    S.errors = {con:null, hot:null};
    S.loading = false;
    return true;
  } catch(e){ return false; }
}
function saveWorkCache(){
  try { localStorage.setItem(WORK_CACHE_KEY, JSON.stringify({data:S.data, savedAt:Date.now()})); }
  catch(e){}
}

/* ══════════════════════════════════════════
   主載入
   silent=true：已有快取資料先上畫面時的背景重新整理，不顯示全頁讀取動畫、
   不彈成功/失敗 toast，悄悄把資料換成最新的就好
══════════════════════════════════════════ */
async function loadAll(silent){
  if(!silent){
    S.loading=true; S.errors={con:null,hot:null};
    document.getElementById('sp-msg').textContent='正在讀取施工資料…';
    render();
  }
  setSpinning(true);
  try {
    if(!silent) document.getElementById('sp-msg').textContent='載入施工單…';
    S.data.con = dedupeRows(await fetchSheetJsonp(SN.con));
  } catch(e){ if(!silent) S.errors.con = e.message; }
  try {
    if(!silent) document.getElementById('sp-msg').textContent='載入動火申請…';
    S.data.hot = dedupeRows(await fetchSheetJsonp(SN.hot));
  } catch(e){ if(!silent) S.errors.hot = e.message; }
  S.loading=false;
  setSpinning(false);
  setUpdTime();
  updateCounts();
  render();
  hideSplash();
  if(!S.errors.con && !S.errors.hot){
    saveWorkCache();
    if(!silent) toast('✓ 載入完成 · 施工單 '+S.data.con.length+' 筆 · 動火 '+S.data.hot.length+' 筆','ok');
  } else if(!silent){
    toast('⚠ 部分資料載入失敗，請確認試算表已公開分享','err');
  }
}

/* ══════════════════════════════════════════
   權限檢查（正職/兼職 施工單查詢個別白名單，防止直接貼網址繞過首頁卡片鎖）
══════════════════════════════════════════ */
function getSessionUser(){
  try { return JSON.parse(localStorage.getItem('hsh_session_user') || 'null'); } catch(e){ return null; }
}

function showNoPerm(msg){
  clearTimeout(fallback);
  var sp = document.getElementById('splash');
  if(sp) sp.classList.add('out');
  var app = document.getElementById('app');
  if(app) app.style.display = 'none';
  var div = document.createElement('div');
  div.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:9998';
  div.innerHTML = '<div class="errbox" style="max-width:360px"><i class="ti ti-lock"></i><div>'+msg+'</div></div>';
  document.body.appendChild(div);
}

async function checkWorkPermission(){
  var u = getSessionUser();
  if(!u || !u.empId){
    showNoPerm('請從天鷹保全 App 登入後開啟本工具');
    return false;
  }
  var openRoles = ['leader','vicecaptain','captain','executive','admin'];
  if(openRoles.indexOf(u.role) > -1) return true;
  if(u.role !== 'fulltime' && u.role !== 'parttime') return true; // 非既定角色不受此白名單規則影響
  var allowed = null;
  try {
    var raw = localStorage.getItem('tianying_work_allowed_ids');
    allowed = raw ? JSON.parse(raw) : null;
  } catch(e){ allowed = null; }
  try {
    var res = await fetch(ACCOUNT_GAS_URL + '?action=getSettings');
    var d = await res.json();
    if(d && Array.isArray(d.workAllowedIds)){
      allowed = d.workAllowedIds;
      try { localStorage.setItem('tianying_work_allowed_ids', JSON.stringify(allowed)); } catch(e){}
    }
  } catch(e){ /* 拿不到最新值，退回本機快取 */ }
  if(allowed === null) return true; // 未設定＝不限制（正職/兼職全員可用，現狀）
  if(allowed.indexOf(u.empId) > -1) return true;
  showNoPerm('目前尚無使用權限，請洽管理員開通');
  return false;
}

/* 啟動：有快取先上畫面秒開，背景悄悄重新整理；沒快取才走原本的全頁讀取動畫 */
checkWorkPermission().then(function(ok){
  if(!ok) return;
  var hadCache = loadWorkCache();
  if(hadCache){
    hideSplash();
    updateCounts();
    setUpdTime();
    render();
  }
  loadAll(hadCache);
});
</script>
