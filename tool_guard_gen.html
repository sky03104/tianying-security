<!-- ExcelJS：產生 xlsx 用。原本用 SheetJS，但它的免費版不支援「寫入」框線/對齊/自動換行
     這類儲存格樣式（只能讀），2026-07-20 咖哩比對真實範本截圖才發現下載的檔案完全沒格式，
     實測確認 ExcelJS 免費版就能正確寫入這些樣式，換掉。 -->

<style>
:root{
  --bg:#0A0C10; --surface:#0D0F14; --card:rgba(255,255,255,.03);
  --border:rgba(255,255,255,.08); --gold:#D4A800; --gold2:#FFD700;
  --indigo:#818CF8; --indigo2:#6366F1;
  --success:#4ADE80; --danger:#F87171; --warn:#FB923C; --text:#F5F5F5; --text-muted:#8A95A8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh;}
.container{max-width:960px;margin:0 auto;padding:16px 14px 60px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:13px 16px;border-radius:10px;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:14px;min-height:44px;}
.title-wrap{text-align:center;flex:1;min-width:200px;}
.title-main{color:var(--gold);font-size:19px;font-weight:700;letter-spacing:1px;}
.title-sub{color:var(--text-muted);font-size:14px;letter-spacing:1px;margin-top:2px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;}
.tab-btn.active{background:linear-gradient(135deg,#D4A800 0%,#FFD700 100%);color:#000;border-color:transparent;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;backdrop-filter:blur(10px);max-width:100%;overflow-x:auto;}
.card-title{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:14px;color:var(--text-muted);}
input[type=date],input[type=text],input[type=number],select{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:15px;outline:none;font-family:inherit;}
/* 2026-08-04：日期選擇的行事曆小圖示在深色背景上預設是深色線條，看不見；color-scheme:dark
   讓瀏覽器把圖示畫成淺色，適配這裡的深色輸入框（只有這個欄位需要，其他input沒有這個圖示問題）。 */
input[type=date]{color-scheme:dark;}
input:focus,select:focus{border-color:var(--gold);}
.chk-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;cursor:pointer;user-select:none;}
.chk-row input{width:18px;height:18px;accent-color:var(--gold);}
.chk-row span{font-size:14px;}
.btn{padding:12px 18px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:linear-gradient(135deg,#D4A800 0%,#FFD700 100%);color:#000;}
.btn-indigo{background:linear-gradient(135deg,#818CF8 0%,#6366F1 100%);color:#fff;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn:disabled{opacity:.45;cursor:default;}
.warn-box{background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.35);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.warn-box .wtitle{color:var(--warn);font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.warn-box li{font-size:12.5px;color:var(--text);line-height:1.7;}
.warn-box.forced{background:rgba(248,113,113,.12);border:2px solid var(--danger);}
.warn-box.forced .wtitle{color:var(--danger);font-size:14px;}
.warn-box.forced li{font-size:13.5px;font-weight:600;}
/* 2026-08-04：白底黑字＋黑框線，原本黑底綠字在手機戶外強光下太不明顯，改列印稿常見的白底樣式。
   特殊哨別（南側門/巡檢增派/停巡增派/泊車增派/見習人員）用紅字標出，跟一般崗位分開一眼看出來。 */
.prev-table{border-collapse:collapse;font-size:14px;white-space:pre-line;min-width:900px;background:#fff;color:#000;}

.prev-table td.swap-dragging{opacity:.9;background:rgba(212,168,0,.28);box-shadow:0 8px 18px rgba(0,0,0,.4);transform:scale(1.08) translateY(-3px);cursor:grabbing;position:relative;z-index:5;}
.prev-table td.swap-target{outline:2px dashed var(--gold2,#F0C040);outline-offset:-2px;background:rgba(212,168,0,.12);}
.swap-hint{font-size:12px;color:var(--text-muted);margin:8px 0 2px;display:flex;align-items:center;gap:6px;}
.prev-list{display:flex;flex-direction:column;gap:6px;}
.prev-item{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid #000;border-radius:10px;padding:12px 14px;font-size:14px;}
.prev-item-label{color:#4B5563;white-space:pre-line;}
.prev-item-val{white-space:pre-line;text-align:right;font-weight:600;color:#000;}
.prev-item-val.special-val{color:#DC2626;}
.emp-list{display:flex;flex-direction:column;gap:6px;}
.emp-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.emp-name{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--gold2);}
.post-group{font-size:14px;color:var(--text-muted);margin:8px 0 4px;}
.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.post-chip{font-size:14px;padding:10px 8px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.25);cursor:pointer;text-align:center;user-select:none;}
.post-chip.on{background:rgba(212,168,0,.25);border-color:var(--gold);color:var(--gold2);}
.priority-editor{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px;padding:8px 10px;background:rgba(129,140,248,.06);border:1px solid rgba(129,140,248,.25);border-radius:8px;}
.priority-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);}
.priority-input{width:64px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:14px;text-align:center;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:50px;font-weight:700;z-index:9999;display:none;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14px;}
.toast.show{display:flex;}
.toast.ok{background:rgba(20,35,25,.97);color:var(--success);border:1px solid rgba(74,222,128,.5);}
.toast.err{background:rgba(40,18,18,.97);color:var(--danger);border:1px solid rgba(248,113,113,.5);}

.scroll-fab-group{position:fixed;right:16px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:500;}
.scroll-fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:linear-gradient(135deg,#D4A800 0%,#FFD700 100%);color:#000;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;}
@media (max-width:640px){ .container{padding:12px 8px 50px;} }

<body>
<div id="root"></div>
<script>
const { useState, useEffect, useMemo } = React;
const h = React.createElement;

/* ══════════════════════ 基礎：工號狀態 ══════════════════════ */
const params = new URLSearchParams(window.location.search);
let EMP_ID = params.get('empId') || '';
if (!EMP_ID) { try { EMP_ID = (JSON.parse(localStorage.getItem('hsh_session_user') || '{}').empId) || ''; } catch (e) {} }
if (!EMP_ID) EMP_ID = '未登入';
function backUrl(){ return 'index.html?empId=' + encodeURIComponent(EMP_ID); }

/* ══════════════════════ GAS 連線設定 ══════════════════════ */
// 部署後把 /exec 網址填在這裡（見 哨表產生_GAS_部署說明.md）
const GUARD_GEN_GAS_URL = 'https://script.google.com/macros/s/AKfycbzGCuMUEksvU88-WdoJ6DhJ0zOkQi8zC7x7zXIfVOvLW0dOs7s9bCW1sCF1Ij2rGDr63Q/exec';
// 哨表上傳走既有「哨表上傳_GAS_v6.gs」，沿用 tool_upload.html 已部署好的網址
const GD_UPLOAD_GAS_URL = 'https://script.google.com/macros/s/AKfycbwl9hcbbuKBHWmleftzbbaiUihhsHVK4H0dKMd-LrCQwRE3aUPpIHlwWLcGZbhqugp_gg/exec';

async function callGuardGas(action, data) {
  try {
    const res = await fetch(GUARD_GEN_GAS_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action, empId: EMP_ID }, data || {}))
    });
    const txt = await res.text();
    try { return JSON.parse(txt); } catch (e) { return { status: 'error', msg: '回應格式錯誤：' + txt.slice(0, 120) }; }
  } catch (e) {
    return { status: 'error', msg: '連線失敗：' + e.message };
  }
}

/* ══════════════════════ 哨點定義（單一資料源）══════════════════════
   POST_DEFS 同時負責「標籤文字」與「姓名值要寫入的位置」，是唯一的版型座標定義。
   規律：label 永遠寫在 col-1（同一列往左一欄），value 寫在 col。
   buildBaseRows() 迴圈這份定義產生固定標籤；buildGuardMatrix() 迴圈它做隨機分配。
   conditional 的項目（目前只有南側門）標籤不進 buildBaseRows，改成勾選當天才動態補上。
   MERGE_RANGES（見下方 xlsx 匯出段落）是「合併儲存格範圍」，跟這裡的 row/col 定位用途不同，
   純粹是視覺上的儲存格合併，不需要跟 POST_DEFS 同步，但改版型時兩邊都要對照確認。
════════════════════════════════════════════════════════════════════ */
const POST_DEFS = [
  { key: '警衛室',       label: '警衛室',           row: 3,  col: 2,  shift: 'early' },
  // H2 收哨時間 2026-08-08 由咖哩確認為 2230（原本寫 2330 是錯的）。請款附表也是以 11:00-22:30＝11.5 小時計。
  { key: '漢來飯店',     label: '漢來\n飯店',       row: 4,  col: 2,  shift: 'early', forcedCodes: { 'H': '1100-2200', 'H2': '1100-2230' } },
  { key: 'P3車道',       label: 'P3\n車道',         row: 6,  col: 2,  shift: 'early' },
  // 南側門固定 11:00-23:00，跟崗位走（不是照人的早班08:00~20:00算），2026-08-14咖哩確認實際哨時。
  { key: '南側門',       label: '南側門',           row: 7,  col: 2,  shift: 'early', conditional: 'southGate', forcedCode: '南', time: '1100-2300' },
  { key: 'B1F警衛室',    label: 'B1F\n警衛室',      row: 3,  col: 5,  shift: 'early' },
  { key: '機動人員1',    label: '機動\n人員1',      row: 4,  col: 5,  shift: 'early' },
  { key: '物流車道',     label: '物流\n車道',       row: 6,  col: 5,  shift: 'early' },
  { key: '機動人員2',    label: '機動\n人員2',      row: 7,  col: 5,  shift: 'early' },
  { key: '晚班警衛室',   label: '警衛室',           row: 3,  col: 9,  shift: 'late' },
  { key: '晚班B1F警衛室',label: 'B1F\n警衛室',      row: 6,  col: 9,  shift: 'late' },
  { key: '晚班P3車道',   label: 'P3車道\n(廣場哨)', row: 7,  col: 9,  shift: 'late' },
  { key: '晚班漢來飯店', label: '漢來\n飯店',       row: 3,  col: 12, shift: 'late', linked: '漢來飯店' }, // 早/晚班漢來飯店是同一人跨時段駐守，不獨立抽人，見 buildGuardMatrix
  { key: '晚班機動人員', label: '機動\n人員',       row: 6,  col: 12, shift: 'late' },
  // 海底撈固定 22:00-10:00，跟崗位走（不是照人的晚班20:00~08:00算），2026-08-14咖哩確認實際哨時。
  { key: '海底撈',       label: '海底撈',           row: 7,  col: 12, shift: 'late', forcedCode: '海', time: '2200-1000' },
  { key: '巡檢1',        label: '巡檢1',            row: 10, col: 2,  shift: 'early' },
  { key: '巡檢2',        label: '巡檢2',            row: 11, col: 2,  shift: 'early' },
  { key: '巡檢3',        label: '巡檢3',            row: 12, col: 2,  shift: 'early' },
  { key: '停巡4',        label: '停巡4',            row: 13, col: 2,  shift: 'early' },
  { key: '停巡5',        label: '停巡5',            row: 14, col: 2,  shift: 'early' },
  { key: '停巡6',        label: '停巡6',            row: 15, col: 2,  shift: 'early' },
  { key: '停巡7',        label: '停巡7\n(廣場哨)',  row: 16, col: 2,  shift: 'early' },
  { key: '晚班巡檢1',    label: '巡檢1',            row: 10, col: 9,  shift: 'late' },
  { key: '晚班巡檢2',    label: '巡檢2',            row: 11, col: 9,  shift: 'late' },
  { key: '晚班巡檢3',    label: '巡檢3',            row: 12, col: 9,  shift: 'late' },
  { key: '晚班停巡4',    label: '停巡4',            row: 13, col: 9,  shift: 'late' },
  { key: '晚班停巡5',    label: '停巡5',            row: 14, col: 9,  shift: 'late' },
  { key: '晚班停巡6',    label: '停巡6',            row: 15, col: 9,  shift: 'late' },
];
const POST_KEYS = POST_DEFS.map(p => p.key);
// 帶班幹部不是隨機分配的崗位（不進 POST_DEFS），只是「哨點設定」裡的資格標籤，
// 用來過濾「產生哨表」畫面的帶班幹部下拉選單選項。
const LEADER_KEYS = { early: '早班帶班幹部', late: '晚班帶班幹部' };
const POST_GROUPS = [
  { label: '早班一般崗位', keys: ['警衛室', '漢來飯店', 'P3車道', '南側門'] },
  { label: '早班特殊崗位', keys: ['B1F警衛室', '機動人員1', '物流車道', '機動人員2'] },
  { label: '早班巡檢/停巡', keys: ['巡檢1', '巡檢2', '巡檢3', '停巡4', '停巡5', '停巡6', '停巡7'] },
  // 晚班漢來飯店不在這裡：跟早班漢來飯店是同一人（linked），不獨立設定資格
  { label: '晚班崗位', keys: ['晚班警衛室', '晚班B1F警衛室', '晚班P3車道', '晚班機動人員', '海底撈'] },
  { label: '晚班巡檢/停巡', keys: ['晚班巡檢1', '晚班巡檢2', '晚班巡檢3', '晚班停巡4', '晚班停巡5', '晚班停巡6'] },
  { label: '帶班幹部（產生哨表時下拉選單用）', keys: [LEADER_KEYS.early, LEADER_KEYS.late] },
];
const WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];

/* ══════════════════════ 哨點設定資料格式：'key' 或 'key|優先序數字'（數字越小越優先）══════════════════════
   儲存與傳輸格式不變（逗號分隔字串），只是每個項目多了可選的 |數字 後綴，GAS端完全不需要改，
   對它來說仍然是不透明字串。
════════════════════════════════════════════════════════════════════ */
function parsePostEntry(s) {
  const i = s.indexOf('|');
  if (i === -1) return { key: s, priority: null };
  const p = parseInt(s.slice(i + 1), 10);
  return { key: s.slice(0, i), priority: isNaN(p) ? null : p };
}
function hasQual(list, key) {
  return (list || []).some(s => parsePostEntry(s).key === key);
}
function priorityFor(list, key) {
  const e = (list || []).map(parsePostEntry).find(e => e.key === key);
  return e ? e.priority : null;
}
const DEFAULT_TIME = { early: '0800-2000', late: '2000-0800' };
// S班（0800-1600）月班表代號本身就代表實際上班時段跟一般早班08:00~20:00不同，
// 2026-07-20咖哩用真實資料抓到：李怡蒨是S班卻被寫成0800-2000。
// 目前只處理S這一種代號覆寫，其他代號（如有）之後遇到再加。
const CODE_TIME_OVERRIDE = { 'S': '0800-1600' };
function timeForPerson(person, shift) {
  return (person && CODE_TIME_OVERRIDE[person.code]) || DEFAULT_TIME[shift];
}

/* ══════════════════════ 18×14 固定文字標籤（每次產生都先寫入，動態內容之後再覆蓋值格）══════════════════════ */
function buildBaseRows() {
  const rows = [];
  for (let r = 0; r < 18; r++) rows.push(new Array(14).fill(''));
  rows[1][0] = '                   姓名\n  哨位';
  rows[1][2] = '早班人員:   08:00~20:00';
  rows[1][8] = '晚班人員:  20:00~08:00';
  rows[2][2] = ' 帶隊幹部 : ';
  rows[2][8] = '帶隊幹部 : ';
  rows[3][0] = '外圍';
  rows[10][0] = '巡檢';
  // 崗位標籤全部改由 POST_DEFS 驅動（label 永遠寫在 col-1），conditional 的哨位（南側門）不在這裡寫，
  // 等勾選當天才在 buildGuardMatrix() 動態補上，維持單一資料源。
  POST_DEFS.forEach(def => {
    if (def.conditional) return;
    rows[def.row][def.col - 1] = def.label;
  });
  rows[17][1] = '13人/12HR+8HR(0800-1600)\n增派12HR(1100-2300)+8HR(1200-2000)';
  rows[17][8] = '11人/12HR+8HR(2200-0600)\n               增派4HR(0600-1000)';
  return rows;
}

/* ══════════════════════ 核心：18×14 值陣列產生邏輯（純函式，不碰 DOM，可獨立測試） ══════════════════════ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildGuardMatrix(opts) {
  const { year, month, day, weekdayIdx, earlyRoster, lateRoster, postConfig,
    southGate, patrolExtra, parkExtra, stopPatrolExtra, parkNames,
    manualExtraPosts, leaderEarly, leaderLate } = opts;
  const rows = buildBaseRows();
  const warnings = [];
  const forcedWarnings = [];

  rows[0][0] = String(year - 1911) + '年';
  rows[0][3] = String(month);
  rows[0][4] = '月'; // 原本漏寫，2026-07-20咖哩比對真實範本才發現E1「月」跟G1「日 星期」不見了
  rows[0][5] = String(day);
  rows[0][6] = '日  星期';
  rows[0][7] = WEEKDAY_ZH[weekdayIdx] || '';
  rows[0][8] = '天鷹保全駐漢神巨蛋商場、外圍每日執勤人員名單';

  // 帶隊幹部（下拉選單挑人，但選單只依哨點設定資格列人，沒對照當天月班表——
  // 這裡補查：選定的人當天若不在早/晚班在職名單裡，還是照填，但要跳出強制警告，
  // 不能讓幹部誤選到當天沒上班的人卻毫無提示）
  if (leaderEarly) {
    const leaderEarlyPerson = earlyRoster.find(p => p.name === leaderEarly);
    rows[2][4] = leaderEarly + '\n' + timeForPerson(leaderEarlyPerson, 'early');
    if (!leaderEarlyPerson) {
      forcedWarnings.push('早班帶隊幹部「' + leaderEarly + '」當天不在早班在職名單裡，請確認是否選錯人');
    }
  }
  if (leaderLate) {
    const leaderLatePerson = lateRoster.find(p => p.name === leaderLate);
    rows[2][11] = leaderLate + '\n' + timeForPerson(leaderLatePerson, 'late');
    if (!leaderLatePerson) {
      forcedWarnings.push('晚班帶隊幹部「' + leaderLate + '」當天不在晚班在職名單裡，請確認是否選錯人');
    }
  }

  // ── 拆分早班：見習 / L / LN / N / 南（南側門專職）/ H・H2（漢來飯店專職）/ 一般池 ──
  const earlyTrainees = earlyRoster.filter(p => (p.code || '').indexOf('見') >= 0);
  const earlyL = earlyRoster.filter(p => p.code === 'L');
  const earlyLN = earlyRoster.filter(p => p.code === 'LN');
  const earlyN = earlyRoster.filter(p => p.code === 'N');
  const earlySouth = earlyRoster.filter(p => p.code === '南');
  // H/H2代號本身就代表早晚班漢來飯店同一人，兩者互斥（同一天只會有其中一種）。
  // 2026-08-08：原本這裡自己抄一份時間表，結果跟 POST_DEFS 的定義各改各的（H2 一邊 2230 一邊 2330），
  // 改成直接引用 POST_DEFS 的 forcedCodes，時間只有一個地方能改，不會再改漏。
  const HANLAI_CODE_TIME = POST_DEFS.find(d => d.key === '漢來飯店').forcedCodes;
  const earlyHanlai = earlyRoster.filter(p => HANLAI_CODE_TIME[p.code]);
  const earlyExclude = new Set(earlyTrainees.concat(earlyL, earlyLN, earlyN, earlySouth, earlyHanlai).map(p => p.name));
  if (leaderEarly) earlyExclude.add(leaderEarly); // 被排為早班帶班幹部的人，不再進入其他哨點的隨機分配池
  const earlyPoolBase = earlyRoster.filter(p => !earlyExclude.has(p.name));

  // L/LN/N/南 班的人不會被塞回一般崗位池（維持原意圖：他們的工作就是巡檢/停巡增派/南側門），
  // 但沒勾對應 checkbox 時人會無聲消失，所以強制跳出醒目警告點名，不能只靠一般警告清單。
  earlyL.forEach(p => {
    if (!patrolExtra) forcedWarnings.push(p.name + ' 是 L 班，但未勾選「巡檢增派」，此人尚未被排入本次哨表');
  });
  earlyLN.forEach(p => {
    if (!patrolExtra) forcedWarnings.push(p.name + ' 是 LN 班，但未勾選「巡檢增派」，此人的巡檢增派時段尚未排入');
    if (!stopPatrolExtra) forcedWarnings.push(p.name + ' 是 LN 班，但未勾選「停巡增派」，此人的停巡增派時段尚未排入');
  });
  earlyN.forEach(p => {
    if (!stopPatrolExtra) forcedWarnings.push(p.name + ' 是 N 班，但未勾選「停巡增派」，此人尚未被排入本次哨表');
  });
  earlySouth.forEach(p => {
    if (!southGate) forcedWarnings.push(p.name + ' 是「南」班，代表當天要開南側門哨，但你沒有勾選「南側門」，此人尚未被排入本次哨表');
  });

  // ── 拆分晚班：見習 / 海（海底撈專職）/ 一般池 ──
  const lateTrainees = lateRoster.filter(p => (p.code || '').indexOf('見') >= 0);
  const lateSea = lateRoster.filter(p => p.code === '海');
  const lateExclude = new Set(lateTrainees.concat(lateSea).map(p => p.name));
  if (leaderLate) lateExclude.add(leaderLate); // 被排為晚班帶班幹部的人，不再進入其他哨點的隨機分配池
  const latePoolBase = lateRoster.filter(p => !lateExclude.has(p.name));

  // ── 一般崗位／巡檢分配：用二分圖最大匹配（Kuhn's algorithm / augmenting path）──
  // 舊版是「隨機分配，重試5次取分配失敗人數最少的一輪」，實測用真實資料跑30次，
  // 約20%機率會出現「明明人力數學上夠、卻有崗位空著、同時有合格的人沒被排到」
  // （例如某人只適任兩個熱門崗位，剛好都被別人先搶走，他就變孤兒——不是運氣問題，
  // 是隨機重試法本身不保證找得到滿排解法）。改用 augmenting path：只要某崗位選中的
  // 候選人「原本的崗位可以換給別人頂替」，就整條路徑往下遞迴改派，這樣只要人力
  // 數學上足夠涵蓋所有崗位，一定找得到完整解，不會因為隨機順序運氣不好而漏排。
  function assignByMaxMatching(defs, pool) {
    const personMatch = {}; // 姓名 -> 目前分配到的崗位key
    const postMatch = {};   // 崗位key -> 目前分配到的人
    function candidatesFor(def) {
      const cands = pool.filter(p => hasQual(postConfig[p.name], def.key));
      const ranked = shuffle(cands.filter(p => priorityFor(postConfig[p.name], def.key) != null))
        .sort((a, b) => priorityFor(postConfig[a.name], def.key) - priorityFor(postConfig[b.name], def.key));
      const unranked = shuffle(cands.filter(p => priorityFor(postConfig[p.name], def.key) == null));
      return ranked.concat(unranked);
    }
    function tryAssign(def, visited) {
      for (const cand of candidatesFor(def)) {
        if (visited.has(cand.name)) continue;
        visited.add(cand.name);
        const curPostKey = personMatch[cand.name];
        const curDef = curPostKey ? defs.find(d => d.key === curPostKey) : null;
        // 注意：curPostKey 成功改派時，tryAssign(curDef, visited) 內部的遞迴呼叫已經把
        // postMatch[curPostKey] 更新成新的人選了，這裡絕對不能再刪一次，
        // 不然會把遞迴剛設好的新結果整個清掉（這是2026-07-20實測抓到的bug：
        // 明明13個人都配對成功(personMatch有13筆)，postMatch卻只剩5筆，
        // 就是這裡多刪了8次別人已經接手的崗位）。
        if (!curPostKey || tryAssign(curDef, visited)) {
          personMatch[cand.name] = def.key;
          postMatch[def.key] = cand;
          return true;
        }
      }
      return false;
    }
    const failedKeys = [];
    shuffle(defs).forEach(def => {
      if (!tryAssign(def, new Set())) failedKeys.push(def.key);
    });
    const usedNames = new Set(Object.keys(personMatch));
    const leftover = pool.filter(p => !usedNames.has(p.name));
    return { postMatch, failedKeys, leftover };
  }
  const activeEarlyDefs = POST_DEFS.filter(def => def.shift === 'early' && !def.linked
    && !(def.conditional === 'southGate' && !southGate)
    && !(def.forcedCode && earlyRoster.some(p => p.code === def.forcedCode))
    && !(def.forcedCodes && earlyRoster.some(p => def.forcedCodes[p.code])));
  const activeLateDefs = POST_DEFS.filter(def => def.shift === 'late' && !def.linked
    && !(def.forcedCode && lateRoster.some(p => p.code === def.forcedCode))
    && !(def.forcedCodes && lateRoster.some(p => def.forcedCodes[p.code])));
  const earlyResult = assignByMaxMatching(activeEarlyDefs, earlyPoolBase);
  const lateResult = assignByMaxMatching(activeLateDefs, latePoolBase);
  POST_DEFS.forEach(def => {
    if (def.conditional === 'southGate' && !southGate) return;
    if (def.conditional) rows[def.row][def.col - 1] = def.label; // 勾選當天才補上條件式標籤（例如南側門）
    const picked = (def.shift === 'early' ? earlyResult.postMatch : lateResult.postMatch)[def.key];
    if (picked) rows[def.row][def.col] = picked.name + '\n' + (def.time || timeForPerson(picked, def.shift));
  });
  // 找不到人的崗位分兩種講法：today完全沒有任何在職人員適任(哨點設定沒人勾這個崗位，
  // 或勾的人今天都沒上班) vs 有人適任但都被其他崗位卡走了(人力調度衝突，最大匹配演算法
  // 保證只要數學上有解就找得到，所以走到這裡代表真的是總人力不夠，不是演算法沒找到)
  [
    { key: 'early', failedKeys: earlyResult.failedKeys, roster: earlyRoster },
    { key: 'late', failedKeys: lateResult.failedKeys, roster: lateRoster }
  ].forEach(({ failedKeys, roster }) => {
    failedKeys.forEach(defKey => {
      const anyQualifiedToday = roster.some(p => hasQual(postConfig[p.name], defKey));
      if (!anyQualifiedToday) {
        warnings.push('崗位「' + defKey + '」今天沒有任何在職人員適任，需手動安排（哨點設定裡沒有人勾這個崗位，或勾的人今天沒上班）');
      } else {
        warnings.push('崗位「' + defKey + '」有適任人選，但人力調度衝突排不進去（適任的人都被其他崗位排走了），需手動調整');
      }
    });
  });
  const earlyPool = earlyResult.leftover, latePool = lateResult.leftover;
  if (earlyPool.length) warnings.push('早班有排班但未分配到崗位：' + earlyPool.map(p => p.name).join('、'));
  if (latePool.length) warnings.push('晚班有排班但未分配到崗位：' + latePool.map(p => p.name).join('、'));

  // ── 漢來飯店 H/H2 代號：直接指定同一人早晚班都是他，時間用實際班別時段
  // （不是通用早/晚班預設時間），優先於下面的一般 linked 連動邏輯 ──
  const hanlaiForced = earlyHanlai[0]; // 同一天只會有一位（H/H2互斥），多位算異常資料
  if (earlyHanlai.length > 1) {
    forcedWarnings.push('月班表代號 H/H2（漢來飯店）當天有不只一人：' + earlyHanlai.map(p => p.name).join('、') + '，僅自動帶入「' + hanlaiForced.name + '」，其餘的人（' + earlyHanlai.slice(1).map(p => p.name).join('、') + '）尚未被排入本次哨表，請確認');
  }
  if (hanlaiForced) {
    const t = HANLAI_CODE_TIME[hanlaiForced.code];
    if (hanlaiForced.name === leaderEarly || hanlaiForced.name === leaderLate) {
      forcedWarnings.push(hanlaiForced.name + ' 月班表代號是漢來飯店（H/H2），但同天又被選為帶隊幹部，兩邊都已填入同一人，請確認是否有人力衝突');
    }
    rows[4][2] = hanlaiForced.name + '\n' + t;
    rows[3][12] = hanlaiForced.name + '\n' + t;
  }

  // ── linked 崗位：跟來源崗位是同一人跨時段駐守，直接沿用來源的分配結果，不獨立抽人 ──
  POST_DEFS.filter(d => d.linked).forEach(def => {
    if (def.linked === '漢來飯店' && hanlaiForced) return; // 已經用 H/H2 代號直接指定，不用這裡的一般連動邏輯
    const picked = earlyResult.postMatch[def.linked];
    if (!picked) { warnings.push('「' + def.key + '」跟「' + def.linked + '」是同一人，但早班尚未分配到人，需手動確認'); return; }
    if (!lateRoster.some(p => p.name === picked.name)) {
      warnings.push('「' + def.key + '」應與早班「' + def.linked + '」（' + picked.name + '）同一人，但他當天沒有晚班排班紀錄，需手動確認');
      return;
    }
    rows[def.row][def.col] = picked.name + '\n' + DEFAULT_TIME.late;
  });

  // ── forcedCode 崗位：月班表代號直接指定專職（南=南側門、海=海底撈），優先於一般隨機分配 ──
  POST_DEFS.filter(d => d.forcedCode).forEach(def => {
    const roster = def.shift === 'early' ? earlyRoster : lateRoster;
    const matches = roster.filter(p => p.code === def.forcedCode);
    if (!matches.length) return; // 沒人代號吻合，維持最大匹配已經算好的一般隨機分配結果
    if (def.conditional === 'southGate' && !southGate) return; // 沒勾選，forcedWarnings 已經點名，這裡不寫入
    if (def.conditional) rows[def.row][def.col - 1] = def.label;
    if (matches.length > 1) warnings.push('「' + def.key + '」代號吻合（' + def.forcedCode + '班）的候選不只一位：' + matches.map(p => p.name).join('、') + '，僅自動帶入第一位，請確認');
    const leaderName = def.shift === 'early' ? leaderEarly : leaderLate;
    if (matches[0].name === leaderName) {
      forcedWarnings.push(matches[0].name + ' 月班表代號是「' + def.forcedCode + '」，但同天又被選為帶隊幹部，兩邊都已填入同一人，請確認是否有人力衝突');
    }
    rows[def.row][def.col] = matches[0].name + '\n' + (def.time || DEFAULT_TIME[def.shift]);
  });

  // ── 巡檢增派（早班 L/LN） ──
  if (patrolExtra) {
    const cands = earlyL.concat(earlyLN);
    rows[10][4] = '巡檢增派';
    if (cands.length > 1) warnings.push('巡檢增派候選（L/LN班）不只一位：' + cands.map(p => p.name).join('、') + '，僅自動帶入第一位，請確認');
    if (cands.length) rows[10][5] = cands[0].name + '\n1200-2000';
    else warnings.push('找不到 L/LN 班人員，巡檢增派需手動填寫');
  }

  // ── 停巡增派（早班 LN 或 N） ──
  if (stopPatrolExtra) {
    const stopCands = earlyLN.concat(earlyN);
    rows[13][4] = '停巡增派';
    if (stopCands.length > 1) warnings.push('停巡增派候選（LN/N班）不只一位：' + stopCands.map(p => p.name).join('、') + '，僅自動帶入第一位，請確認');
    if (stopCands.length) rows[13][5] = stopCands[0].name + '\n2000-2400';
    else warnings.push('找不到 LN/N 班人員，停巡增派需手動填寫');
  }

  // ── 泊車增派（手動輸入2人，固定 1230-2030） ──
  if (parkExtra) {
    rows[11][4] = '泊車增派';
    rows[12][4] = '泊車增派';
    if (parkNames[0]) rows[11][5] = parkNames[0] + '\n1230-2030';
    if (parkNames[1]) rows[12][5] = parkNames[1] + '\n1230-2030';
    if (!parkNames[0] || !parkNames[1]) warnings.push('泊車增派姓名尚未填寫完整（需2位）');
  }

  // ── 增派時數註記：先佔位，一定要寫在「手動增派哨點」迴圈之前——不然南側門/巡檢/泊車/
  //    停巡任一勾選時，這裡會直接覆蓋掉迴圈剛寫進第16列的哨點姓名（2026-08-04健檢抓到）。
  if (southGate || patrolExtra || parkExtra || stopPatrolExtra) {
    rows[16][4] = '←';
    rows[16][5] = '1600-2000為增派時數';
  }

  // ── 手動增派哨點（2026-08-04）：見習人員（早/晚班）＋咖哩用「+」自訂的任意哨點，
  //    都是同一套「手動勾選+填姓名」模式，統一用這個迴圈找 11~16 列的空白列寫入，
  //    必須寫在 placeTrainees() 呼叫之前，讓自動遞補的見習跳過這些列；也必須寫在
  //    上面「增派時數註記」之後，讓 while 迴圈看到第16列已被註記佔用而跳過。
  (manualExtraPosts || []).forEach(mp => {
    let r = 11;
    while (r <= 16 && rows[r][4] !== '') r++;
    if (r <= 16) {
      rows[r][4] = mp.label;
      if (mp.name) rows[r][5] = mp.name + '\n' + mp.time;
      else warnings.push(mp.label + '姓名尚未填寫');
    } else {
      warnings.push(mp.label + '：11~16列已滿，需手動處理');
    }
  });

  // ── 見習：早/晚班共用同一套「找第一個空白列」邏輯（跳過已被泊車/停巡增派佔用的列） ──
  function placeTrainees(trainees, labelCol, nameCol, shiftLabel, timeStr) {
    let r = 11;
    trainees.forEach(p => {
      while (r <= 16 && rows[r][labelCol] !== '') r++;
      if (r > 16) { warnings.push(shiftLabel + '見習「' + p.name + '」超出可用欄位（11~16列已滿），需手動處理'); return; }
      rows[r][labelCol] = '見習';
      rows[r][nameCol] = p.name + '\n' + timeStr;
      r++;
    });
  }

  placeTrainees(lateTrainees, 11, 12, '晚班', DEFAULT_TIME.late);

  return { rows, warnings, forcedWarnings };
}

function buildMergeGrid() {
  const anchors = {}; // 'r,c' -> { rowSpan, colSpan }
  const covered = new Set(); // 'r,c'，會跳過渲染的格子（不含anchor本身）
  MERGE_RANGES.forEach(rangeStr => {
    const [a, b] = rangeStr.split(':');
    const s = decodeCell(a), e = decodeCell(b);
    anchors[s.r + ',' + s.c] = { rowSpan: e.r - s.r + 1, colSpan: e.c - s.c + 1 };
    for (let r = s.r; r <= e.r; r++) {
      for (let c = s.c; c <= e.c; c++) {
        if (r === s.r && c === s.c) continue;
        covered.add(r + ',' + c);
      }
    }
  });
  return { anchors, covered };
}

// 不支援「寫」框線/對齊/自動換行，2026-07-20咖哩比對真實範本截圖才發現下載的檔案完全
// 沒格式，實測確認換成 ExcelJS 免費版就能正確寫入這些樣式）。
// 全部儲存格套細框線＋置中對齊（含垂直置中）＋內容有\n的自動換行；少數儲存格照咖哩
// 跟真實範本逐格比對後的結果覆寫成靠右/靠左對齊，第1列(標題日期列)只留下框線。
const RIGHT_ALIGN_CELLS = ['D1', 'F1', 'A1', 'C3', 'I3']; // 月、日、115年、帶隊幹部標籤(早)、帶隊幹部標籤(晚)
const LEFT_ALIGN_CELLS = ['I1', 'E3', 'L3']; // 標題文字、早班帶隊幹部值、晚班帶隊幹部值

/* ══════════════════════ xlsx 人名格下拉選單（2026-08-10） ══════════════════════
   咖哩要求：下載的哨表每個人名格都能用下拉選單換人，早班格子只列早班人員、晚班只列晚班。
   ⚠️ 人名格的值不是純姓名，是「姓名\n時段」（例如 王小明\n0800-2000），所以下拉選項也
   必須是整串「姓名\n時段」——只給姓名的話，選完人時段會不見，版面就毀了。
   時段分兩種，決定下拉選項要配什麼時間：
   ①「跟人走」(perPerson)——一般崗位與帶隊幹部。時段由本人的月班表代號決定
     （S 班是 0800-1600，其餘照班別預設），所以選項要逐人算 timeForPerson()。
     ⚠️ 不能拿「格子現在的值」當崗位時段：某崗位這次剛好排到 S 班的人，那格就會是
     0800-1600，若照抄下去，整個下拉的每個人都會變成 0800-1600（2026-08-10 測到）。
   ②「跟崗位走」——增派/見習區與漢來飯店(forcedCodes)。時段是那個哨位本身的
     （巡檢增派 1200-2000、泊車 1230-2030、漢來 1100-2200…），換誰上都一樣。 */
function nameCellTime(v, shift) {
  const s = String(v == null ? '' : v);
  const i = s.indexOf('\n');
  return i >= 0 ? s.slice(i + 1) : DEFAULT_TIME[shift];
}
// 找出所有「該放人名」的格子，連同它屬早班還是晚班、時段跟人走還是跟崗位走
function buildNameCellPlan(rows) {
  const plan = [];
  const add = (r, c, shift, perPerson) => plan.push({
    r: r, c: c, shift: shift, perPerson: !!perPerson, time: nameCellTime(rows[r][c], shift)
  });
  // 固定崗位：標籤沒寫出來的（例如當天沒勾南側門）代表這個哨位不存在，不給下拉
  POST_DEFS.forEach(def => {
    // 跟崗位走的判斷：forcedCodes(漢來)或有自己固定time(南側門/海底撈)都不是「跟人走」，
    // 換誰上時段都一樣，下拉才不會照本人月班表代號重算出錯的時段。
    if (String(rows[def.row][def.col - 1] || '') !== '') add(def.row, def.col, def.shift, !def.forcedCodes && !def.time);
  });
  add(2, 4, 'early', true);  // 早班帶隊幹部
  add(2, 11, 'late', true);  // 晚班帶隊幹部
  // 增派／見習區（第11~17列）：label 欄有字才是真的哨位；'←' 那列是增派時數註記不是人名
  [{ labelCol: 4, nameCol: 5, shift: 'early' }, { labelCol: 11, nameCol: 12, shift: 'late' }].forEach(function (z) {
    for (let r = 10; r <= 16; r++) {
      const label = String(rows[r][z.labelCol] || '');
      if (label !== '' && label !== '←') add(r, z.nameCol, z.shift, false);
    }
  });
  return plan;
}
// 1->A。隱藏表欄數＝不同時段數（實務上個位數），還是寫成支援兩位字母以免哪天時段變多
function colLetter(n) {
  let s = '';
  while (n > 0) { s = String.fromCharCode(65 + (n - 1) % 26) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function applyNameDropdowns(wb, ws, rows, rosters) {
  const roster = { early: (rosters && rosters.early) || [], late: (rosters && rosters.late) || [] };
  if (!roster.early.length && !roster.late.length) return; // 沒名單就整個跳過，維持加這功能之前的行為
  const plan = buildNameCellPlan(rows);
  const listWs = wb.addWorksheet('名單', { state: 'hidden' }); // 隱藏而非 veryHidden，咖哩想自己看/改也取消隱藏得了
  // 分組鍵：跟人走的格子全部共用一欄（'early|*'），跟崗位走的則一個時段一欄
  const groupKey = p => p.shift + '|' + (p.perPerson ? '*' : p.time);
  const colOf = {}; // 分組鍵 -> 隱藏表欄號
  plan.forEach(function (p) {
    const key = groupKey(p);
    if (colOf[key] || !roster[p.shift].length) return;
    const col = Object.keys(colOf).length + 1;
    colOf[key] = col;
    roster[p.shift].forEach(function (person, i) {
      const t = p.perPerson ? timeForPerson(person, p.shift) : p.time;
      listWs.getCell(i + 1, col).value = person.name + '\n' + t;
    });
  });
  plan.forEach(function (p) {
    const col = colOf[groupKey(p)];
    if (!col) return;
    const L = colLetter(col);
    ws.getCell(p.r + 1, p.c + 1).dataValidation = {
      type: 'list',
      allowBlank: true,
      // 不擋非清單值：現場一定會遇到臨時支援、名字不在當天月班表裡的人，
      // 下拉是「幫你少打字」，不是「只准選這些」
      showErrorMessage: false,
      formulae: ["='名單'!$" + L + "$1:$" + L + "$" + roster[p.shift].length]
    };
  });
}

async function downloadXlsx(rows, dateStr, rosters) {
  const wb = new ExcelJS.Workbook();
  // 列印設定直接寫進檔案，咖哩下載後開列印預覽就已經是「橫向＋A4＋縮成一頁」，
  // 不用每天手動重設（2026-08-07：原本沒寫 pageSetup，Excel 會套自己的預設＝直向不縮放）。
  const ws = wb.addWorksheet('哨表', {
    pageSetup: {
      paperSize: 9,               // 9 = A4
      orientation: 'landscape',   // 橫向
      fitToPage: true,            // 啟用「縮放至頁面」
      fitToWidth: 1,              // 寬度壓成 1 頁
      fitToHeight: 1,             // 高度壓成 1 頁
      horizontalCentered: true,   // 水平置中，左右留白平均
      margins: { left: 0.25, right: 0.25, top: 0.35, bottom: 0.35, header: 0, footer: 0 }
    }
  });
  rows.forEach((row, r) => {
    row.forEach((val, c) => { ws.getCell(r + 1, c + 1).value = val; });
  });
  for (let c = 1; c <= 14; c++) ws.getColumn(c).width = 12;
  // 列高 33.75 點（＝45 像素）。2026-08-10 咖哩指定；原本寫 32 點，Excel 會換算成
  // 42 像素再倒回去顯示成 31.5，跟他要的高度差一截。33.75 是 0.75 的整數倍，
  // 換算成像素剛好整數，不會被 Excel 取整成別的值
  for (let r = 1; r <= 18; r++) ws.getRow(r).height = 33.75;
  const thinBorder = { style: 'thin' };
  for (let r = 1; r <= 18; r++) {
    for (let c = 1; c <= 14; c++) {
      const cell = ws.getCell(r, c);
      const addr = String.fromCharCode(64 + c) + r; // 只用在 A~N(14欄以內)，跟對齊清單對照足夠
      const isRight = RIGHT_ALIGN_CELLS.indexOf(addr) >= 0;
      const isLeft = LEFT_ALIGN_CELLS.indexOf(addr) >= 0;
      const hasNewline = typeof cell.value === 'string' && cell.value.indexOf('\n') >= 0;
      // 第1列（標題日期列）只留下框線，其餘列維持四邊細框線
      cell.border = r === 1 ? { bottom: thinBorder } : { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
      cell.alignment = { horizontal: isRight ? 'right' : (isLeft ? 'left' : 'center'), vertical: 'middle', wrapText: hasNewline };
      // 跟真實範本逐格比對：整份是微軟正黑體，第1列(標題日期列)14號字，其餘12號字
      cell.font = { name: '微軟正黑體', size: r === 1 ? 14 : 12 };
    }
  }
  // 合併一定要放在設定樣式「之後」：ExcelJS合併時會讓範圍內的儲存格共用同一個樣式物件，
  // 如果先合併再逐格設定，範圍內後面的格子（例如A1:C1的B1、C1）會把前面（A1）設好的
  // 對齊蓋掉，變成整個合併範圍都套用「最後一格」的樣式，不是anchor那格的樣式
  // （2026-07-20實測抓到：A1本來要靠右對齊，結果被B1/C1的置中設定蓋掉）。
  MERGE_RANGES.forEach(range => ws.mergeCells(range));
  // 下拉選單放在合併之後：人名格都是合併範圍的左上角那格（例如 C4:D4 的 C4），
  // 驗證要掛在那格上；先合併再掛，才不會被合併過程動到
  applyNameDropdowns(wb, ws, rows, rosters);
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '哨表_' + dateStr.replace(/\//g, '') + '.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 2026-08-04：「特殊哨別」（南側門/巡檢增派/停巡增派/泊車增派/見習人員，以及往後用「+」自訂的哨點）
// 畫面上要用紅字標出。改用「位置」判斷而不是寫死標籤字串清單——col4/5(row10~16)這個「增派區」

// 只有自動遞補的「見習」(非「見習人員」)例外不算特殊哨別。這樣往後新增任何自訂哨點都不用再改這裡。
function isSpecialGuardCell(rows, ri, ci) {
  if (ci === 2 && rows[ri][1] === '南側門') return true;
  // 排除「見習」(自動遞補，非特殊哨點) 跟「←」(第16列的「增派時數註記」提示文字，不是哨點)
  if (ci === 5 && ri >= 10 && ri <= 16 && rows[ri][4] && rows[ri][4] !== '見習' && rows[ri][4] !== '←') return true;
  return false;
}

// 18×14 原始表格在手機上要橫滑900px寬才看得完，字又小，改提供逐格清單檢視
function flattenPreview(rows) {
  const items = [];
  items.push({ label: '早班帶隊幹部', value: rows[2][4] });
  items.push({ label: '晚班帶隊幹部', value: rows[2][11] });
  POST_DEFS.forEach(def => { items.push({ label: def.key, value: rows[def.row][def.col], special: def.key === '南側門' }); });
  // 增派區（col4/5）跟見習遞補（col4/5 或 col11/12）共用同一段列範圍，用標籤文字掃描，
  // 涵蓋巡檢增派/停巡增派/泊車增派①②/見習人員（早/晚）/自訂哨點，不用寫死行號。
  for (let r = 10; r <= 16; r++) {
    const earlyLbl = rows[r][4];
    if (earlyLbl === '見習') items.push({ label: '早班見習', value: rows[r][5] });
    else if (earlyLbl && earlyLbl !== '←') items.push({ label: earlyLbl, value: rows[r][5], special: true });
    const lateLbl = rows[r][11];
    if (lateLbl === '見習') items.push({ label: '晚班見習', value: rows[r][12] });
  }
  return items;
}

function PostConfigTab({ postConfig, setPostConfig, employees, loading, onSave, saving, loadError }) {

  if (loading) return h('div', { className: 'empty-note' }, '讀取員工名單中…');
  if (!employees.length) return h('div', { className: 'empty-note' }, '尚未讀到員工名單（來自早/晚班月班表）');
  function toggle(name, key) {
    setPostConfig(prev => {
      const list = prev[name] || [];
      const exists = hasQual(list, key);
      const next = exists ? list.filter(s => parsePostEntry(s).key !== key) : list.concat([key]);
      return Object.assign({}, prev, { [name]: next });
    });
  }
  function setPriority(name, key, val) {
    setPostConfig(prev => {
      const list = prev[name] || [];
      const next = list.map(s => parsePostEntry(s).key === key ? (val ? key + '|' + val : key) : s);
      return Object.assign({}, prev, { [name]: next });

  const filteredEmployees = search.trim() ? employees.filter(n => n.includes(search.trim())) : employees;

function localDateStr(d) {
  // 用本地時間組字串，避免 toISOString()（UTC）在台灣凌晨 0:00~7:59 抓成前一天
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

  // 帶班幹部下拉選單：只列出「哨點設定」裡標記適任早班/晚班帶班的人
  const earlyLeaderOptions = Object.keys(postConfig).filter(n => hasQual(postConfig[n], LEADER_KEYS.early)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  const lateLeaderOptions = Object.keys(postConfig).filter(n => hasQual(postConfig[n], LEADER_KEYS.late)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  const [targetSheet, setTargetSheet] = useState('明日哨表');
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null); // { rows, warnings, forcedWarnings, dateLabel }
  const [toast, setToast] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [previewMode, setPreviewMode] = useState('table'); // 'list'（逐格檢視）｜'table'（完整18×14表格，2026-07-20咖哩要求改為預設）
  const [dragState, setDragState] = useState(null); // { from: {ri,ci}, overKey: 'ri,ci'|null }（按住拖曳互換用）

  function showToast(msg, type) {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2600);
  }

  // ── 表格預覽：按住姓名格拖曳到另一格互換（2026-07-20咖哩要求的手動微調功能）──
  // 只有「姓名\n時段」格式的格子才能拖，標題/標籤格排除，用是否以時段結尾判斷。
  // 用Pointer Events（不是HTML5原生drag-and-drop）是因為原生DnD在手機觸控基本不動作，
  // 天鷹是手機優先的專案，Pointer Events滑鼠/觸控都通用，不用額外加套件。
  function isAssignedCell(cell) {
    return typeof cell === 'string' && /\n\d{4}-\d{4}$/.test(cell);
  }
  function cellKeyFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    const td = el && el.closest ? el.closest('td[data-key]') : null;
    return td ? td.getAttribute('data-key') : null;
  }
  function handleSwapPointerDown(ri, ci, e) {
    e.preventDefault();
    // setPointerCapture：手機長按拖曳時，瀏覽器預設行為是「進入文字選取模式」，
    // 抓住pointer後續的move/up事件固定會回報到這個格子（不受手指實際移到哪個DOM元素影響），
    // 同時也是向瀏覽器表明「這是一個拖曳手勢」，避免被系統的長按選取手勢搶走。
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    setDragState({ from: { ri, ci }, overKey: null });
  }
  function handleSwapPointerMove(e) {
    if (!dragState) return;
    const key = cellKeyFromPoint(e.clientX, e.clientY);
    const valid = key && isAssignedCell(result.rows[Number(key.split(',')[0])][Number(key.split(',')[1])]);
    setDragState(prev => prev && prev.overKey !== (valid ? key : null) ? { ...prev, overKey: valid ? key : null } : prev);
  }
  function handleSwapPointerUp(e) {
    if (!dragState) return;
    const key = cellKeyFromPoint(e.clientX, e.clientY);
    if (key) {
      const [tri, tci] = key.split(',').map(Number);
      const { ri: fri, ci: fci } = dragState.from;
      if ((tri !== fri || tci !== fci) && isAssignedCell(result.rows[tri][tci])) {
        const fromName = result.rows[fri][fci].split('\n')[0];
        const toName = result.rows[tri][tci].split('\n')[0];
        const newRows = result.rows.map(r => r.slice());
        const tmp = newRows[fri][fci];
        newRows[fri][fci] = newRows[tri][tci];
        newRows[tri][tci] = tmp;
        setResult(Object.assign({}, result, { rows: newRows }));
        showToast('已互換：' + fromName + ' ⇄ ' + toName, 'ok');
      }
    }
    setDragState(null);
  }

  async function handleGenerate() {
    setBusy(true);
    setResult(null);
    try {
      const [y, m, d] = dateStr.split('-').map(n => parseInt(n, 10));
      const r = await callGuardGas('getMonthlyRoster', { year: y, month: m, day: d });
      if (r.status !== 'ok') { showToast(r.msg || '讀取月班表失敗', 'err'); setBusy(false); return; }
      const weekdayIdx = new Date(y, m - 1, d).getDay();
      // 2026-08-04：見習人員（早/晚班）＋咖哩自訂的哨點，整理成同一份清單交給 buildGuardMatrix，
      // 之後再新增自訂哨點也不用改這裡的程式碼，跟著 customPostDefs 走就好。
      const manualExtraPosts = [];
      if (traineeExtra) manualExtraPosts.push({ label: '見習人員(早)', name: traineeExtraName.trim(), time: DEFAULT_TIME.early });
      if (traineeExtraNight) manualExtraPosts.push({ label: '見習人員(晚)', name: traineeExtraNightName.trim(), time: '2000-0800' });
      customPostDefs.forEach(p => {
        const st = customPostState[p.id];
        if (st && st.checked) manualExtraPosts.push({ label: p.label, name: ((st.name || '').trim()), time: p.time });
      });
      const { rows, warnings, forcedWarnings } = buildGuardMatrix({
        year: y, month: m, day: d, weekdayIdx,
        earlyRoster: r.data.early || [], lateRoster: r.data.late || [],
        postConfig, southGate, patrolExtra, parkExtra, stopPatrolExtra,
        parkNames, manualExtraPosts, leaderEarly, leaderLate
      });
      const dateLabel = y + '/' + String(m).padStart(2, '0') + '/' + String(d).padStart(2, '0') + ' 星期' + WEEKDAY_ZH[weekdayIdx];
      // rosters 一起存起來：匯出 xlsx 時要拿它產生人名格的下拉選單（早班格列早班人員、晚班列晚班）
      setResult({ rows, warnings, forcedWarnings, dateLabel, year: y, month: m, day: d, weekday: WEEKDAY_ZH[weekdayIdx],
        rosters: { early: r.data.early || [], late: r.data.late || [] } });
      showToast('預覽已產生', 'ok');
    } catch (e) {
      showToast('產生失敗：' + e.message, 'err');
    }
    setBusy(false);
  }

  async function handleExportXlsx() {
    if (!result) return;
    try {
      await downloadXlsx(result.rows, result.dateLabel.split(' ')[0], result.rosters);
      showToast('xlsx 已下載', 'ok');
    } catch (e) {
      showToast('產生xlsx失敗：' + e.message, 'err');
    }
  }

  async function handleUpload() {
    if (!result) return;
    setUploading(true);
    const r = await fetch(GD_UPLOAD_GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'guardUpload', empId: EMP_ID,
        targetSheet, year: result.year, month: result.month, day: result.day, weekday: result.weekday,
        rows: result.rows
      })
    }).then(x => x.json()).catch(e => ({ success: false, error: e.message }));
    setUploading(false);
    if (r.success) showToast('已上傳至「' + targetSheet + '」', 'ok');
    else showToast(r.error || '上傳失敗', 'err');
  }

  return h('div', null,
    toast && h(Toast, toast),
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, h('i', { className: 'ti ti-calendar' }), '日期與增派設定'),
      h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '哨表日期'),
          h('input', { type: 'date', value: dateStr, onChange: e => setDateStr(e.target.value) })),
        h('div', { className: 'field' }, h('label', null, '早班帶隊幹部'),
          h('select', { value: leaderEarly, onChange: e => setLeaderEarly(e.target.value) },
            h('option', { value: '' }, earlyLeaderOptions.length ? '請選擇' : '（哨點設定尚未標記任何人）'),
            earlyLeaderOptions.map(n => h('option', { key: n, value: n }, n)))),
        h('div', { className: 'field' }, h('label', null, '晚班帶隊幹部'),
          h('select', { value: leaderLate, onChange: e => setLeaderLate(e.target.value) },
            h('option', { value: '' }, lateLeaderOptions.length ? '請選擇' : '（哨點設定尚未標記任何人）'),
            lateLeaderOptions.map(n => h('option', { key: n, value: n }, n))))
      ),
      h('div', { className: 'row' },
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: southGate, onChange: e => setSouthGate(e.target.checked) }), h('span', null, '南側門')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: patrolExtra, onChange: e => setPatrolExtra(e.target.checked) }), h('span', null, '巡檢增派')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: parkExtra, onChange: e => setParkExtra(e.target.checked) }), h('span', null, '泊車增派')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: stopPatrolExtra, onChange: e => setStopPatrolExtra(e.target.checked) }), h('span', null, '停巡增派')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: traineeExtra, onChange: e => setTraineeExtra(e.target.checked) }), h('span', null, '見習人員（早班）')),
        h('label', { className: 'chk-row' }, h('input', { type: 'checkbox', checked: traineeExtraNight, onChange: e => setTraineeExtraNight(e.target.checked) }), h('span', null, '見習人員（晚班）')),
        customPostDefs.map(p => h('label', { className: 'chk-row', key: p.id },
          h('input', {
            type: 'checkbox', checked: !!(customPostState[p.id] && customPostState[p.id].checked),
            onChange: () => toggleCustomPost(p.id)
          }),
          h('span', null, p.label + '（' + p.time + '）'),
          h('i', {
            className: 'ti ti-x', style: { marginLeft: '4px', color: 'var(--danger)', cursor: 'pointer' },
            onClick: e => { e.preventDefault(); e.stopPropagation(); removeCustomPost(p.id); }
          })
        )),
        h('button', { className: 'btn btn-ghost', onClick: () => setShowAddCustom(!showAddCustom) },
          h('i', { className: 'ti ti-plus' }), '自訂哨點')
      ),
      showAddCustom && h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '哨點名稱'),
          h('input', { type: 'text', value: newCustomLabel, placeholder: '例如：機動巡邏', onChange: e => setNewCustomLabel(e.target.value) })),
        h('div', { className: 'field' }, h('label', null, '時段（4碼-4碼）'),
          h('input', { type: 'text', value: newCustomTime, placeholder: '例如 1000-1800', onChange: e => setNewCustomTime(e.target.value) })),
        h('button', { className: 'btn btn-primary', onClick: addCustomPost }, h('i', { className: 'ti ti-check' }), '新增')
      ),
      parkExtra && h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '泊車增派人員1'),
          h('input', { type: 'text', value: parkNames[0], placeholder: '姓名', onChange: e => setParkNames([e.target.value, parkNames[1]]) })),
        h('div', { className: 'field' }, h('label', null, '泊車增派人員2'),
          h('input', { type: 'text', value: parkNames[1], placeholder: '姓名', onChange: e => setParkNames([parkNames[0], e.target.value]) }))
      ),
      traineeExtra && h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '見習人員（早班）姓名'),
          h('input', { type: 'text', value: traineeExtraName, placeholder: '姓名', onChange: e => setTraineeExtraName(e.target.value) }))
      ),
      traineeExtraNight && h('div', { className: 'row' },
        h('div', { className: 'field' }, h('label', null, '見習人員（晚班）姓名'),
          h('input', { type: 'text', value: traineeExtraNightName, placeholder: '姓名', onChange: e => setTraineeExtraNightName(e.target.value) }))
      ),
      customPostDefs.filter(p => customPostState[p.id] && customPostState[p.id].checked).map(p => h('div', { className: 'row', key: p.id },
        h('div', { className: 'field' }, h('label', null, p.label + '姓名'),
          h('input', { type: 'text', value: (customPostState[p.id] && customPostState[p.id].name) || '', placeholder: '姓名', onChange: e => setCustomPostName(p.id, e.target.value) }))
      )),
      h('button', { className: 'btn btn-primary', onClick: handleGenerate, disabled: busy },
        h('i', { className: 'ti ti-wand' }), busy ? '產生中…' : '產生預覽')
    ),
    result && h('div', { className: 'card' },
      h('div', { className: 'card-title' }, h('i', { className: 'ti ti-table' }), '預覽：' + result.dateLabel),
      result.forcedWarnings.length > 0 && h('div', { className: 'warn-box forced' },
        h('div', { className: 'wtitle' }, h('i', { className: 'ti ti-alert-octagon' }), '一定要看：漏勾增派（' + result.forcedWarnings.length + '）'),
        h('ul', { style: { margin: 0, paddingLeft: '18px' } }, result.forcedWarnings.map((w, i) => h('li', { key: i }, w)))
      ),
      result.warnings.length > 0 && h('div', { className: 'warn-box' },
        h('div', { className: 'wtitle' }, h('i', { className: 'ti ti-alert-triangle' }), '需要注意（' + result.warnings.length + '）'),
        h('ul', { style: { margin: 0, paddingLeft: '18px' } }, result.warnings.map((w, i) => h('li', { key: i }, w)))
      ),
      h('div', { className: 'row', style: { justifyContent: 'flex-end' } },
        h('button', {
          className: 'btn btn-ghost',
          onClick: () => setPreviewMode(previewMode === 'table' ? 'list' : 'table')
        }, h('i', { className: 'ti ti-switch-horizontal' }), previewMode === 'table' ? '切換逐格檢視' : '切換完整表格')
      ),
      previewMode === 'table'
        ? h('div', null,
            h('div', { className: 'swap-hint' }, h('i', { className: 'ti ti-arrows-move' }), '按住姓名格拖到另一格可互換兩人'),
            h('table', {
              className: 'prev-table',
              onPointerMove: handleSwapPointerMove,
              onPointerUp: handleSwapPointerUp,
              onPointerCancel: () => setDragState(null)
            },
              h('tbody', null, result.rows.map((row, ri) => h('tr', { key: ri },
                row.map((cell, ci) => {
                  if (mergeGrid.covered.has(ri + ',' + ci)) return null; // 被合併範圍蓋住的格子不重複渲染
                  const span = mergeGrid.anchors[ri + ',' + ci];
                  // 跟「產生xlsx」用同一份對齊/框線規則，畫面看到的就是檔案會長的樣子，
                  // 不用每次都下載打開才知道對不對（2026-07-20咖哩要求）
                  const addr = String.fromCharCode(65 + ci) + (ri + 1);
                  const align = RIGHT_ALIGN_CELLS.indexOf(addr) >= 0 ? 'right'
                    : LEFT_ALIGN_CELLS.indexOf(addr) >= 0 ? 'left' : 'center';
                  const style = { textAlign: align };
                  if (ri === 0) { style.borderTop = 'none'; style.borderLeft = 'none'; style.borderRight = 'none'; }
                  const key = ri + ',' + ci;
                  const draggable = isAssignedCell(cell);
                  const isDragging = dragState && dragState.from.ri === ri && dragState.from.ci === ci;
                  const isTarget = dragState && dragState.overKey === key;
                  let cls = cell ? 'has-val' : '';
                  if (cell && isSpecialGuardCell(result.rows, ri, ci)) cls += ' special-val';
                  if (draggable) cls += ' swap-cell';
                  if (isDragging) cls += ' swap-dragging';
                  if (isTarget) cls += ' swap-target';
                  return h('td', {
                    key: ci, className: cls, style, 'data-key': key,
                    rowSpan: span ? span.rowSpan : 1, colSpan: span ? span.colSpan : 1,
                    onPointerDown: draggable ? (e => handleSwapPointerDown(ri, ci, e)) : undefined
                  }, cell);
                })
              )))
            )
          )
        : h('div', { className: 'prev-list' },
            flattenPreview(result.rows).map((it, i) => h('div', { className: 'prev-item', key: i },
              h('span', { className: 'prev-item-label' }, it.label),
              h('span', { className: 'prev-item-val' + (it.value && it.special ? ' special-val' : '') }, it.value || '未排')
            ))
          ),
      h('div', { className: 'row', style: { marginTop: '14px' } },
        h('button', { className: 'btn btn-ghost', onClick: handleExportXlsx }, h('i', { className: 'ti ti-file-spreadsheet' }), '產生 xlsx 下載'),
        h('div', { className: 'field' }, h('label', null, '上傳目標分頁'),
          h('select', { value: targetSheet, onChange: e => setTargetSheet(e.target.value) },
            h('option', { value: '明日哨表' }, '明日哨表'),
            h('option', { value: '今日哨表' }, '今日哨表'))),
        h('button', { className: 'btn btn-indigo', onClick: handleUpload, disabled: uploading },
          h('i', { className: 'ti ti-cloud-upload' }), uploading ? '上傳中…' : '上傳至試算表')
      )
    )
  );
}

function App() {
  const [tab, setTab] = useState('gen');
  const [employees, setEmployees] = useState([]);
  const [postConfig, setPostConfig] = useState({});
  const [loadingCfg, setLoadingCfg] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  function showToast(msg, type) { setToast({ msg, type }); setTimeout(() => setToast(null), 2600); }

  useEffect(() => {
    (async () => {
      setLoadingCfg(true);
      const [namesRes, cfgRes] = await Promise.all([
        callGuardGas('getEmployeeNames', {}),
        callGuardGas('getGuardPostConfig', {})
      ]);
      let ok = true;
      if (namesRes.status === 'ok') setEmployees(namesRes.data || []); else ok = false;
      if (cfgRes.status === 'ok') setPostConfig(cfgRes.data || {}); else ok = false;
      if (!ok) {
        setLoadError(true);
        showToast('讀取員工名單或哨點設定失敗，請重新整理再試（暫時無法儲存，避免把既有設定覆蓋成空的）', 'err');
      }
      setLoadingCfg(false);
    })();
  }, []);

  async function handleSaveConfig() {
    if (loadError) { showToast('資料載入失敗，無法儲存', 'err'); return; }
    setSaving(true);
    const configs = Object.keys(postConfig).map(name => ({ name, posts: postConfig[name] }));
    const r = await callGuardGas('saveGuardPostConfig', { configs });
    setSaving(false);
    showToast(r.status === 'ok' ? '哨點設定已儲存' : (r.msg || '儲存失敗'), r.status === 'ok' ? 'ok' : 'err');
  }

  return h('div', { className: 'container' },
    toast && h(Toast, toast),
    h(ScrollButtons),
    h('div', { className: 'header' },
      h('a', { className: 'back-btn', href: backUrl() }, h('i', { className: 'ti ti-arrow-left' }), '返回主選單'),
      h('div', { className: 'title-wrap' },
        h('div', { className: 'title-main' }, '自動排哨工具'),
        h('div', { className: 'title-sub' }, 'TIANYING SECURITY · GUARD ROSTER')),
      h('div', { style: { width: '90px' } })
    ),
    h('div', { className: 'tabs' },
      h('button', { className: 'tab-btn' + (tab === 'gen' ? ' active' : ''), onClick: () => setTab('gen') }, h('i', { className: 'ti ti-table' }), ' 產生哨表'),
      h('button', { className: 'tab-btn' + (tab === 'cfg' ? ' active' : ''), onClick: () => setTab('cfg') }, h('i', { className: 'ti ti-map-pin' }), ' 哨點設定')
    ),
    tab === 'gen' ? h(GenerateTab, { postConfig }) : h(PostConfigTab, {
      postConfig, setPostConfig, employees, loading: loadingCfg, onSave: handleSaveConfig, saving, loadError
    })
  );
}

ReactDOM.render(h(App), document.getElementById('root'));
</script>
</body>
</html>
