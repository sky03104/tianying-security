<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>天鷹保全｜緊急聯絡清單</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0A0C10;--bg2:#0D0F14;--bg3:#12151C;
  --card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);
  --gold:#D4A800;--gold2:#FFD700;
  --indigo:#6366F1;--indigo2:#818CF8;
  --text:#F5F5F5;--muted:#6B7280;--muted2:#4B5563;
  --green:#4ADE80;--red:#F87171;--warn:#FB923C;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Microsoft JhengHei',sans-serif;min-height:100vh;}
body{padding-bottom:90px;}

@keyframes spin1{to{transform:rotate(360deg);}}
@keyframes spin2{to{transform:rotate(-360deg);}}
@keyframes spin3{to{transform:rotate(180deg);}}
@keyframes eaglePulse{0%,100%{filter:drop-shadow(0 0 8px rgba(212,168,0,.8));}50%{filter:drop-shadow(0 0 20px rgba(212,168,0,1));}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── Header ── */
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}

/* ── LOGO 三層旋轉光環 ── */
.logo-wrap{position:relative;width:48px;height:48px;flex-shrink:0;}
.logo-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;}
.ring1{border-top-color:var(--gold);border-right-color:rgba(212,168,0,.3);animation:spin1 3s linear infinite;}
.ring2{inset:5px;border-bottom-color:var(--gold2);border-left-color:rgba(255,215,0,.4);animation:spin2 2s linear infinite;}
.ring3{inset:10px;border-right-color:var(--gold);border-top-color:rgba(212,168,0,.2);animation:spin3 4s linear infinite;}

/* ── LOGO 中央圖片（明確指定寬高，避免舊瀏覽器圖片爆大） ── */
.logo-img{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:22px;height:22px;
  border-radius:50%;
  object-fit:cover;
  animation:eaglePulse 3s ease-in-out infinite;
}

/* ── 四角金色框 ── */
.logo-wrap::before,.logo-wrap::after,.logo-corner::before,.logo-corner::after{content:'';position:absolute;width:7px;height:7px;border-color:var(--gold);border-style:solid;opacity:.85;}
.logo-wrap::before{top:0;left:0;border-width:1.5px 0 0 1.5px;}
.logo-wrap::after{top:0;right:0;border-width:1.5px 1.5px 0 0;}
.logo-corner{position:absolute;inset:0;pointer-events:none;}
.logo-corner::before{bottom:0;left:0;border-width:0 0 1.5px 1.5px;}
.logo-corner::after{bottom:0;right:0;border-width:0 1.5px 1.5px 0;}

.hdr-info{flex:1;}
/* 「天鷹」金色，「保全」白色 */
.hdr-info h1{font-size:15px;font-weight:900;color:var(--text);}
.hdr-info h1 span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr-sub{font-size:9px;color:var(--muted2);letter-spacing:1.5px;margin-top:1px;}
.hdr-title{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.5px;margin-top:2px;}
.hdr-right{display:flex;gap:7px;align-items:center;}
.role-badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(99,102,241,.18);color:var(--indigo2);border:1px solid rgba(99,102,241,.3);}
.btn-sync{background:rgba(212,168,0,.12);border:1px solid rgba(212,168,0,.3);color:var(--gold);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;}

/* ── 同步面板 ── */
.sync-panel{background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.22);border-radius:10px;margin:10px 16px;padding:14px;animation:fadeIn .2s;}
.sync-panel.hidden{display:none;}
.sync-label{font-size:11px;font-weight:700;color:var(--indigo2);margin-bottom:10px;}
.sync-input{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;color:var(--text);font-size:12px;font-family:inherit;outline:none;margin-bottom:10px;}
.sync-input:focus{border-color:var(--indigo2);}
.sync-btns{display:flex;gap:8px;}
.btn-gold{flex:1;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0A0C10;border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 2px 12px rgba(212,168,0,.3);}
.btn-indigo{flex:1;background:linear-gradient(135deg,var(--indigo),var(--indigo2));color:#fff;border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 2px 12px rgba(99,102,241,.3);}

/* ── 分頁標籤 ── */
.tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--bd);color:var(--muted);background:var(--card);white-space:nowrap;font-family:inherit;transition:all .2s;}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0A0C10;border-color:transparent;box-shadow:0 2px 10px rgba(212,168,0,.35);}

/* ── 搜尋 ── */
.search-wrap{padding:10px 16px 0;}
.search-box{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;transition:border-color .2s;}
.search-box:focus-within{border-color:rgba(212,168,0,.5);}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit;}
.search-box input::placeholder{color:var(--muted);}

/* ── 篩選 chip ── */
.filters{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{padding:4px 13px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bd);color:var(--muted);background:var(--card);white-space:nowrap;font-family:inherit;transition:all .15s;}
.chip.active{border-color:var(--indigo2);color:var(--indigo2);background:rgba(99,102,241,.12);}

/* ── 統計欄 ── */
.stats{display:flex;gap:8px;padding:0 16px 12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;}
.stat-n{font-size:22px;font-weight:900;color:var(--gold);}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── 人員卡片 ── */
.section-label{padding:4px 16px 8px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;}
.cards{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.card:hover{border-color:rgba(212,168,0,.35);}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0;}
.card-name{font-size:15px;font-weight:800;flex:1;}
.role-pill{padding:3px 9px;border-radius:10px;font-size:10px;font-weight:800;}
.card-body{padding:0 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.info-row{display:flex;flex-direction:column;gap:2px;}
.info-row.full{grid-column:1/-1;}
.info-lbl{font-size:10px;color:var(--muted);font-weight:600;}
.info-val{font-size:13px;font-weight:700;}
.info-val a{color:var(--gold2);text-decoration:none;}
.no-ec{opacity:.35;font-style:italic;}
.card-actions{display:flex;gap:7px;padding:0 14px 12px;}
.btn-card-edit{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.1);color:var(--indigo2);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;transition:all .15s;}
.btn-card-edit:hover{background:rgba(99,102,241,.22);}
.btn-card-del{padding:8px 12px;border-radius:8px;border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:var(--red);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .15s;}
.btn-card-del:hover{background:rgba(248,113,113,.2);}

/* ── FAB 新增按鈕 ── */
.fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0A0C10;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(212,168,0,.5);z-index:200;transition:transform .15s;}
.fab:hover{transform:scale(1.08);}

/* ── 編輯 Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:22px 18px 36px;animation:fadeIn .22s;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:16px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.modal-close{background:rgba(255,255,255,.07);border:1px solid var(--bd);color:var(--muted);font-size:16px;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;}
.form-label span{color:var(--red);}
.form-input,.form-select{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
.form-input:focus,.form-select:focus{border-color:var(--gold);}
.form-select option{background:var(--bg2);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.divider{border-top:1px solid var(--bd);margin:16px 0 14px;}
.divider-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:12px;}
.btn-form-submit{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0A0C10;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 3px 16px rgba(212,168,0,.35);margin-top:6px;}
.btn-form-cancel{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--muted);border-radius:10px;padding:12px;font-size:13px;cursor:pointer;font-family:inherit;margin-top:8px;}

/* ── 確認刪除 Modal ── */
.confirm-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;align-items:center;justify-content:center;padding:20px;}
.confirm-bg.open{display:flex;}
.confirm-box{background:var(--bg2);border:1px solid rgba(248,113,113,.35);border-radius:14px;padding:24px 20px;max-width:320px;width:100%;animation:fadeIn .2s;}
.confirm-title{font-size:15px;font-weight:800;color:var(--red);margin-bottom:8px;}
.confirm-msg{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
.confirm-btns{display:flex;gap:10px;}
.btn-confirm-del{flex:1;background:var(--red);color:#fff;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-confirm-cancel{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--muted);border-radius:9px;padding:12px;font-size:13px;cursor:pointer;font-family:inherit;}

/* ── Toast 通知 ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;z-index:999;transition:transform .3s;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.5);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(74,222,128,.5);color:var(--green);}
.toast.err{border-color:rgba(248,113,113,.5);color:var(--red);}

/* ── 空結果 ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty i{font-size:52px;margin-bottom:14px;display:block;opacity:.3;}

/* ── 同步狀態小字 ── */
.sync-status{font-size:10px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;}
.sync-status.ok{color:var(--green);}
.sync-status.err{color:var(--red);}
.sync-status.loading{color:var(--gold);}


.footer{text-align:center;font-size:9px;color:var(--muted2);letter-spacing:1px;padding:18px 0 8px;}
</style>
</head>

/* ── 職務顏色對照 ── */
const RS={
  '隊長':  {bg:'rgba(201,162,39,.2)',  c:'#C9A227', av:'#C9A22722'},
  '副隊長':{bg:'rgba(245,158,11,.18)', c:'#F59E0B', av:'#F59E0B22'},
  '組長':  {bg:'rgba(74,222,128,.14)', c:'#4ADE80', av:'#4ADE8022'},

  '兼職':  {bg:'rgba(107,114,128,.2)', c:'#9CA3AF', av:'#9CA3AF22'},
  'PT':    {bg:'rgba(107,114,128,.15)',c:'#6B7280', av:'#6B728022'},
};

/* ── 有權限編輯的角色 ── */
const CAN_EDIT=['leader','vicecaptain','captain','executive','admin'];
const ROLE_MAP={leader:'組長',vicecaptain:'副隊長',captain:'隊長',executive:'主管',admin:'管理員',fulltime:'正職',parttime:'兼職'};

/* ── 全域狀態 ── */
var contacts=[],nextId=100,tab='all',rf='',editId=null,delId=null,canEdit=false,isAdmin=false;

/* ── 取得當前有效的 GAS URL（管理員可覆寫，否則用內建） ── */
function getGasUrl(){
  var override=localStorage.getItem('hsh_ec_gasUrl_override');
  return (override&&override.trim()) ? override.trim() : BUILT_IN_GAS_URL;
}

/* ── 修正電話：雲端試算表把開頭 0 吃掉時補回（台灣手機 9 碼→補 0 成 10 碼） ── */
function normalizePhone(p){
  if(p===null||p===undefined) return '';
  var s=String(p).trim();
  if(/^9\d{8}$/.test(s)) s='0'+s; // 手機掉了開頭 0
  return s;
}

/* ── 初始化 ── */
function init(){
  /* 從 localStorage 還原聯絡人，失敗則載入預設值 */
  var sv=localStorage.getItem('hsh_ec_contacts');
  if(sv){
    try{
      contacts=JSON.parse(sv).map(function(c){c.phone=normalizePhone(c.phone);c.ecPhone=normalizePhone(c.ecPhone);return c;});
      nextId=Math.max.apply(null,contacts.map(function(c){return c.id;}).concat([99]))+1;
    }catch(e){loadDef();}
  }else{loadDef();}

  /* 讀取登入身份（內嵌於主 App 時） */
  var raw=localStorage.getItem('hsh_session_user');
  if(raw){
    try{
      var u=JSON.parse(raw);
      canEdit=CAN_EDIT.indexOf(u.role)!==-1;
      /* 只有 admin 角色才是管理員 */
      isAdmin=(u.role==='admin');
      var b=document.getElementById('roleBadge');
      b.textContent=u.name+' · '+(ROLE_MAP[u.role]||u.role);
      b.style.display='inline-flex';
    }catch(e){}
  }

  /* 獨立開啟時（非 iframe），視為管理員 */
  if(window.self===window.top){canEdit=true;isAdmin=true;}

  /* 管理員：顯示設定按鈕 + 載入已覆寫的 URL */
  if(isAdmin){
    document.getElementById('btnSyncAdmin').style.display='flex';
    var override=localStorage.getItem('hsh_ec_gasUrl_override')||'';
    document.getElementById('gasUrlInput').value=override||BUILT_IN_GAS_URL;
  }

  /* 有編輯權限才顯示 FAB 新增按鈕 */
  if(canEdit) document.getElementById('fabBtn').style.display='flex';

  render();
  stats();

  /* 開啟工具時自動從雲端拉取最新資料（靜默模式） */
  pullFromGAS(true);
}

/* ── 載入預設聯絡人 ── */
function loadDef(){
  contacts=JSON.parse(JSON.stringify(INIT_CONTACTS));
  nextId=INIT_CONTACTS.length+1;
  save();
}

/* ── 儲存到 localStorage ── */
function save(){
  localStorage.setItem('hsh_ec_contacts',JSON.stringify(contacts));
}

/* ── 切換班別分頁 ── */
function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(function(e){e.classList.remove('active');});
  document.getElementById('tab-'+t).classList.add('active');
  render();
}

/* ── 切換職務篩選 ── */
function setFilter(el,r){
  rf=r;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  render();
}

/* ── 過濾資料（依分頁 + 職務 + 搜尋關鍵字） ── */
function filtered(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  return contacts.filter(function(c){
    if(tab==='early'&&c.shift!=='早班') return false;
    if(tab==='night'&&c.shift!=='晚班') return false;
    if(rf&&c.role!==rf) return false;
    if(q&&c.name.toLowerCase().indexOf(q)===-1&&c.phone.indexOf(q)===-1) return false;
    return true;
  });
}

/* ── 渲染人員卡片 ── */
function render(){
  var list=filtered();
  var box=document.getElementById('cardsContainer');
  stats();

  if(!list.length){
    box.innerHTML='<div class="empty"><i class="ti ti-address-book-off"></i><p>找不到符合條件的聯絡人</p></div>';
    return;
  }

  /* 依班別分組 */
  var g={};
  list.forEach(function(c){
    if(!g[c.shift]) g[c.shift]=[];
    g[c.shift].push(c);
  });

  var html='';
  ['早班','晚班'].forEach(function(s){
    if(!g[s]) return;
    if(tab==='all') html+='<div class="section-label"><i class="ti ti-users"></i> '+s+' &middot; '+g[s].length+' 人</div>';
    html+='<div class="cards">'+g[s].map(card).join('')+'</div><div style="height:14px;"></div>';
  });
  box.innerHTML=html;
}

/* ── 產生單一人員卡片 HTML ── */
function card(c){
  var rs=RS[c.role]||{bg:'rgba(255,255,255,.08)',c:'#9CA3AF',av:'#9CA3AF22'};

  /* 編輯 / 刪除按鈕（有權限才顯示） */
  var acts=canEdit
    ? '<div class="card-actions">'
      + '<button class="btn-card-edit" onclick="openEdit('+c.id+')"><i class="ti ti-pencil"></i> 編輯</button>'
      + '<button class="btn-card-del"  onclick="openDel('+c.id+')"><i class="ti ti-trash"></i></button>'
      + '</div>'
    : '';

  /* 緊急聯絡資訊欄 */
  var ec=c.ecName
    ? '<div class="info-row"><div class="info-lbl">緊急聯絡人</div><div class="info-val">'+c.ecName
        +(c.ecRel?' <span style="font-size:11px;color:var(--muted);">('+c.ecRel+')</span>':'')
        +'</div></div>'
      + '<div class="info-row"><div class="info-lbl">緊急電話</div><div class="info-val"><a href="tel:'+c.ecPhone+'">'+(c.ecPhone||'—')+'</a></div></div>'
    : '<div class="info-row full"><div class="info-val no-ec">尚未填寫緊急聯絡資訊</div></div>';

  return '<div class="card">'
    + '<div class="card-head">'
    +   '<div class="avatar" style="background:'+rs.av+';color:'+rs.c+';border:1.5px solid '+rs.c+'44;">'+c.name[0]+'</div>'
    +   '<div class="card-name">'+c.name+'</div>'
    +   '<div class="role-pill" style="background:'+rs.bg+';color:'+rs.c+';">'+c.role+'</div>'
    + '</div>'
    + '<div class="card-body">'
    +   '<div class="info-row"><div class="info-lbl">本人電話</div><div class="info-val"><a href="tel:'+c.phone+'">'+(c.phone||'—')+'</a></div></div>'
    +   '<div class="info-row"><div class="info-lbl">班別</div><div class="info-val">'+c.shift+'</div></div>'
    +   ec
    + '</div>'
    + acts
    + '</div>';
}

/* ── 更新統計數字 ── */
function stats(){
  document.getElementById('sTotal').textContent=contacts.length;
  document.getElementById('sEarly').textContent=contacts.filter(function(c){return c.shift==='早班';}).length;
  document.getElementById('sNight').textContent=contacts.filter(function(c){return c.shift==='晚班';}).length;
}

/* ── 開啟新增 Modal ── */
function openAddModal(){
  editId=null;
  document.getElementById('modalTitle').textContent='新增聯絡人';
  ['fName','fPhone','fEcName','fEcRel','fEcPhone'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('fShift').value=tab==='night'?'晚班':'早班';
  document.getElementById('fRole').value='正職';
  document.getElementById('editModal').classList.add('open');
}

/* ── 開啟編輯 Modal ── */
function openEdit(id){
  var c=contacts.find(function(x){return x.id===id;});
  if(!c) return;
  editId=id;
  document.getElementById('modalTitle').textContent='編輯：'+c.name;
  document.getElementById('fShift').value=c.shift;
  document.getElementById('fName').value=c.name;
  document.getElementById('fRole').value=c.role;
  document.getElementById('fPhone').value=c.phone;
  document.getElementById('fEcName').value=c.ecName;
  document.getElementById('fEcRel').value=c.ecRel;
  document.getElementById('fEcPhone').value=c.ecPhone;
  document.getElementById('editModal').classList.add('open');
}

/* ── 關閉 Modal ── */
function closeModal(){document.getElementById('editModal').classList.remove('open');}

/* ── 儲存聯絡人（新增或編輯） ── */
function submitContact(){
  var name=document.getElementById('fName').value.trim();
  var phone=document.getElementById('fPhone').value.trim();
  if(!name){toast('請填寫姓名','err');return;}
  if(!phone){toast('請填寫電話','err');return;}

  var d={
    shift:document.getElementById('fShift').value,
    name:name,role:document.getElementById('fRole').value,phone:phone,
    ecName:document.getElementById('fEcName').value.trim(),
    ecRel:document.getElementById('fEcRel').value.trim(),
    ecPhone:document.getElementById('fEcPhone').value.trim()
  };

  if(editId!==null){
    var i=contacts.findIndex(function(c){return c.id===editId;});
    if(i!==-1) contacts[i]=Object.assign({},contacts[i],d);
    toast('✅ 已更新 '+name,'ok');
  }else{
    contacts.push(Object.assign({id:nextId++},d));
    toast('✅ 已新增 '+name,'ok');
  }

  save();render();closeModal();
  /* 資料變動後直接觸發雲端推送（延遲1秒，避免連續操作時重複推送） */
  clearTimeout(submitContact._t);
  submitContact._t=setTimeout(pushToGAS,1000);
}

/* ── 開啟刪除確認 ── */
function openDel(id){
  var c=contacts.find(function(x){return x.id===id;});
  if(!c) return;
  delId=id;
  document.getElementById('confirmMsg').textContent='確定要刪除「'+c.name+'」的聯絡資料？此操作無法復原。';
  document.getElementById('confirmOkBtn').onclick=doDel;
  document.getElementById('confirmModal').classList.add('open');
}

/* ── 執行刪除 ── */
function doDel(){
  var c=contacts.find(function(x){return x.id===delId;});
  contacts=contacts.filter(function(x){return x.id!==delId;});
  save();render();closeConfirm();
  toast('🗑 已刪除 '+(c?c.name:''),'ok');
  /* 刪除後直接觸發雲端推送 */
  clearTimeout(doDel._t);
  doDel._t=setTimeout(pushToGAS,1000);
}

/* ── 關閉刪除確認 ── */
function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');delId=null;}

/* ── 切換管理員設定面板 ── */
function toggleSyncPanel(){document.getElementById('syncPanel').classList.toggle('hidden');}

/* ── 管理員儲存覆寫 URL ── */
function adminSaveUrl(){
  var url=document.getElementById('gasUrlInput').value.trim();
  if(url){
    localStorage.setItem('hsh_ec_gasUrl_override',url);
    toast('✅ URL 已儲存','ok');
  }else{
    /* 清空則恢復使用內建URL */
    localStorage.removeItem('hsh_ec_gasUrl_override');
    document.getElementById('gasUrlInput').value=BUILT_IN_GAS_URL;
    toast('已恢復使用內建 URL','ok');
  }
}

/* ── 更新同步狀態小字 ── */
function setSyncStatus(msg,type){
  var el=document.getElementById('syncStatus');
  el.textContent=msg;
  el.className='sync-status'+(type?' '+type:'');
}

/* ── 從 GAS 雲端拉取
   silent=true：靜默模式（不彈 toast，只更新狀態列）
   silent=false：手動觸發（顯示 toast）
── */
async function pullFromGAS(silent){
  var url=getGasUrl();
  if(!url) return;

  setSyncStatus('☁ 同步中…','loading');
  if(!silent) toast('⏳ 從雲端拉取中…');

  try{
    var r=await fetch(url+'?action=getContacts');
    var d=await r.json();
    if(d.status==='ok'&&d.contacts&&d.contacts.length){
      contacts=d.contacts.map(function(c){c.phone=normalizePhone(c.phone);c.ecPhone=normalizePhone(c.ecPhone);return c;});
      nextId=Math.max.apply(null,contacts.map(function(c){return c.id;}).concat([99]))+1;
      save();render();
      var now=new Date();
      var timeStr=(now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
      setSyncStatus('✓ '+timeStr+' 已同步','ok');
      if(!silent) toast('✅ 已同步 '+contacts.length+' 筆','ok');
    }else{
      setSyncStatus('—','');
      if(!silent) toast('雲端暫無資料','');
    }
  }catch(e){
    setSyncStatus('連線失敗','err');
    if(!silent) toast('❌ 連線失敗','err');
  }
}

/* ── 推送到 GAS 雲端（資料變動後自動呼叫） ── */
async function pushToGAS(){
  var url=getGasUrl();
  if(!url) return;

  setSyncStatus('☁ 推送中…','loading');
  try{
    var b=new URLSearchParams();
    b.append('action','setContacts');
    b.append('contacts',JSON.stringify(contacts));
    var r=await fetch(url,{method:'POST',body:b});
    var d=await r.json();
    if(d.status==='ok'){
      var now=new Date();
      var timeStr=(now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
      setSyncStatus('✓ '+timeStr+' 已推送','ok');
      logWorkflow('emergency','push-contacts','已完成');
      toast('☁ 已同步到雲端','ok');
    }else{
      setSyncStatus('推送失敗','err');
      toast('同步失敗：'+(d.msg||''),'err');
    }
  }catch(e){
    setSyncStatus('推送失敗','err');
    toast('❌ 推送失敗','err');
  }
}

/* ── Toast 通知 ── */
var _tt;
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  clearTimeout(_tt);
  _tt=setTimeout(function(){t.classList.remove('show');},2400);
}

/* ── Modal 背景點擊關閉 ── */
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});
document.getElementById('confirmModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeConfirm();});

/* ── 啟動 ── */
init();
</script>
