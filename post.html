<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天鷹保全 · 今/明日哨表</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  --bg:#0A0C10; --surface:#111827;
  --gold:#D4A800; --gold2:#FFD700; --gold4:#F0C040;
  --indigo:#818CF8; --indigo2:#6366F1;
  --success2:#4ADE80; --error2:#F87171;
  --text:#F5F5F5; --muted:#8A95A8; --muted2:#6B7280;
  --glass:rgba(255,255,255,.04); --glass-bd:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* splash */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s;}
#splash.hide{opacity:0;visibility:hidden;}
.sp-wrap{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
.sp-ring{position:absolute;border-radius:50%;border:2px solid transparent;}
.sp-ring.r1{width:150px;height:150px;border-top-color:var(--gold);border-right-color:var(--gold4);animation:spin 2.2s linear infinite;}
.sp-ring.r2{width:120px;height:120px;border-bottom-color:var(--gold);border-left-color:var(--gold2);animation:spin 1.7s linear infinite reverse;}
.sp-ring.r3{width:92px;height:92px;border-top-color:var(--gold4);animation:spin 1.2s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sp-logo{width:70px;height:auto;object-fit:contain;filter:drop-shadow(0 0 16px rgba(212,168,0,.7));z-index:2;}
.sp-t{margin-top:24px;font-size:18px;font-weight:900;letter-spacing:2px;}
.sp-t .gd{color:var(--gold2);}
/* topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(10,12,16,.95);border-bottom:1px solid rgba(212,168,0,.22);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);}
.tb-logo{width:36px;height:auto;object-fit:contain;max-width:100%;filter:drop-shadow(0 0 10px rgba(212,168,0,.6));}
.tb-txt{flex:1;min-width:0;}
.tb-t1{font-size:15px;font-weight:900;color:var(--gold2);line-height:1.2;}
.tb-t2{font-size:10px;color:var(--muted);letter-spacing:1.2px;margin-top:2px;}
.tb-date{font-size:13px;font-weight:800;color:var(--gold4);white-space:nowrap;}
.tb-refresh{width:34px;height:34px;border-radius:9px;border:1px solid var(--glass-bd);background:rgba(255,255,255,.05);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* tabs */
.tb-tabs{display:flex;gap:8px;padding:12px 16px;background:rgba(10,12,16,.85);border-bottom:1px solid rgba(212,168,0,.14);}
.tb-tab{flex:1;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--glass-bd);background:rgba(255,255,255,.04);color:var(--muted);font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;}
.tb-tab.active{color:var(--bg);border-color:transparent;}
.tb-tab.active[data-view="today"]{background:linear-gradient(135deg,var(--gold),var(--gold4));}
.tb-tab.active[data-view="tomorrow"]{background:linear-gradient(135deg,var(--indigo2),var(--indigo));color:#0A0C10;}
/* wrap */
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px;}
.sec{margin-bottom:18px;}
.sec-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px 12px 0 0;font-weight:900;font-size:14px;}
.sec-head.early{background:linear-gradient(135deg,var(--gold),var(--gold4));color:var(--bg);}
.sec-head.late{background:linear-gradient(135deg,var(--indigo2),var(--indigo));color:#0A0C10;}
.sec-head .cnt{margin-left:auto;font-size:12px;font-weight:700;opacity:.85;}
.sec-body{background:var(--glass);border:1px solid var(--glass-bd);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);}
.row:last-child{border-bottom:none;}
.row .loc{flex:0 0 38%;font-size:13px;font-weight:800;color:var(--gold2);word-break:break-all;}
.row.late .loc{color:var(--indigo);}
.row .nm{flex:1;font-size:14px;font-weight:700;color:var(--text);}
.row .tm{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.row .nb{display:inline-block;margin-left:6px;font-size:10px;color:var(--muted2);}
/* states */
.state{display:none;flex-direction:column;align-items:center;text-align:center;padding:70px 24px;}
.state.show{display:flex;}
.spinner{width:42px;height:42px;border:3px solid rgba(212,168,0,.2);border-top-color:var(--gold4);border-radius:50%;animation:spin 1s linear infinite;}
.state-sub{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.7;}
.btn-ghost{margin-top:20px;border:1px solid var(--glass-bd);border-radius:12px;padding:12px 24px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.05);color:var(--text);}
.footer{text-align:center;font-size:10px;color:var(--muted2);letter-spacing:1px;padding:18px 0 8px;}
</style>
</head>

  <div class="tb-txt">
    <div class="tb-t1" id="tb-t1">☀️ 今日哨表</div>
    <div class="tb-t2">TIANYING SECURITY · DATA SYSTEM</div>
  </div>
  <div class="tb-date" id="tb-date">—</div>
  <button class="tb-refresh" onclick="loadPost()" title="重新整理">⟳</button>
</div>

<div class="tb-tabs">
  <button class="tb-tab active" data-view="today" onclick="switchView('today')">☀️ 今日</button>
  <button class="tb-tab" data-view="tomorrow" onclick="switchView('tomorrow')">🌙 明日</button>
</div>

<div id="state-loading" class="state show">
  <div class="spinner"></div>
  <div class="state-sub" id="loading-msg">載入今日哨表中…</div>
</div>

<div id="state-error" class="state">
  <div style="font-size:48px;">⚠️</div>
  <div class="state-sub" id="error-msg">載入失敗，請稍後再試。</div>
  <button class="btn-ghost" onclick="loadPost()">重新載入</button>
</div>

<div id="state-empty" class="state">
  <div style="font-size:48px;">🕒</div>
  <div class="state-sub" id="empty-msg">尚未產生</div>
  <button class="btn-ghost" onclick="loadPost()">重新整理</button>
</div>

<div id="content" class="wrap" style="display:none;">
  <div class="sec">
    <div class="sec-head early">☀️ 早班 <span style="font-weight:700;font-size:12px;">08:00~20:00</span><span class="cnt" id="early-cnt"></span></div>
    <div class="sec-body" id="early-body"></div>
  </div>
  <div class="sec">
    <div class="sec-head late">🌙 晚班 <span style="font-weight:700;font-size:12px;">20:00~08:00</span><span class="cnt" id="late-cnt"></span></div>
    <div class="sec-body" id="late-body"></div>
  </div>
  <div class="footer">© TIANYING SECURITY · INTERNAL SYSTEM</div>
</div>

<script>
'use strict';
// ★★★ 必填：與請假同一支「帳號+請假+LINE」GAS 的 /exec 網址 ★★★
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxEVBHseDpLWiWe4d8kLcCHbVFiKAK9wyoLwqNkt59PS4vPCY9QfG0_wiDJf2coO3zMcg/exec';

var currentView = 'today'; // 'today' | 'tomorrow'
var VIEW_INFO = {
  today:    { action: 'getTodayPost',    label: '今日哨表', icon: '☀️' },
  tomorrow: { action: 'getTomorrowPost', label: '明日哨表', icon: '🌙' }
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

function showState(n){
  ['loading','error','empty'].forEach(function(s){ var el=$('state-'+s); if(el) el.classList.toggle('show', s===n); });
  $('content').style.display = (n==='content') ? 'block' : 'none';
}

function switchView(view){
  if (view === currentView) return;
  currentView = view;
  document.querySelectorAll('.tb-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-view') === view);
  });
  $('tb-t1').textContent = VIEW_INFO[view].icon + ' ' + VIEW_INFO[view].label;
  loadPost();
}

function renderRows(list, cls){
  if(!list || !list.length) return '<div class="row"><div class="nm" style="color:var(--muted)">（無資料）</div></div>';
  var html='';
  for(var i=0;i<list.length;i++){
    var it=list[i];
    var noBind = it.empId ? '' : '<span class="nb">未建檔</span>';
    html += '<div class="row '+cls+'">'+
      '<div class="loc">'+esc(it.loc)+'</div>'+
      '<div class="nm">'+esc(it.name)+noBind+'</div>'+
      '<div class="tm">'+esc(it.time)+'</div>'+
    '</div>';
  }
  return html;
}

function loadPost(){
  var view = currentView;
  showState('loading');
  $('loading-msg').textContent = '載入' + VIEW_INFO[view].label + '中…';
  if(GAS_URL==='GAS_URL_PH'){ $('error-msg').textContent='系統尚未設定 GAS 網址，請聯絡管理員。'; showState('error'); return; }
  fetch(GAS_URL + '?action=' + VIEW_INFO[view].action)
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (view !== currentView) return; // 切換分頁時，忽略舊分頁的回應
      if(res && res.status==='ok'){
        $('tb-date').textContent = res.date || '';
        $('early-cnt').textContent = (res.early||[]).length + ' 人';
        $('late-cnt').textContent = (res.late||[]).length + ' 人';
        $('early-body').innerHTML = renderRows(res.early, 'early');
        $('late-body').innerHTML = renderRows(res.late, 'late');
        showState('content');
      } else if (res && res.status==='notyet') {
        $('tb-date').textContent = res.date || '';
        $('empty-msg').textContent = res.msg || (VIEW_INFO[view].label + '尚未更新');
        showState('empty');
      } else {
        throw new Error((res && res.msg) || '讀取失敗');
      }
    })
    .catch(function(err){ if (view === currentView) { $('error-msg').textContent='載入失敗：'+err.message; showState('error'); } });
}

window.addEventListener('load', function(){
  setTimeout(function(){ $('splash').classList.add('hide'); loadPost(); }, 600);
});
</script>
