  z-index:90;transition:opacity .4s;} #splash.out{opacity:0;pointer-events:none;}

<script>
/* ════════════════════════════════════════════════════════════════════
   天鷹保全 · 生理假紀錄
   ────────────────────────────────────────────────────────────────────
   主管（副隊長以上）登記女性員工生理假，並自動統計年度天數與法規狀態。

   ⚠️ 本工具處理健康相關個資（個資法第6條特種個資）。三層權限：
      index.html DEFAULT_PERMS → 本頁 checkPermission() → GAS 每個 action
      再驗一次 token+角色。前兩層都在使用者瀏覽器裡、改得掉，後端那層才是真的。

   法規依據（性別平等工作法第14條）：
      女性受僱者因生理日致工作有困難者，每月得請生理假一日，
      全年請假日數未逾三日，不併入病假計算，其餘日數併入病假計算。
   ════════════════════════════════════════════════════════════════════ */

var LEAVE_GAS_URL = 'https://script.google.com/macros/s/AKfycbzo-nh_broJRph-y7ocobFRe-pPF1CX2Q4yNVex-P2dqKyKHMcXqpAI_hTMtOyTi6v1wg/exec';
var ACCOUNT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxEVBHseDpLWiWe4d8kLcCHbVFiKAK9wyoLwqNkt59PS4vPCY9QfG0_wiDJf2coO3zMcg/exec';
var VICE_PLUS_ROLES = ['vicecaptain', 'captain', 'executive', 'admin'];

/* 全年不併入病假的上限（天）。法規值，不要隨手改。 */
var 年度免併病假上限 = 3;
/* 每月得請的天數上限 */
var 每月上限 = 1;

var S = { records: [], employees: {}, year: new Date().getFullYear(), open: {}, form: {} };

/* ════════════════════════════════════════════════════════════════
   核心計算（純函式，可用 node 直接測，不依賴畫面）
   ════════════════════════════════════════════════════════════════ */

/* 兩個 YYYY-MM-DD 相差幾天 */
function 日差(a, b) {
  var d1 = new Date(a + 'T00:00:00Z'), d2 = new Date(b + 'T00:00:00Z');
  return Math.round((d2 - d1) / 86400000);
}
function 加日(ymd, n) {
  var d = new Date(ymd + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

/* 單一員工的年度統計。
   回傳每筆紀錄的累計天數與「是否併入病假」，以及全年合計。
   併入病假的判定：依日期排序累加，累計超過 3 天之後的部分要併入病假
   （法規是「全年未逾三日不併入」，所以第 3.5 天起就開始併）。 */
function 算年度(records) {
  var 排序 = records.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var 累計 = 0, 明細 = [], 併病假天數 = 0;
  for (var i = 0; i < 排序.length; i++) {
    var r = 排序[i];
    var 前 = 累計;
    累計 += r.days;
    // 這筆有多少落在 3 天額度內、多少要併病假
    var 免併 = Math.max(0, Math.min(r.days, 年度免併病假上限 - 前));
    var 併 = r.days - 免併;
    併病假天數 += 併;
    明細.push({ rec: r, 累計: 累計, 併病假: 併 > 0, 併病假天數: 併 });
  }
  return { 明細: 明細, 合計: 累計, 併病假天數: 併病假天數, 超過上限: 累計 > 年度免併病假上限 };
}

/* 找出同一個月請超過 1 天的月份（法規：每月得請一日） */
function 超月上限的月份(records) {
  var byMonth = {};
  records.forEach(function (r) {
    var m = String(r.date || '').slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + r.days;
  });
  return Object.keys(byMonth).filter(function (m) { return byMonth[m] > 每月上限; })
    .sort().map(function (m) { return { 月: m, 天數: byMonth[m] }; });
}

/* 預估下次生理期。
   ⚠️ 這是「參考區間」不是預測結果，資料本來就有限、週期也會變動。
   規則：
     - 至少要 2 次紀錄才算得出間隔，只有 1 次一律回 null（沒根據就不猜）
     - 只取最近 6 次，太舊的週期參考價值低
     - 間隔在 15~60 天之外視為異常剔除（同一次經期分兩天登記會產生 1~2 天的
       假間隔，會嚴重拉低平均；超過 60 天多半是中間漏登記）
     - 回傳預估日與 ±3 天的區間 */
function 預估下次(records) {
  var 日期 = records.map(function (r) { return r.date; })
    .filter(function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d); })
    .sort();
  // 同一天可能有多筆（不該發生，GAS 有擋，但前端也去重一次）
  日期 = 日期.filter(function (d, i) { return i === 0 || d !== 日期[i - 1]; });
  if (日期.length < 2) return null;
  var 最近 = 日期.slice(-6);
  var 間隔 = [];
  for (var i = 1; i < 最近.length; i++) {
    var g = 日差(最近[i - 1], 最近[i]);
    if (g >= 15 && g <= 60) 間隔.push(g);
  }
  if (!間隔.length) return null;
  var 平均 = Math.round(間隔.reduce(function (a, b) { return a + b; }, 0) / 間隔.length);
  var 末次 = 最近[最近.length - 1];
  var 預估 = 加日(末次, 平均);
  /* 半徑 0 ＝ 只給單一預估日，不給區間（2026-08-10 咖哩決定）。
     理由：這個數字只是給排班人員參考用，一個明確日期比「08/20～08/26」
     這種區間好讀也好排。
     ⚠️ 這代表畫面上呈現的是「最可能的一天」，不是保證——週期本來就會浮動，
     所以「週期約 N 天・依 N 次紀錄」那段一定要留著，讓看的人自己判斷可信度
     （只有 2 次紀錄跟有 6 次紀錄，同樣一個日期的可信度差很多）。
     起/訖 欄位保留是為了之後若要改回區間，只要調這個半徑就好。 */
  var 半徑 = 0;
  return { 平均間隔: 平均, 末次: 末次, 預估: 預估, 半徑: 半徑,
           起: 加日(預估, -半徑), 訖: 加日(預估, 半徑), 依據筆數: 間隔.length + 1 };
}

/* 把所有紀錄依員工分組，附上該年度統計與預估 */
function 分組統計(records, year) {
  var 本年 = records.filter(function (r) { return String(r.date || '').slice(0, 4) === String(year); });
  var by = {};
  本年.forEach(function (r) {
    if (!by[r.empId]) by[r.empId] = { empId: r.empId, name: r.name, recs: [] };
    by[r.empId].recs.push(r);
    if (r.name) by[r.empId].name = r.name;
  });
  return Object.keys(by).map(function (id) {
    var g = by[id];
    // 預估要看「跨年度」的完整紀錄，只用本年會在年初算不出來
    var 全部 = records.filter(function (r) { return r.empId === id; });
    return { empId: id, name: g.name, 年度: 算年度(g.recs),
             月超標: 超月上限的月份(g.recs), 預估: 預估下次(全部) };
  }).sort(function (a, b) { return b.年度.合計 - a.年度.合計; });
}

try { if (typeof module !== 'undefined') Object.assign(module.exports, {
  算年度: 算年度, 預估下次: 預估下次, 超月上限的月份: 超月上限的月份,
  分組統計: 分組統計, 日差: 日差, 加日: 加日,
  年度免併病假上限: 年度免併病假上限, 每月上限: 每月上限
}); } catch (e) {}
</script>
<script>
/* ════════════════════════════════════════════════════════════════
   以下為畫面與通訊
   ════════════════════════════════════════════════════════════════ */
if (typeof document !== 'undefined') {

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
function getSessionUser(){
  try { return JSON.parse(localStorage.getItem('hsh_session_user') || 'null'); } catch(e){ return null; }
}
function getAuthToken(){
  try { return localStorage.getItem('hsh_auth_token') || ''; } catch(e){ return ''; }
}
function toast(msg, type){
  var d = document.createElement('div');
  d.className = 'toast ' + (type==='ok'?'t-ok':type==='err'?'t-err':'t-inf');
  d.textContent = msg;
  $('twrap').appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 3200);
}
function hideSplash(){ var s=$('splash'); if(s){ s.classList.add('out'); setTimeout(function(){ s.remove(); },450); } }
function showNoPerm(msg){
  hideSplash();
  /* 這裡會整個把 <body> 換掉（含原本的返回鈕），使用者卡在這頁只能
     滑掉分頁重開，沒有回主選單的路。補一個返回鈕，工號狀態沿用
     backBtn 早先算好的 href（天鷹規範：工號狀態不可遺失）。 */
  var backHref = ($('backBtn') && $('backBtn').getAttribute('href')) || 'index.html';
  document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;flex-direction:column;'+
    'align-items:center;justify-content:center;gap:16px;padding:20px;background:#0A0C10">'+
    '<div class="errbox" style="max-width:360px"><i class="ti ti-lock"></i><div>'+esc(msg)+'</div></div>'+
    '<a class="back" href="'+esc(backHref)+'"><i class="ti ti-arrow-left"></i>返回主選單</a></div>';
}
function checkPermission(){
  var u = getSessionUser();
  if(!u || !u.empId){ showNoPerm('請從天鷹保全 App 登入後開啟本工具'); return false; }
  if(!getAuthToken()){ showNoPerm('登入已失效，請重新從天鷹保全 App 登入'); return false; }
  if(VICE_PLUS_ROLES.indexOf(u.role) === -1){ showNoPerm('此工具僅限副隊長以上使用，如有需要請洽主管'); return false; }
  return true;
}

/* ── 資料 ── */
async function loadEmployees(){
  try {
    var res = await fetch(ACCOUNT_GAS_URL + '?action=getApprovedUsers');
    var d = await res.json();
    if(d && d.status === 'ok' && d.users) S.employees = d.users;
  } catch(e){ /* 拿不到就留空，不擋其他功能 */ }
}
async function loadRecords(){
  try {
    var res = await fetch(LEAVE_GAS_URL + '?action=getRecords&token=' + encodeURIComponent(getAuthToken()));
    var d = await res.json();
    if(d.status !== 'ok') throw new Error(d.msg || '讀取失敗');
    S.records = d.records || [];
    render();
  } catch(err){
    $('list').innerHTML = '<div class="errbox"><i class="ti ti-alert-triangle"></i><div>載入失敗：'+
      esc(err.message)+'</div></div>';
  }
}

/* ── 畫面 ── */
function 年份選單(){
  var ys = {}; ys[new Date().getFullYear()] = 1;
  S.records.forEach(function(r){ var y=String(r.date||'').slice(0,4); if(y) ys[y]=1; });
  var arr = Object.keys(ys).sort().reverse();
  $('yr').innerHTML = arr.map(function(y){
    return '<option value="'+y+'"'+(String(y)===String(S.year)?' selected':'')+'>'+y+' 年</option>';
  }).join('');
}

function render(){
  年份選單();
  var q = ($('q').value || '').trim();
  var 群 = 分組統計(S.records, S.year);
  if(q) 群 = 群.filter(function(g){ return String(g.name||'').indexOf(q) >= 0; });

  if(!群.length){
    $('list').innerHTML = '<div class="empty">'+(q ? '找不到「'+esc(q)+'」的紀錄'
      : S.year + ' 年還沒有任何生理假紀錄。<br>按下方「新增紀錄」開始登記。')+'</div>';
    return;
  }

  $('list').innerHTML = 群.map(function(g){
    var 合計 = g.年度.合計;
    var cls = g.年度.超過上限 ? 'b-over' : (合計 >= 年度免併病假上限 ? 'b-warn' : 'b-ok');
    var 提醒 = [];
    if(g.年度.超過上限) 提醒.push('超過 '+年度免併病假上限+' 天，超出的 '+
      g.年度.併病假天數+' 天併入病假');
    if(g.月超標.length) 提醒.push('同月超過 '+每月上限+' 天：'+
      g.月超標.map(function(m){ return m.月.slice(5)+'月('+m.天數+'天)'; }).join('、'));
    var 預 = g.預估;
    // 半徑 0 時起訖同一天，直接顯示單日；日後若把半徑調回非 0 會自動變回區間寫法
    var 預文 = 預
      ? ('下次約 ' + (預.起 === 預.訖
            ? 預.預估.slice(5).replace('-','/')
            : 預.起.slice(5).replace('-','/') + '～' + 預.訖.slice(5).replace('-','/'))
         + '（週期約 ' + 預.平均間隔 + ' 天・依 ' + 預.依據筆數 + ' 次紀錄）')
      : '紀錄未滿 2 次，尚無法推估';

    var open = !!S.open[g.empId];
    var 明細 = g.年度.明細.slice().reverse().map(function(m){
      var r = m.rec;
      return '<div class="rec">'+
        '<div class="d"><div class="dd">'+esc(r.date)+'　'+(r.days===0.5?'半天':'全天')+'</div>'+
        '<div class="dn">'+(r.shift?esc(r.shift)+'　':'')+(r.note?esc(r.note)+'　':'')+
        '累計 '+m.累計+' 天'+(r.byName?'　· 登記：'+esc(r.byName):'')+'</div></div>'+
        (m.併病假 ? '<span class="tag tag-sick">併病假</span>' : '<span class="tag">不併病假</span>')+
        '<button class="del" onclick="delRec('+r.id+')" title="刪除"><i class="ti ti-trash"></i></button>'+
      '</div>';
    }).join('');

    return '<div class="card">'+
      '<div class="card-h" onclick="toggle(\''+esc(g.empId)+'\')">'+
        '<div class="nm"><div class="n1">'+esc(g.name||g.empId)+'</div>'+
        '<div class="n2">'+預文+(提醒.length?'<br>⚠ '+提醒.join('；'):'')+'</div></div>'+
        '<span class="badge '+cls+'">'+合計+' 天</span>'+
        '<i class="ti ti-chevron-'+(open?'up':'down')+'" style="color:var(--muted)"></i>'+
      '</div>'+
      (open ? '<div class="card-b">'+明細+'</div>' : '')+
    '</div>';
  }).join('');
}
function toggle(id){ S.open[id] = !S.open[id]; render(); }

/* ── 新增 ── */
function openAdd(){
  var ids = Object.keys(S.employees).sort(function(a,b){
    return String(S.employees[a].name||'').localeCompare(String(S.employees[b].name||''),'zh-Hant');
  });
  var opts = '<option value="">— 請選擇 —</option>' + ids.map(function(id){
    return '<option value="'+esc(id)+'">'+esc(S.employees[id].name||id)+'</option>'; }).join('');
  S.form = { days: 1, shift: '' };
  $('modal').innerHTML =
   '<div class="mask" onclick="if(event.target===this)closeAdd()"><div class="modal">'+
    '<h3>新增生理假紀錄</h3>'+
    '<div class="fld"><label>員工</label><select id="f-emp">'+opts+'</select></div>'+
    '<div class="fld"><label>日期</label><input id="f-date" type="date" value="'+
      new Date().toISOString().slice(0,10)+'"></div>'+
    '<div class="fld"><label>天數</label><div class="seg" id="f-days">'+
      '<button class="on" onclick="setDays(1)">全天</button>'+
      '<button onclick="setDays(0.5)">半天</button></div></div>'+
    '<div class="fld"><label>班別（選填）</label><div class="seg" id="f-shift">'+
      '<button onclick="setShift(\'早班\')">早班</button>'+
      '<button onclick="setShift(\'晚班\')">晚班</button>'+
      '<button class="on" onclick="setShift(\'\')">不填</button></div></div>'+
    '<div class="fld"><label>備註（選填）</label>'+
      '<textarea id="f-note" rows="2" placeholder="例：已找人代班"></textarea></div>'+
    '<div class="note">同一人同一天只能登記一筆。送出後可在列表展開刪除。</div>'+
    '<div class="btns"><button class="btn btn-gh" onclick="closeAdd()">取消</button>'+
      '<button class="btn btn-pri" id="f-submit" onclick="submitAdd()">送出</button></div>'+
   '</div></div>';
}
function closeAdd(){ $('modal').innerHTML = ''; }
function setDays(v){
  S.form.days = v;
  [].forEach.call($('f-days').children, function(b,i){ b.classList.toggle('on', (i===0)===(v===1)); });
}
function setShift(v){
  S.form.shift = v;
  var map = ['早班','晚班',''];
  [].forEach.call($('f-shift').children, function(b,i){ b.classList.toggle('on', map[i]===v); });
}
async function submitAdd(){
  var empId = $('f-emp').value;
  var date = $('f-date').value;
  if(!empId){ toast('請選擇員工','err'); return; }
  if(!date){ toast('請選擇日期','err'); return; }
  var name = (S.employees[empId] && S.employees[empId].name) || '';
  var btn = $('f-submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    var body = new URLSearchParams();
    body.append('action','addRecord');
    body.append('token', getAuthToken());
    body.append('data', JSON.stringify({ date:date, empId:empId, name:name,
      days:S.form.days, shift:S.form.shift, note:($('f-note').value||'').trim() }));
    var res = await fetch(LEAVE_GAS_URL, { method:'POST', body:body });
    var d = await res.json();
    if(d.status !== 'ok') throw new Error(d.msg || '未知錯誤');
    toast('✓ 已新增','ok');
    closeAdd();
    loadRecords();
  } catch(err){
    toast('✗ '+err.message,'err');
  } finally { btn.disabled = false; btn.textContent = '送出'; }
}

async function delRec(id){
  if(!window.confirm('確定刪除這筆紀錄？此動作無法復原。')) return;
  try {
    var body = new URLSearchParams();
    body.append('action','deleteRecord');
    body.append('token', getAuthToken());
    body.append('data', JSON.stringify({ id:id }));
    var res = await fetch(LEAVE_GAS_URL, { method:'POST', body:body });
    var d = await res.json();
    if(d.status !== 'ok') throw new Error(d.msg || '未知錯誤');
    toast('🗑 已刪除','ok');
    (window.fxRemoveThen||function(f){f();})(loadRecords); // 被刪的那一列先收合淡出再重畫
  } catch(err){ toast('✗ 刪除失敗：'+err.message,'err'); }
}

/* ── 掛到 window：動態插入的 HTML 用 onclick="xxx()" 呼叫這些函式 ──
   ⚠️ 這裡不能省。本檔的函式都寫在 if (typeof document !== 'undefined') 區塊內
   （為了讓 node 能單獨測上面的核心計算），而 HTML 屬性裡的 onclick 只找得到
   window 上的函式。
   普通 function 宣告在區塊內時，瀏覽器會自動建立全域繫結（規格 Annex B 的
   相容行為），所以 openAdd/setDays 沒事；但 async function 沒有這個待遇，
   只存在於區塊作用域——submitAdd 與 delRec 剛好是唯二的 async 函式，
   結果按了完全沒反應也不報錯（2026-08-10 咖哩回報「沒辦法按送出」）。
   一律明確掛載，不要依賴那條隱晦規則。 */
window.openAdd = openAdd;
window.closeAdd = closeAdd;
window.submitAdd = submitAdd;
window.setDays = setDays;
window.setShift = setShift;
window.delRec = delRec;
window.toggle = toggle;
window.render = render;

/* ── 啟動 ── */
window.addEventListener('load', function(){
  // 返回主選單要保留工號（天鷹規範：工號狀態不可遺失）
  var empId = new URLSearchParams(location.search).get('empId') || '';
  if(empId) $('backBtn').href = 'index.html?empId=' + encodeURIComponent(empId);
  if(!checkPermission()) return;
  $('app').style.display = '';
  $('fab').style.display = '';
  $('yr').addEventListener('change', function(){ S.year = this.value; render(); });
  Promise.all([loadEmployees(), loadRecords()]).then(hideSplash);
  setTimeout(hideSplash, 3000); // 保險：網路慢也要讓畫面出現
});

}
</script>
