<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天鷹保全 · 事故報告填寫</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 天鷹規範：強制 React 19 + ReactDOM 19 原生載入 -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg: #0A0C10;
            --surface: #111827;
            --primary: #D4A800;
            --primary-glow: rgba(212, 168, 0, 0.3);
            --text: #F5F5F5;
            --text-muted: #8A95A8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #4ADE80;
            --error: #F87171;
            --glass: rgba(255, 255, 255, 0.03);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; min-height: 100vh; }

        /* ===== 天鷹品牌啟動遮罩：三層金色光環 + 中央去背 LOGO + 四角金框 ===== */
        #splash { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        #splash.hide { opacity: 0; visibility: hidden; }
        .splash-logo-wrap { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring1 { inset: 0; border-top-color: #FFD700; border-right-color: rgba(212,168,0,.4); animation: spin 2.4s linear infinite; }
        .ring2 { inset: 14px; border-bottom-color: #D4A800; border-left-color: rgba(212,168,0,.3); animation: spin 1.8s linear infinite reverse; }
        .ring3 { inset: 28px; border-top-color: #F0C040; animation: spin 3s linear infinite; }
        .splash-logo { width: 62px; height: 62px; max-width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0 0 16px rgba(212,168,0,.7)); z-index: 2; }
        .corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--primary); }
        .corner.tl { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
        .corner.tr { top: -6px; right: -6px; border-left: 0; border-bottom: 0; }
        .corner.bl { bottom: -6px; left: -6px; border-right: 0; border-top: 0; }
        .corner.br { bottom: -6px; right: -6px; border-left: 0; border-top: 0; }
        .splash-brand { margin-top: 22px; color: #FFD700; font-size: 22px; font-weight: 700; letter-spacing: 4px; }
        .splash-brand-en { margin-top: 6px; color: var(--text-muted); font-size: 11px; letter-spacing: 2px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .back-btn { background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 14px; transition: all .25s; }
        .back-btn:hover { border-color: var(--primary); background: rgba(255,255,255,.06); }
        .logo-area { text-align: center; margin-bottom: 24px; }
        .logo-img { width: 64px; height: 64px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 0 16px rgba(212,168,0,.7)); }
        .title-main { color: var(--primary); font-size: 20px; font-weight: 700; margin-top: 10px; letter-spacing: 2px; }
        .title-sub { color: var(--text-muted); font-size: 11px; letter-spacing: 2px; margin-top: 4px; }
        .card { background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .label i { color: var(--primary); }
        .input, .select, .textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--text); font-size: 16px; outline: none; font-family: inherit; }
        .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .textarea { min-height: 120px; resize: none; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #D4A800, #F0C040); color: #000; border: none; padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 20px rgba(212,168,0,0.4); font-family: inherit; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .photo-grid { display: flex; gap: 12px; margin-top: 4px; }
        .photo-box { flex: 1; aspect-ratio: 1; background: rgba(255,255,255,0.04); border: 2px dashed var(--border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; position: relative; overflow: hidden; color: var(--text-muted); }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .footer { text-align: center; color: var(--text-muted); font-size: 11px; letter-spacing: 1px; margin-top: 28px; opacity: .7; }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 14px 28px; border-radius: 50px; font-weight: 600; z-index: 10000; display: flex; align-items: center; gap: 10px; transition: all 0.3s; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>

    <div id="root"></div>
    <script>
        const { useState, useEffect } = React;
        const params = new URLSearchParams(window.location.search);
        // 工號狀態：由主選單以 ?empId= 帶入，缺省為「未登入」（與全 APP 一致）
        // 工號：優先 ?empId=（主選單帶入），缺則同 origin 讀登入態 session，最後才『未登入』
        let empId = params.get('empId') || '';
        if (!empId) { try { empId = (JSON.parse(localStorage.getItem('hsh_session_user') || '{}').empId) || ''; } catch (e) {} }
        if (!empId) empId = '未登入';
        // 同 origin 可讀主程式登入態，盡量帶出姓名供後台辨識（前台不顯示）
        function getSessionName(){
            try { const u = JSON.parse(localStorage.getItem('hsh_session_user') || '{}');
                return u.name || u.empName || u.userName || u['姓名'] || ''; } catch(e){ return ''; }
        }

        // ===== 主管模式（?mode=admin）共用 =====
        const mode = params.get('mode') || '';
        function getSessionRole(){
            try { return (JSON.parse(localStorage.getItem('hsh_session_user') || '{}').role) || ''; } catch(e){ return ''; }
        }
        const STATUS_COLORS = { '未讀': '#F87171', '待處理': '#FB923C', '已知悉再觀察': '#818CF8', '持續追蹤': '#FBBF24', '已讀': '#D4A800', '處理中': '#FB923C', '已處理': '#4ADE80' };
        const ADMIN_GAS_URL = "https://script.google.com/macros/s/AKfycbwHXlwTMmJyA79Cuzdh2IPRnBLUWm2YPEqXn5XJj4GVEUlCnNIv8hgRTJ7Xr198hZxG/exec";
        const WORKFLOW_GAS_URL = "https://script.google.com/macros/s/AKfycbzxjedGAbxj3G85zkybqoFoB-P7uQ9ycqdJZ7mzQ2Ax-vaxKgOTG60120PlGPbcNJpR/exec";
        async function logWorkflow(tool, actionType, status) {
            const u = JSON.parse(localStorage.getItem('hsh_session_user') || '{}');
            if (!u.empId) return;
            try {
                await fetch(WORKFLOW_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'logTask', tool, empId: u.empId, userName: u.name || '未知', actionType, status: status || '已完成' }) });
            } catch(e) {}
        }

        // 狀態徽章
        function StatusBadge(status){
            const c = STATUS_COLORS[status] || '#8A95A8';
            return React.createElement("span", { style: { background: c + '22', color: c, border: '1px solid ' + c + '55', borderRadius: '999px', padding: '2px 10px', fontSize: '12px', fontWeight: 700, whiteSpace: 'nowrap' } }, status || '未讀');
        }
        // 詳情欄位列
        function fieldRow(label, value){
            return React.createElement("div", { style: { marginBottom: '12px' } },
                React.createElement("div", { style: { fontSize: '12px', color: 'var(--primary)', marginBottom: '3px' } }, label),
                React.createElement("div", { style: { fontSize: '14px', color: 'var(--text)', whiteSpace: 'pre-wrap', wordBreak: 'break-word' } }, value || '—')
            );
        }
        // 照片連結（以 \n 分隔）→ 可點開連結
        function photoLinks(raw){
            const urls = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean);
            if (!urls.length) return React.createElement("div", { style: { fontSize: '14px', color: 'var(--text-muted)' } }, "（無照片）");
            return React.createElement("div", { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
                urls.map((u, i) => React.createElement("a", { key: i, href: u, target: "_blank", rel: "noopener", style: { fontSize: '13px', color: '#818CF8', wordBreak: 'break-all' } },
                    React.createElement("i", { className: "ti ti-photo", style: { marginRight: '4px' } }), "查看照片 " + (i + 1)))
            );
        }

        function App() {
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                time: new Date().toTimeString().slice(0,5),
                location: '',
                category: '一般事故',
                description: '',
                action: '',
                personnel: ''
            });

        // ===== 主管審閱畫面（事故報告）=====
        function AdminApp(){
            const [list, setList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filter, setFilter] = useState('unread'); // unread | pending | done | all
            const [selected, setSelected] = useState(null);
            const [navRows, setNavRows] = useState([]); // 凍結的瀏覽順序（進入詳情時的篩選清單列號）
            const [navPos, setNavPos] = useState(-1);
            const [updating, setUpdating] = useState(false);
            const REPORT_STATUS = ['待處理', '已知悉再觀察', '持續追蹤', '已處理'];
            const role = getSessionRole();
            const allowed = ['executive', 'admin'].includes(role);
            const canDelete = role === 'admin'; // 永久刪除僅限管理員

            useEffect(() => {
                setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); } }, 500);
                if (allowed) loadList();
            }, []);

            const loadList = async () => {
                setLoading(true);
                try {
                    const res = await fetch(ADMIN_GAS_URL + '?action=getReports');
                    const d = await res.json();
                    if (d.status === 'ok' && Array.isArray(d.list)) setList(d.list);
                    else showToast('❌ 讀取失敗：' + (d.msg || '未知錯誤'), 'err');
                } catch (e) { showToast('❌ 網路連線錯誤', 'err'); }
                setLoading(false);
            };

            const changeStatus = async (item, status) => {
                if (updating) return;
                setUpdating(true);
                try {
                    const body = new URLSearchParams();
                    body.append('action', 'updateStatus');
                    body.append('payload', JSON.stringify({ sheet: 'report', row: item.row, status: status }));
                    const res = await fetch(ADMIN_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, body: body.toString() });
                    const d = await res.json();
                    if (d.status === 'ok') {
                        setList(prev => prev.map(r => r.row === item.row ? { ...r, '狀態': status } : r));
                        setSelected(prev => (prev && prev.row === item.row) ? { ...prev, '狀態': status } : prev);
                        showToast('✅ 狀態已更新為「' + status + '」', 'success');
                    } else showToast('❌ 更新失敗：' + (d.msg || ''), 'err');
                } catch (e) { showToast('❌ 網路連線錯誤', 'err'); }
                setUpdating(false);
            };

            // 永久刪除（限管理員）：刪後重讀清單以同步列號
            const deleteItem = async (item) => {
                if (updating) return;
                if (!window.confirm('確定永久刪除編號 #' + item['編號'] + '？\n此動作無法復原。')) return;
                setUpdating(true);
                try {
                    const body = new URLSearchParams();
                    body.append('action', 'deleteRow');
                    body.append('payload', JSON.stringify({ sheet: 'report', row: item.row }));
                    const res = await fetch(ADMIN_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, body: body.toString() });
                    const d = await res.json();
                    if (d.status === 'ok') {
                        showToast('🗑️ 已刪除編號 #' + item['編號'], 'success');
                        setSelected(null);
                        await loadList();
                    } else showToast('❌ 刪除失敗：' + (d.msg || ''), 'err');
                } catch (e) { showToast('❌ 網路連線錯誤', 'err'); }
                setUpdating(false);
            };

            // 開啟詳情：凍結目前篩選順序供上一篇/下一篇，並自動將未讀標記為「待處理」
            const openDetail = (item, orderedRows) => {
                setNavRows(orderedRows);
                setNavPos(orderedRows.indexOf(item.row));
                setSelected(item);
                autoMark(item);
            };
            const goRel = (delta) => {
                const np = navPos + delta;
                if (np < 0 || np >= navRows.length) return;
                const item = list.find(r => r.row === navRows[np]);
                if (!item) return;
                setNavPos(np);
                setSelected(item);
                autoMark(item);
            };
            // 未讀 → 打開後自動轉「待處理」（瀏覽順序已凍結，下一篇仍走原篩選清單）
            const autoMark = (item) => { if (item && (item['狀態'] || '未讀') === '未讀') changeStatus(item, '待處理'); };
            const navBtnStyle = (dis) => ({ flexShrink: 0, padding: '8px 12px', borderRadius: '8px', fontSize: '13px', fontWeight: 700,
                cursor: dis ? 'default' : 'pointer', border: '1px solid var(--border)', background: dis ? 'transparent' : 'rgba(212,168,0,.12)',
                color: dis ? 'var(--text-muted)' : 'var(--primary)', opacity: dis ? .4 : 1 });

            const header = React.createElement("div", { className: "header" },
                React.createElement("a", { href: `index.html?empId=${empId}`, className: "back-btn" }, React.createElement("i", { className: "ti ti-chevron-left" }), "返回主選單"),
                React.createElement("div", { style: { fontSize: '12px' } }, React.createElement("span", { style: { color: 'var(--primary)' } }, "主管審閱"))
            );

            if (!allowed) {
                return React.createElement("div", { className: "container" }, header,
                    React.createElement("div", { className: "card", style: { textAlign: 'center', padding: '40px 20px' } },
                        React.createElement("div", { style: { fontSize: '40px', marginBottom: '12px' } }, "🔒"),
                        React.createElement("div", { style: { fontSize: '16px', fontWeight: 700, marginBottom: '6px' } }, "無檢視權限"),
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)' } }, "此頁面僅限公司主管／管理員檢視")
                    )
                );
            }

            // 詳情頁
            if (selected) {
                const it = selected;
                return React.createElement("div", { className: "container" },
                    React.createElement("div", { className: "header" },
                        React.createElement("a", { href: "#", className: "back-btn", onClick: e => { e.preventDefault(); setSelected(null); } }, React.createElement("i", { className: "ti ti-chevron-left" }), "返回清單"),
                        StatusBadge(it['狀態'])
                    ),
                    React.createElement("div", { style: { display: 'flex', gap: '8px', marginBottom: '12px', alignItems: 'center' } },
                        React.createElement("button", { disabled: navPos <= 0, onClick: () => goRel(-1), style: navBtnStyle(navPos <= 0) }, "‹ 上一篇"),
                        React.createElement("div", { style: { flex: 1, textAlign: 'center', fontSize: '12px', color: 'var(--text-muted)' } }, navRows.length ? ((navPos + 1) + " / " + navRows.length) : ''),
                        React.createElement("button", { disabled: navPos >= navRows.length - 1, onClick: () => goRel(1), style: navBtnStyle(navPos >= navRows.length - 1) }, "下一篇 ›")
                    ),
                    React.createElement("div", { className: "card" },
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)', marginBottom: '12px' } }, "編號 #" + it['編號']),
                        fieldRow("事故日期 / 時間", (it['日期'] || '') + "　" + (it['時間'] || '')),
                        fieldRow("事故地點", it['地點']),
                        fieldRow("事故類別", it['類別']),
                        fieldRow("事故經過", it['描述']),
                        fieldRow("處理經過與結果", it['處理經過']),
                        fieldRow("現場相關人員", it['相關人員']),
                        fieldRow("回報人員", (it['工號'] || '') + "　" + (it['姓名'] || '')),
                        fieldRow("提交時間", it['提交時間']),
                        React.createElement("div", { style: { marginBottom: '12px' } },
                            React.createElement("div", { style: { fontSize: '12px', color: 'var(--primary)', marginBottom: '3px' } }, "現場照片"),
                            photoLinks(it['照片連結'])
                        )
                    ),
                    React.createElement("div", { className: "card" },
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--primary)', marginBottom: '10px', fontWeight: 700 } }, "更新處理狀態"),
                        React.createElement("div", { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                            REPORT_STATUS.map(st => {
                                const active = it['狀態'] === st;
                                const c = STATUS_COLORS[st];
                                return React.createElement("button", { key: st, disabled: updating, onClick: () => changeStatus(it, st),
                                    style: { padding: '12px', borderRadius: '10px', fontSize: '14px', fontWeight: 700, cursor: updating ? 'default' : 'pointer',
                                        border: '1px solid ' + c + (active ? '' : '55'), background: active ? c : c + '15', color: active ? '#0A0C10' : c } }, st);
                            })
                        )
                    ),
                    canDelete && React.createElement("button", { disabled: updating, onClick: () => deleteItem(it),
                        style: { width: '100%', marginTop: '12px', padding: '13px', borderRadius: '10px', fontSize: '14px', fontWeight: 700,
                            cursor: updating ? 'default' : 'pointer', border: '1px solid #F87171', background: 'rgba(248,113,113,.12)', color: '#F87171' } },
                        "🗑️ 永久刪除此筆")
                );
            }

            // 清單頁
            const filtered = list.filter(r => {
                const s = r['狀態'] || '未讀';
                if (filter === 'all') return true;
                if (filter === 'unread') return s === '未讀';
                if (filter === 'pending') return s !== '未讀' && s !== '已處理'; // 處理中群組：待處理／已知悉再觀察／持續追蹤
                if (filter === 'done') return s === '已處理';
                return true;
            });
            const tabBtn = (key, label) => React.createElement("button", { onClick: () => setFilter(key),
                style: { flex: 1, padding: '8px 4px', borderRadius: '8px', fontSize: '13px', fontWeight: 700, cursor: 'pointer',
                    border: '1px solid var(--border)', background: filter === key ? 'var(--primary)' : 'transparent', color: filter === key ? '#0A0C10' : 'var(--text-muted)' } }, label);

            return React.createElement("div", { className: "container" }, header,
                React.createElement("div", { className: "logo-area", style: { marginBottom: '12px' } },
                    React.createElement("div", { className: "title-main" }, "事故報告審閱"),
                    React.createElement("div", { className: "title-sub" }, "TIANYING SECURITY · DATA SYSTEM")
                ),
                React.createElement("div", { style: { display: 'flex', gap: '8px', marginBottom: '14px' } },
                    tabBtn('unread', '未讀'), tabBtn('pending', '待處理'), tabBtn('done', '已處理'), tabBtn('all', '全部')
                ),
                loading ? React.createElement("div", { className: "card", style: { textAlign: 'center', padding: '40px' } }, React.createElement("i", { className: "ti ti-loader-2 spin", style: { fontSize: '28px', color: 'var(--primary)' } })) :
                filtered.length === 0 ? React.createElement("div", { className: "card", style: { textAlign: 'center', padding: '40px 20px', color: 'var(--text-muted)' } }, "目前沒有符合條件的報告") :
                React.createElement("div", { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
                    filtered.map(it => React.createElement("div", { key: it.row, className: "card", style: { cursor: 'pointer', padding: '14px', position: 'relative' }, onClick: () => openDetail(it, filtered.map(r => r.row)) },
                        canDelete && React.createElement("button", { onClick: e => { e.stopPropagation(); deleteItem(it); }, title: "刪除",
                            style: { position: 'absolute', top: '8px', right: '8px', background: 'rgba(248,113,113,.12)', border: '1px solid #F8717155', color: '#F87171', borderRadius: '8px', padding: '3px 8px', fontSize: '13px', cursor: 'pointer', lineHeight: 1, zIndex: 2 } }, "🗑️"),
                        React.createElement("div", { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px', paddingRight: canDelete ? '34px' : '0' } },
                            React.createElement("span", { style: { fontSize: '13px', fontWeight: 700, color: 'var(--text)' } }, "#" + it['編號'] + "　" + (it['類別'] || '')),
                            StatusBadge(it['狀態'])
                        ),
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)' } },
                            React.createElement("i", { className: "ti ti-calendar-event", style: { marginRight: '4px' } }), (it['日期'] || '') + " " + (it['時間'] || '')),
                        React.createElement("div", { style: { fontSize: '13px', color: 'var(--text-muted)', marginTop: '2px' } },
                            React.createElement("i", { className: "ti ti-map-pin", style: { marginRight: '4px' } }), it['地點'] || '—')
                    ))
                ),
                React.createElement("div", { className: "footer" }, "© TIANYING SECURITY · INTERNAL SYSTEM")
            );
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = type === 'success' ? '#22C55E' : '#E53E3E';
            toast.style.color = '#fff';
            toast.innerHTML = `<i class="ti ti-${type === 'success' ? 'check' : 'alert-circle'}"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(mode === 'admin' ? AdminApp : App));
    </script>
</body>
</html>
